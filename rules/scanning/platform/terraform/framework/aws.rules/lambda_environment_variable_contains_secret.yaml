format: daksh-pattern-rule/v1
id: terraform.framework.aws.lambda_environment_variable_contains_secret
title: Lambda Environment Variable Contains Secret
order: 7
category: AWS Lambda Security
detection:
  pattern: (?i)resource\s+"aws_lambda_function"[^}]*environment\s*\{[^}]*variables\s*=\s*\{[^}]*(?:password|secret|api_key|token)\s*=\s*"[^"]{8,}"
  conditions:
  - WHEN PRESENT (?i)(?:password|secret|api_key|token)\s*=\s*"[^"]{8,}"
  - WHEN EXPR MISSING:aws_secretsmanager|var\.|data\.
reporting:
  type: area_of_interest
  reason: Detects hardcoded secrets in Lambda environment variable definitions.
  trace:
  - Externalized rule logic for Lambda Environment Variable Contains Secret.
  description: The code declares an entry point, model, destination, or configuration value that may cross a trust
    boundary. Identify callers, recipients, and the required data-access policy.
  impact: A boundary that trusts unauthorized callers or exposes private output may permit data disclosure or state
    changes. A declaration, address, or architectural marker alone does not establish such a failure.
  remediation: Trace the actual boundary, restrict accepted inputs and recipients, and enforce authentication and
    object-level authorization where required. Verify both authorized and denied use cases.
  reviewer: Confirm Lambda environment variables do not contain literal secret values. This can be confirmed as
    an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Determine whether the matched value is a real credential, key or token rather than a placeholder, public identifier
    or test fixture.
  - Inspect how it is used and where it is exposed, including source history, build artifacts, logs and deployment
    configuration.
  - Record the affected service and privileges without copying secret values into the review report.
  recommendations:
  - Keep real secrets out of source and public artifacts; obtain them through the deployment secret mechanism with
    restricted access.
  - If a credential has been exposed, revoke or rotate it and verify that old values no longer work; remove accidental
    logging and add a regression check.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '0'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: red
