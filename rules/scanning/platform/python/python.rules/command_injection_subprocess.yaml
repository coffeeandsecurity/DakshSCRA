format: daksh-pattern-rule/v1
id: python.core.command_injection_subprocess
title: "OS Command Injection Review"
order: 17
category: Command Injection
detection:
  pattern: subprocess\.run\(.*\)
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:(shell=True|input\(|request|params|query|argv) && MISSING:(shlex\.quote|list2cmdline|allowlist|whitelist)
reporting:
  type: area_of_interest
  reason: Detects instances of subprocess.run() that can lead to command injection vulnerabilities if used with
    untrusted input.
  trace:
  - 'Externalized rule logic for Command Injection: subprocess.'
  description: The code invokes an interpreter, process, dynamic expression, or template-execution mechanism. Trace
    executable selection and evaluated content to their trust boundaries.
  impact: If an attacker controls interpreted syntax or the operation selected, code or commands may run with the
    application’s privileges, allowing data theft, state changes, or service disruption.
  remediation: Replace externally influenced evaluation with fixed operations and data-only inputs. Use separate
    argument arrays for processes, allowlist permitted operations, and keep untrusted text out of executable templates
    or expressions.
  reviewer: Check for the secure usage of subprocess. run() and assess if user input is properly validated, sanitized,
    and appropriately used as command parameters. Ensure that developers have implemented strong input validation
    measures, command parameterization techniques, and proper context-aware security controls to mitigate command
    injection vulnerabilities. Also validate if safe alternatives or language constructs have been considered to
    minimize the risks associated with shell command execution. This can be confirmed as an issue when the matched
    path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Identify the executable, arguments, shell use and working directory; trace external influence over each.
  - Check whether a shell interprets metacharacters or whether options can change command behavior even without
    a shell.
  - Verify the operation is reachable and examine validation, executable selection and process privileges before
    confirming an issue.
  recommendations:
  - Prefer a library API or a fixed executable with a separate argument array; avoid passing external text to a
    shell.
  - Restrict permitted operations and arguments, constrain option handling, and test rejected input under the actual
    deployment privileges.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
