format: daksh-pattern-rule/v1
id: java.framework.mybatis.origin_response_review
title: Response Origin Policy Review
order: 950
category: Security Operation Context
detection:
  pattern: (?i)\b(?:setHeader|addHeader|set_header|Append|Add|Set|header|withHeader|insert_header|append_header|setValue|addValue)\s*\([^\r\n;]{0,128}["']Access-Control-Allow-Origin(?::[^"'\r\n]*)?["']|\b(?:headers|Headers)\s*\[\s*["']Access-Control-Allow-Origin["']\s*\]\s*=
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: A response-origin policy is declared or constructed. Trace the value into the response, including credential
    handling and environment overrides.
  description: A response-origin policy is declared or constructed. Trace the value into the response, including
    credential handling and environment overrides.
  impact: An attacker-selected origin can expose sensitive browser-readable responses if the effective policy and
    resource access permit it.
  remediation: Use exact approved origins and verify credentialed preflight and actual responses. Authentication
    and authorization remain independent controls.
  reviewer: Verify the exact source, operation and applicable controls. This is a review candidate, not a confirmed
    vulnerability.
  review_steps:
  - A response-origin policy is declared or constructed. Trace the value into the response, including credential
    handling and environment overrides.
  - Check the control on the actual path; unrelated markers must not suppress the candidate.
  - Validate a reachable unsafe case and a protected control before confirming the issue.
  recommendations:
  - Use exact approved origins and verify credentialed preflight and actual responses. Authentication and authorization
    remain independent controls.
scan_config:
  match_mode: line
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
