format: daksh-pattern-rule/v1
id: filepaths.core.logging
title: "Application Logging Review"
order: 24
detection:
  pattern: (?-i:(?:(?<![A-Za-z])(?i:logs?|logging|logger)(?=[A-Z_. /\\-]|$)|(?<=[a-z])(?:Log|Logging|Logger)(?=[A-Z_.
    /\\-]|$)))
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects file paths related to logging functionality.
  description: A file or directory name matches the logging review area. This check inspects paths, not the implementation
    or a reachable execution path.
  impact: Readers of exposed diagnostics may obtain credentials, private records, internal paths, or implementation
    details that enable account misuse or targeted attacks. A filename match alone does not establish this consequence.
  remediation: Keep sensitive values and detailed errors out of user-facing responses and routine logs. Redact before
    emission, restrict diagnostic access, and verify production logging configuration.
  reviewer: Verify the presence and secure implementation of logging functionality. This can be confirmed as an
    issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched file or directory contents and determine whether it is deployed or externally accessible.
  - Identify whether sensitive data, configuration or executable content is present; a name match alone does not
    establish exposure.
  - Check effective access controls and build or packaging exclusions and record the specific content and exposure
    path.
  recommendations:
  - Where exposure is verified, remove unnecessary files from deployment or restrict access to the intended users
    and processes.
  - Verify the deployed artifact and access behavior after the change; retain required application files with appropriate
    controls.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
