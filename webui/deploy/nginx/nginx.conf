map $arg_request_id $stream_trace_id {
    "~^[a-f0-9]{32}$" $arg_request_id;
    default $request_id;
}
map $http_x_request_id $trace_id {
    "~^[a-f0-9]{32}$" $http_x_request_id;
    default $stream_trace_id;
}
log_format traced escape=json '{"time":"$time_iso8601","error_code":"$trace_id","method":"$request_method","path":"$uri","status":$status,"upstream_status":"$upstream_status","upstream":"$upstream_addr","upstream_time":"$upstream_response_time","connection":"$connection"}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 25m;
    access_log /var/log/nginx/access.log traced;
    add_header X-Request-ID $trace_id always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain text/xml image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Request-ID $trace_id;
        proxy_hide_header X-Request-ID;
        proxy_intercept_errors on;
        error_page 502 = @backend_gateway;
        error_page 503 = @backend_unavailable;
        error_page 504 = @backend_timeout;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    location @backend_gateway {
        default_type application/json;
        return 502 '{"detail":"The backend is temporarily unavailable. Please try again shortly.","error_code":"$trace_id"}';
    }

    location @backend_unavailable {
        default_type application/json;
        return 503 '{"detail":"The backend is temporarily unavailable. Please try again shortly.","error_code":"$trace_id"}';
    }

    location @backend_timeout {
        default_type application/json;
        return 504 '{"detail":"The backend took too long to respond. Please try again.","error_code":"$trace_id"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
