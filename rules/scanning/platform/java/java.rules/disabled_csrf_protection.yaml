format: daksh-pattern-rule/v1
id: java.core.disabled_csrf_protection
title: "CSRF Protection Review"
order: 25
category: Disabled/Missing Security Controls
detection:
  pattern: \bcsrf\s*\(\s*\)\s*\.\s*disable\s*\(|\bcsrf\s*\(\s*(?:(?:\(\s*)?(?P<csrf_parameter>[A-Za-z_$]\w*)\s*\)?\s*->\s*(?:\{\s*)?(?P=csrf_parameter)\s*\.\s*disable\s*\(|(?:org\.springframework\.security\.config\.annotation\.web\.configurers\.)?(?:AbstractHttpConfigurer|CsrfConfigurer)\s*::\s*disable)|\bdisable\s*\(\s*['"]csrf['"]\s*\)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects explicit CSRF protection disabling. Resolve browser credentials and effective endpoint policy;
    unrelated token repositories or cookie attributes do not negate this operation.
  trace:
  - Source operation retained independently of unrelated file-level markers.
  description: The code disables, exempts, or configures request-forgery protection. Verify whether a reachable
    state-changing operation authenticates through automatically sent browser credentials.
  impact: An attacker may cause a victim’s browser to perform unwanted authenticated actions if the endpoint relies
    on ambient credentials and lacks an effective anti-forgery check.
  remediation: Enforce anti-forgery protection on cookie-authenticated state changes, validate origins where appropriate,
    and justify exemptions only for independently authenticated non-browser flows.
  reviewer: Verify that CSRF protection mechanisms are properly implemented and enabled for all relevant requests.
    Check for any instances where CSRF protection is explicitly disabled and assess the impact of such configurations.
    Also evaluate the effectiveness of the implemented CSRF protection measures in preventing CSRF attacks. This
    can be confirmed as an issue when the matched path is reachable and required controls are missing, weak, or
    inconsistent.
  review_steps:
  - Identify whether the reachable endpoint changes state and whether browsers attach authentication credentials
    automatically.
  - Inspect the effective anti-forgery check, accepted methods and content types, origin checks and intentional
    exemptions.
  - Test a cross-site request against the deployed authentication flow; distinguish token-based APIs from cookie-authenticated
    operations.
  recommendations:
  - Enforce the framework anti-forgery mechanism on state-changing browser-authenticated requests; keep exemptions
    narrow and documented.
  - Use appropriate cookie and origin protections as additional controls and test rejected cross-site requests.
scan_config:
  match_mode: file
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
