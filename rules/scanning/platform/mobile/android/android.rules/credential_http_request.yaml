format: daksh-pattern-rule/v1
id: mobile.android.core.credential_http_request
title: Credential Parameter in HTTP Request Review
order: 1102
category: Network Security
detection:
  pattern: \b\w+\s*\.\s*put\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: An enqueued Volley StringRequest returns a credential-named parameter and
    its locally resolved endpoint uses HTTP. This links the request body and URL rather
    than unrelated file keywords.
  description: An enqueued Volley StringRequest returns a credential-named parameter
    and its locally resolved endpoint uses HTTP. This links the request body and URL
    rather than unrelated file keywords.
  impact: Reusable plaintext credentials can be observed or modified in transit when
    this request executes and cleartext is permitted. Value protection, selected transport
    policy, release inclusion and server behavior require confirmation.
  remediation: Use authenticated HTTPS for credential-bearing requests, remove cleartext
    exceptions for sensitive endpoints, and avoid transmitting reusable passwords
    beyond the required login exchange.
  reviewer: Resolve the same returned parameter, endpoint, queue submission and selected
    network policy. An unresolved URL or unsupported request abstraction is a coverage
    limit, not proof of secure transport.
scan_config:
  match_mode: file
  context_lines_before: '2'
  context_lines_after: '3'
  aggregate: none
