format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_hostname_verifier_always_true
title: "TLS Hostname Validation Review"
order: 70
category: NETWORK Review
detection:
  pattern: \b(?:setHostnameVerifier\s*\(\s*\([^)]{0,160}\)\s*->\s*true|hostnameVerifier\s*=\s*HostnameVerifier\s*\{[^}]{0,160}->\s*true\s*\})
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The checked code or configuration bypasses a certificate, hostname, or server-trust decision. Resolve
    the effective callback and build configuration before confirming a production bypass. Resolve the exact declaration
    or operation in the selected build and identify its security boundary.
  impact: A network attacker may impersonate the intended server and read or modify traffic if the bypass accepts
    an untrusted certificate or mismatched hostname on a reachable connection.
  remediation: Restore platform certificate-chain and hostname validation. Reject invalid server trust, remove permissive
    callbacks and environment overrides from production, and use properly configured test trust stores for development.
    Apply the least-privilege platform control appropriate to the matched operation and verify the production configuration.
  reviewer: Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths;
    source evidence alone does not establish shipped or runtime behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Restore platform certificate-chain and hostname validation. Reject invalid server trust, remove permissive callbacks
    and environment overrides from production, and use properly configured test trust stores for development. Apply
    the least-privilege platform control appropriate to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
