format: daksh-pattern-rule/v1
id: terraform.framework.gcp.gcp_storage_bucket_without_uniform_access
title: "GCP Storage Access Policy Review"
order: 4
category: GCP Storage Security
detection:
  pattern: resource\s+"google_storage_bucket"[^}]*uniform_bucket_level_access\s*=\s*false
  conditions:
  - WHEN PRESENT uniform_bucket_level_access\s*=\s*false
  - WHEN EXPR PRESENT:uniform_bucket_level_access\s*=\s*false && MISSING:# intentional|# legacy|# migration
reporting:
  type: area_of_interest
  reason: Detects GCS buckets with fine-grained ACLs instead of uniform bucket-level access control.
  trace:
  - Externalized rule logic for GCP Storage Bucket Without Uniform Access.
  description: The bucket permits access control through object-level ACLs in addition to identity policies.
  impact: Inconsistent or overlooked ACLs may grant unintended access to private objects and make effective permission
    changes harder to audit.
  remediation: Prefer uniform bucket-level access when compatible. Otherwise inventory and constrain object ACLs
    and test effective access after policy changes.
  reviewer: Confirm uniform bucket-level access is enabled for all non-legacy buckets. This can be confirmed as
    an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Resolve the effective privileges, filesystem modes or identity grants, including inherited and deployment-level
    permissions.
  - Determine which operations are required and whether an untrusted actor can exercise the excess access.
  - Record the affected resource and effective policy; distinguish a declared capability from an exploitable authorization
    gap.
  recommendations:
  - Limit access and privileges to the operations and resources the application requires; remove unnecessary broad
    grants.
  - Test permitted operations and denied access with the actual deployment identity and effective policy.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
