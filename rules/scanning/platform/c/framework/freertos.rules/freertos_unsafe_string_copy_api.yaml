format: daksh-pattern-rule/v1
id: c.framework.freertos.freertos_unsafe_string_copy_api
title: "Buffer Bounds Review"
order: 1
category: Framework-Specific Security
detection:
  pattern: \b(strcpy|strcat|sprintf|gets)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:strlcpy|snprintf|strncpy|vTaskStacks|configMAX_TASK_NAME_LEN
reporting:
  type: area_of_interest
  reason: Detects unsafe string APIs common in memory-corruption vulnerabilities.
  trace:
  - Externalized rule logic for Freertos Unsafe String Copy API.
  description: The code calls a string-copy or formatting API without an explicit destination capacity. Review the
    actual buffer size, terminator space and source length for each call.
  impact: A write exceeding the destination capacity may corrupt memory or crash the process. The API call alone
    does not prove an overflow; constant strings and correctly sized buffers can be safe.
  remediation: Prefer bounded operations and verify their size and termination contracts. Where an unbounded call
    remains, establish and test the destination-capacity invariant.
  reviewer: Compare the exact destination capacity with every possible input length. Do not infer either a vulnerability
    or a mitigation from unrelated calls elsewhere in the file.
  review_steps:
  - Inspect buffer capacity, index bounds, integer conversions and ownership at the matched operation and its callers.
  - Check initialization, aliases, lifetime and cleanup on success, exception and early-return paths; identify external
    influence over sizes or values.
  - Verify a concrete unsafe access or lifetime condition. A low-level API or allocation alone does not prove memory
    corruption.
  recommendations:
  - Use bounded operations, checked size calculations and explicit ownership or automatic resource management appropriate
    to the language.
  - Test boundary sizes and failure paths; use memory diagnostics where available to verify the specific correction.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: magenta
