format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_sensitive_preference_write
title: "Preferences Data Storage Review"
order: 86
category: STORAGE Review
detection:
  pattern: (?i)\b(?P<receiver>[A-Za-z_]\w*)\s*\.\s*putString\s*\(\s*"(?:password|passwd|token|access_token|refresh_token|secret|credential)"\s*,\s*(?P<value>[^;\n]{1,200})\)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A preferences editor writes a value under a credential-related key. Resolve the actual backing store
    and whether the value is protected; MODE_PRIVATE restricts access but does not encrypt stored values. Identify
    the value written, backing store and access class, including backup, restore, reinstall and logout behavior.
  impact: If the stored value is a reusable unprotected credential, access to application files or permitted backups
    may expose it and allow unauthorized account use.
  remediation: Avoid retaining passwords. Use revocable session credentials with appropriate platform-backed protection,
    minimize retention and exclude secrets from backups. Keep privileged secrets on the server, use appropriate
    device-backed secure storage for local credentials, and restrict backup and sharing to intended non-sensitive
    data.
  reviewer: Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after
    reinstall, and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store
    as protection.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall,
    and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Avoid retaining passwords. Use revocable session credentials with appropriate platform-backed protection, minimize
    retention and exclude secrets from backups. Keep privileged secrets on the server, use appropriate device-backed
    secure storage for local credentials, and restrict backup and sharing to intended non-sensitive data.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
