format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_overlay_permission
title: Cross-Application Overlay Capability
order: 77
category: PRIVACY Review
detection:
  pattern: <uses-permission(?:-sdk-23)?\b[^>]{0,500}\b[A-Za-z_][\w.-]*:name\s*=\s*["\x27](?:android\.permission\.SYSTEM_ALERT_WINDOW)["\x27]
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The application requests permission to draw over other applications. Identify the actual sensitive
    value and the recipients, retention and user-consent context of this exposure or capability.
  impact: An authorized overlay may obscure trusted interface elements or imitate prompts, enabling misleading interactions
    or credential capture if the feature is misused.
  remediation: Use overlays only for a transparent user-authorized feature. Avoid sensitive input capture, make
    overlays dismissible, and honor platform restrictions on protected screens. Minimize collection and retention,
    redact secret values, and apply the platform controls needed for sensitive UI and data sharing.
  reviewer: Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime;
    permission or API capability alone does not establish collection or malicious behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime; permission
    or API capability alone does not establish collection or malicious behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Use overlays only for a transparent user-authorized feature. Avoid sensitive input capture, make overlays dismissible,
    and honor platform restrictions on protected screens. Minimize collection and retention, redact secret values,
    and apply the platform controls needed for sensitive UI and data sharing.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
