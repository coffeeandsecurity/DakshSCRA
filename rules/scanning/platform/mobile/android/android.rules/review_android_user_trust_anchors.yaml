format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_user_trust_anchors
title: User-Installed Certificates Trusted
order: 35
category: NETWORK Review
detection:
  pattern: <certificates\b[^>]{0,300}\bsrc\s*=\s*["\x27]user["\x27]
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A network-security configuration includes user-installed certificate authorities in its trust anchors.
    Resolve debug overrides and domain-specific policies. Resolve the particular connection, host and client configuration
    selected by the shipped build.
  impact: A party able to install a trusted certificate on the device may intercept affected connections if that
    certificate is accepted by the effective production trust policy.
  remediation: Limit user-installed trust anchors to justified development or managed-device scenarios. Keep debug
    overrides out of release builds and verify the selected domain trust policy. Use platform trust and hostname
    validation and encrypted transport. Remove permissive callbacks and narrow necessary exceptions to the intended
    hosts.
  reviewer: Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted
    client or HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or
    HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Limit user-installed trust anchors to justified development or managed-device scenarios. Keep debug overrides
    out of release builds and verify the selected domain trust policy. Use platform trust and hostname validation
    and encrypted transport. Remove permissive callbacks and narrow necessary exceptions to the intended hosts.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
