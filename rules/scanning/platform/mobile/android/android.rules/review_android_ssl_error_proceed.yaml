format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_ssl_error_proceed
title: WebView TLS Error Ignored
order: 51
category: NETWORK Review
detection:
  pattern: \b(?:handler|sslErrorHandler)\s*\.\s*proceed\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The checked code or configuration bypasses a certificate, hostname, or server-trust decision. Resolve
    the effective callback and build configuration before confirming a production bypass. Resolve the loaded content
    and frame origin, the exact WebView instance, and the native operations available to that content.
  impact: A network attacker may impersonate the intended server and read or modify traffic if the bypass accepts
    an untrusted certificate or mismatched hostname on a reachable connection.
  remediation: Restore platform certificate-chain and hostname validation. Reject invalid server trust, remove permissive
    callbacks and environment overrides from production, and use properly configured test trust stores for development.
    Restrict schemes and parsed hosts, isolate external content, and validate messages and permissions on the native
    side.
  reviewer: Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView
    beside an unsafe instance; JavaScript enablement alone is not a vulnerability.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Restore platform certificate-chain and hostname validation. Reject invalid server trust, remove permissive callbacks
    and environment overrides from production, and use properly configured test trust stores for development. Restrict
    schemes and parsed hosts, isolate external content, and validate messages and permissions on the native side.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
