format: daksh-pattern-rule/v1
id: mobile.ios.framework.swiftui.swiftui_dynamic_web_content_injection_marker
title: "WebView Script Execution Review"
order: 3
category: Framework-Specific Security
detection:
  pattern: WKWebView|evaluateJavaScript\(|JavaScriptEnabled
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects web content execution points in SwiftUI-integrated views.
  trace:
  - Externalized mobile rule logic for SwiftUI Dynamic Web Content Injection Marker.
  description: 'Review target: SwiftUI Dynamic Web Content Injection Marker. The application exposes script execution
    or a native interface to rendered web content. Resolve the content source and effective origin restrictions.
    Resolve the exact declaration or operation in the selected build and identify its security boundary.'
  impact: Attacker-controlled content may execute in a trusted page or invoke native operations, exposing application
    data or privileges when origin isolation and operation authorization are insufficient.
  remediation: Restrict loaded origins, avoid interpolating untrusted data into scripts, and expose only required
    native operations with input validation and per-operation authorization. Apply the least-privilege platform
    control appropriate to the matched operation and verify the production configuration.
  reviewer: Review web view wrappers and script execution boundaries. This can be confirmed as an issue when the
    matched path is reachable and required controls are missing, weak, or inconsistent. Check debug/release and
    product flavors, generated/native code, plugin boundaries and failure paths; source evidence alone does not
    establish shipped or runtime behavior.
  review_steps:
  - Identify the loaded content, permitted origins and script-to-native operations exposed by the application.
  - Inspect navigation, message validation and resource or operation authorization on the native side.
  - Test untrusted content and unexpected messages; a bridge declaration alone does not prove unauthorized native
    access.
  - Resolve the exact declaration or operation in the selected build and identify its security boundary.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Restrict trusted content and navigation and expose only the native operations required by the application.
  - Validate messages and enforce native-side authorization; test rejection of unapproved origins and unexpected
    operations.
  - Apply the least-privilege platform control appropriate to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: magenta
