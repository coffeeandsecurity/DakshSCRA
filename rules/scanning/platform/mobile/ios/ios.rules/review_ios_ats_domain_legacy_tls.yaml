format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_ats_domain_legacy_tls
title: "TLS Protocol Version Review"
order: 44
category: NETWORK Review
detection:
  pattern: <key>NSExceptionMinimumTLSVersion</key>
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: Transport configuration permits a legacy minimum TLS protocol version. Resolve the particular connection,
    host and client configuration selected by the shipped build.
  impact: Connections that negotiate an obsolete protocol may lose expected transport protections and become more
    susceptible to protocol-specific interception or tampering attacks.
  remediation: Require supported TLS versions for affected endpoints, remove unnecessary legacy exceptions, and
    verify negotiated protocols against the server configuration. Use platform trust and hostname validation and
    encrypted transport. Remove permissive callbacks and narrow necessary exceptions to the intended hosts.
  reviewer: Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted
    client or HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or
    HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Require supported TLS versions for affected endpoints, remove unnecessary legacy exceptions, and verify negotiated
    protocols against the server configuration. Use platform trust and hostname validation and encrypted transport.
    Remove permissive callbacks and narrow necessary exceptions to the intended hosts.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
