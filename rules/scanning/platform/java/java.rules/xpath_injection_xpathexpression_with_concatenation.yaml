format: daksh-pattern-rule/v1
id: java.core.xpath_injection_xpathexpression_with_concatenation
title: "XPath Injection Review"
order: 39
category: XPath Injection
detection:
  pattern: xpath\.evaluate\s*\(|XPathExpression\.evaluate\s*\(|XPath\.compile\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:request|getParameter|input|query|\+ && MISSING:XPathVariableResolver|parameterized|encodeForXPath
reporting:
  type: area_of_interest
  reason: Detects XPath evaluation calls that may use user-supplied input in the expression.
  trace:
  - 'Externalized rule logic for XPath Injection: XPathExpression with Concatenation.'
  description: The code constructs a directory query, XPath expression, or naming-service lookup. Review which input
    controls query syntax or the lookup target.
  impact: Attacker-controlled query syntax may bypass intended selection or authorization and expose protected records.
    An attacker-selected naming-service target may also invoke unsafe remote resolution, depending on runtime behavior.
  remediation: Keep untrusted values out of expression structure and remote naming targets. Use context-appropriate
    parameter binding or escaping, fixed trusted lookup destinations, and least-privileged service credentials.
  reviewer: Inspect XPath expression construction for user-controlled string components. This can be confirmed as
    an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect how untrusted values enter the directory query, selection expression or naming-service lookup.
  - Distinguish data parameters from syntax and determine whether external input can alter the selected records
    or remote target.
  - Verify the exact API-specific escaping, binding or destination restrictions and resource authorization at the
    use point.
  recommendations:
  - Use the query API’s parameter mechanism or syntax-specific escaping for data values; restrict externally selected
    lookup destinations.
  - Test that unusual input cannot alter query structure or bypass access controls; avoid substituting generic sanitization
    for the required control.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
