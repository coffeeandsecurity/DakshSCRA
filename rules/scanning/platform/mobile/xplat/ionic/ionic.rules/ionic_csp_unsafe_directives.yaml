format: daksh-pattern-rule/v1
id: mobile.xplat.ionic.core.ionic_csp_unsafe_directives
title: "Content Security Policy Review"
order: 6
category: Framework-Specific Security
detection:
  pattern: unsafe-inline|unsafe-eval
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects weak CSP directives often used in webview apps.
  trace:
  - Externalized mobile rule logic for Ionic/CSP Unsafe Directives.
  description: 'Review target: Ionic/CSP Unsafe Directives. Browser or embedded-renderer configuration relaxes an
    isolation or content-execution control. Determine which external content can reach the affected context. Resolve
    the exact declaration or operation in the selected build and identify its security boundary.'
  impact: Untrusted page content may cross an intended browser or renderer boundary, execute privileged operations,
    or access protected data when the relaxed control exposes those capabilities.
  remediation: Restore origin and process isolation, keep privileged APIs out of untrusted renderers, and use a
    restrictive content-security policy without unnecessary unsafe execution directives. Apply the least-privilege
    platform control appropriate to the matched operation and verify the production configuration.
  reviewer: Review index.html/meta headers/CSP configuration files. This can be confirmed as an issue when the matched
    path is reachable and required controls are missing, weak, or inconsistent. Check debug/release and product
    flavors, generated/native code, plugin boundaries and failure paths; source evidence alone does not establish
    shipped or runtime behavior.
  review_steps:
  - Identify the loaded content, permitted origins and script-to-native operations exposed by the application.
  - Inspect navigation, message validation and resource or operation authorization on the native side.
  - Test untrusted content and unexpected messages; a bridge declaration alone does not prove unauthorized native
    access.
  - Resolve the exact declaration or operation in the selected build and identify its security boundary.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Restrict trusted content and navigation and expose only the native operations required by the application.
  - Validate messages and enforce native-side authorization; test rejection of unapproved origins and unexpected
    operations.
  - Apply the least-privilege platform control appropriate to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: yellow
