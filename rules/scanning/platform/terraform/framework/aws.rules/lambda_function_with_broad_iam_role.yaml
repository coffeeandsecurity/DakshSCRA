format: daksh-pattern-rule/v1
id: terraform.framework.aws.lambda_function_with_broad_iam_role
title: "Lambda IAM Role Review"
order: 6
category: AWS Lambda Security
detection:
  pattern: resource\s+"aws_iam_role_policy"[^}]*lambda[^}]*Action\s*":\s*"\*"
  conditions:
  - WHEN PRESENT resource\s+"aws_iam_role_policy"[^}]*Action\s*":\s*"\*"
  - WHEN EXPR PRESENT:AdministratorAccess|arn:aws:iam::aws:policy/AdministratorAccess|"\*".*"Allow" && MISSING:#
    intentional|# required|boundary|permission_boundary
reporting:
  type: area_of_interest
  reason: Detects Lambda execution roles with wildcard Action policies.
  trace:
  - Externalized rule logic for Lambda Function with Broad IAM Role.
  description: The code or deployment configuration requests privileges or grants access beyond an explicitly resolved
    minimum. Determine the effective permissions and the operation’s requirements.
  impact: A compromised actor may access additional data, modify protected resources, or extend compromise beyond
    the intended application boundary when excessive privileges remain available.
  remediation: Run with the least privileges required, remove unnecessary grants, and scope each permission to its
    intended resource and operation. Verify effective inherited permissions and test denied access.
  reviewer: Confirm Lambda IAM roles follow least-privilege. This can be confirmed as an issue when the matched
    path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Resolve the effective privileges, filesystem modes or identity grants, including inherited and deployment-level
    permissions.
  - Determine which operations are required and whether an untrusted actor can exercise the excess access.
  - Record the affected resource and effective policy; distinguish a declared capability from an exploitable authorization
    gap.
  recommendations:
  - Limit access and privileges to the operations and resources the application requires; remove unnecessary broad
    grants.
  - Test permitted operations and denied access with the actual deployment identity and effective policy.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
