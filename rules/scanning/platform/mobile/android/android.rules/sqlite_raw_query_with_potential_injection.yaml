format: daksh-pattern-rule/v1
id: mobile.android.core.sqlite_raw_query_with_potential_injection
title: "SQL Query Construction Review"
order: 15
category: Insecure Code Patterns
detection:
  pattern: \.rawQuery\s*\(|\.execSQL\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects direct SQLite rawQuery or execSQL calls that may construct queries without parameterisation.
  trace:
  - Externalized mobile rule logic for SQLite Raw Query with Potential Injection.
  description: 'Review target: SQLite Raw Query with Potential Injection. The checked source contains a database
    query or query-construction operation. Determine whether untrusted values can change statement structure and
    whether record access is authorized. Resolve the exact declaration or operation in the selected build and identify
    its security boundary.'
  impact: If externally controlled values enter query syntax, an attacker may read, change, or delete records or
    bypass data-access restrictions with the database connection’s privileges. Fixed queries and correctly bound
    parameters do not establish this condition.
  remediation: Bind data values as parameters, choose dynamic identifiers from a fixed allowlist, and enforce object-level
    access checks. Trace the complete query construction before replacing a safe query. Apply the least-privilege
    platform control appropriate to the matched operation and verify the production configuration.
  reviewer: Verify that all rawQuery/execSQL calls use ? placeholders with a corresponding selectionArgs array.
    This can be confirmed as an issue when the matched path is reachable and required controls are missing, weak,
    or inconsistent. Check debug/release and product flavors, generated/native code, plugin boundaries and failure
    paths; source evidence alone does not establish shipped or runtime behavior.
  review_steps:
  - Locate the final query and determine whether caller-controlled data can alter its structure; inspect interpolated
    fragments and raw-query helpers.
  - Verify that values are bound by the database driver. For identifiers or sort directions that cannot be bound,
    inspect a fixed mapping of allowed choices.
  - Record the reachable caller and effective controls; a constant query or correctly bound value does not establish
    injection.
  - Resolve the exact declaration or operation in the selected build and identify its security boundary.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Bind data values with the driver or ORM parameter API; avoid constructing query syntax from external strings.
  - Use fixed mappings for dynamic identifiers and ordering. Test that unusual input remains data and that the database
    account has only required privileges.
  - Apply the least-privilege platform control appropriate to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '3'
  context_lines_after: '0'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
