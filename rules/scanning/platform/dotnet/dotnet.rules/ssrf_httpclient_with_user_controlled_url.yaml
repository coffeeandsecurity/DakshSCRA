format: daksh-pattern-rule/v1
id: dotnet.core.ssrf_httpclient_with_user_controlled_url
title: "Server-Side Request Forgery Review"
order: 25
category: Server-Side Request Forgery (SSRF)
detection:
  pattern: \b[A-Za-z_]\w*\s*\.\s*(?:GetAsync|PostAsync|PutAsync|DeleteAsync|SendAsync|GetStringAsync|GetByteArrayAsync)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Review HttpClient requests with unresolved destinations. Address syntax checks and unrelated allowlist markers do
    not establish destination restrictions.
  trace:
  - 'Externalized rule logic for SSRF: HttpClient with User-Controlled URL.'
  description: The application makes an outbound request whose destination may be influenced by external data. Resolve URL
    construction, redirects, DNS results, and network reachability.
  impact: If an attacker can select a reachable destination, the application may expose internal services or metadata credentials,
    or send protected data to an unauthorized recipient.
  remediation: Allowlist required destinations and protocols, validate resolved addresses and every redirect, and restrict
    outbound access to internal and metadata services.
  reviewer: Trace the request argument, BaseAddress, redirects and resolved destination. Verify who controls each value and
    whether destination restrictions apply to this request. A request operation alone is not proof of external control or
    exploitability.
  review_steps:
  - Verify the operation makes a server-side request, then trace external control over the URL, host, port and redirects.
  - Inspect destination restrictions, DNS resolution and redirect handling; distinguish fixed destinations from caller-controlled
    requests.
  - Check deployment egress controls and whether internal services or local files are reachable from the requesting process.
  recommendations:
  - Prefer fixed destinations or a restricted set of permitted services; validate schemes, hosts and ports before the request.
  - Apply destination checks to redirects and resolved addresses where applicable, restrict network egress, and test prohibited
    destinations.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
