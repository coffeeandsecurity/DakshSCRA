# Global defaults for review planning. These are assumptions, not calibrated facts.
model_version: '2.1'
assumptions:
  hours_per_day: 8
  # Rate bounds: the higher LOC/hour value produces the lower time estimate.
  inspection_loc_per_hour: [135, 162.5]
  active_minutes: [8, 20]
  confirmed_minutes: [8, 20]
  manual_active_minutes: [8, 20]
  manual_confirmed_minutes: [8, 20]
  manual_suppressed_minutes: [3, 10]
  manual_unresolved_minutes: [15, 45]
  suppressed_minutes: [3, 10]
  unresolved_minutes: [15, 45]
  trace_step_minutes: [0.25, 1]
  manual_trace_step_minutes: [1, 3]
  assisted_setup_hours: [1, 3]
  manual_setup_hours: [3, 4]
  manual_file_minutes: [1, 2]
  domain_exploration_hours: [1, 4]
  report_base_hours: [1, 2]
  report_unit_minutes: [3, 8]
  # Inspection includes normal investigation; pool additional evidence work.
  evidence_budget_fraction: [0.18, 0.18]
  # Explicit planning targets, configurable using measured team baselines.
  assisted_effort_fraction: [0.5, 0.5]
  ai_effort_fraction: [0.1, 0.1]
