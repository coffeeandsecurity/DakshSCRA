format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_component_access_boundary
title: "Exported Component Access Review"
order: 68
category: PLATFORM Review
detection:
  pattern: \b[A-Za-z_][\w.-]*:exported\s*=\s*["\x27]true["\x27]|<intent-filter\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: An Android component or receiver exposes an entry point with a weak or unresolved caller permission
    boundary. Manifest merging and runtime authorization may affect the effective policy. Resolve the exact declaration
    or operation in the selected build and identify its security boundary.
  impact: An unauthorized application may invoke exposed operations, read protected data, or change application
    state if no effective caller check protects the entry point.
  remediation: Disable external access when it is unnecessary. Otherwise use suitable signature permissions or explicit
    caller authorization, validate all incoming data, and test access from an untrusted application. Apply the least-privilege
    platform control appropriate to the matched operation and verify the production configuration.
  reviewer: Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths;
    source evidence alone does not establish shipped or runtime behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Disable external access when it is unnecessary. Otherwise use suitable signature permissions or explicit caller
    authorization, validate all incoming data, and test access from an untrusted application. Apply the least-privilege
    platform control appropriate to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
