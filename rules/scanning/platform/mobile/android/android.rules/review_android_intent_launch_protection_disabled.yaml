format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_intent_launch_protection_disabled
title: Intent Redirection Protection Disabled
order: 47
category: PLATFORM Review
detection:
  pattern: \bremoveLaunchSecurityProtection\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: Intent or PendingIntent configuration permits mutation, unsafe implicit delivery, or bypass of intent-redirection
    protection. Resolve the intended recipient and effective flags. Resolve the external entry point, its caller
    or URI grant, and the sensitive operation or resource reached.
  impact: An untrusted recipient or input may redirect execution or alter an operation performed under the application’s
    identity if mutable fields or an implicit target cross a trust boundary.
  remediation: Prefer explicit destinations and immutable PendingIntents. Where mutation is required, tightly constrain
    recipients and fill-in fields, validate nested intents, and retain platform redirection protections. Minimize
    exported surfaces and URI grants; validate parsed schemes, hosts and paths, use verified links where appropriate,
    and authorize each sensitive action.
  reviewer: Resolve merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded
    paths, nested intents, read/write grants and permission inheritance. Registration or permission presence alone
    does not prove unauthorized access.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Resolve merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded paths,
    nested intents, read/write grants and permission inheritance. Registration or permission presence alone does
    not prove unauthorized access.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Prefer explicit destinations and immutable PendingIntents. Where mutation is required, tightly constrain recipients
    and fill-in fields, validate nested intents, and retain platform redirection protections. Minimize exported
    surfaces and URI grants; validate parsed schemes, hosts and paths, use verified links where appropriate, and
    authorize each sensitive action.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
