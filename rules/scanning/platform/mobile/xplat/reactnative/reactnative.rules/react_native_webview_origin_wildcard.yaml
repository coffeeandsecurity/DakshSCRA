format: daksh-pattern-rule/v1
id: mobile.xplat.reactnative.core.react_native_webview_origin_wildcard
title: "WebView Navigation Policy Review"
order: 11
category: Framework-Specific Security
detection:
  pattern: originWhitelist\s*=\s*\{?\s*\[\s*[\'\"]\*[\'\"]
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects wildcard origin allowlist in React Native WebView.
  trace:
  - Externalized mobile rule logic for React Native WebView Origin Wildcard.
  description: 'Review target: React Native WebView Origin Wildcard. A browser-origin or navigation policy permits
    a broad set of external origins or destinations. Identify the resources and privileged interfaces covered by
    the effective policy. Resolve the loaded content and frame origin, the exact WebView instance, and the native
    operations available to that content.'
  impact: An untrusted site may read protected responses or invoke privileged interfaces if a permissive policy
    admits it and independent authentication or authorization does not prevent the operation.
  remediation: Allow only required trusted origins and destinations. Validate origin and message schemas, handle
    credentials deliberately, and enforce access controls independently of the origin policy. Restrict schemes and
    parsed hosts, isolate external content, and validate messages and permissions on the native side.
  reviewer: Validate WebView origin restrictions and navigation policies. This can be confirmed as an issue when
    the matched path is reachable and required controls are missing, weak, or inconsistent. Test subframes, redirects,
    javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside an unsafe instance; JavaScript
    enablement alone is not a vulnerability.
  review_steps:
  - Determine what capability or review marker is declared and whether it changes the deployed application’s behavior.
  - Inspect the effective runtime policy and the content, actors or operations that can use the capability.
  - Record a concrete security consequence where established; otherwise keep the result as an investigation area.
  - Resolve the loaded content and frame origin, the exact WebView instance, and the native operations available
    to that content.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Limit the capability to the application’s required behavior and enforce the relevant runtime controls.
  - Verify the deployed artifact and add a regression check for the behavior that justified any correction.
  - Restrict schemes and parsed hosts, isolate external content, and validate messages and permissions on the native
    side.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: magenta
