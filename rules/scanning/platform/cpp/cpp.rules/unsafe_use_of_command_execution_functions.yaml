format: daksh-pattern-rule/v1
id: cpp.core.unsafe_use_of_command_execution_functions
title: "OS Command Injection Review"
order: 2
category: Untrusted Input Handling or Injection Flaws
detection:
  pattern: \b(?:system|popen|exec|execl|execv|execle|execve|execlp|execvp|execvpe|execp|CreateProcess(?:A|W)?|ShellExecute(?:Ex)?(?:A|W)?|WinExec|(?:g_)?spawn_command_line_(?:async|sync))\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: A process-launch API is present. Review executable selection, argument boundaries and caller trust; a
    validation helper elsewhere in the file does not establish safety.
  trace:
  - Externalized rule logic for Unsafe Use of Command Execution Functions.
  description: The code invokes an interpreter, process, dynamic expression, or template-execution mechanism. Trace
    executable selection and evaluated content to their trust boundaries.
  impact: If an attacker controls interpreted syntax or the operation selected, code or commands may run with the
    application’s privileges, allowing data theft, state changes, or service disruption.
  remediation: Replace externally influenced evaluation with fixed operations and data-only inputs. Use separate
    argument arrays for processes, allowlist permitted operations, and keep untrusted text out of executable templates
    or expressions.
  reviewer: Reviewers should ensure that calls to command execution functions are justified, that inputs are thoroughly
    sanitized, and that safer alternatives are considered. Look for proper error handling and minimal privileges
    when interacting with system resources. This can be confirmed as an issue when the matched path is reachable
    and required controls are missing, weak, or inconsistent.
  review_steps:
  - Identify who can supply the matched input, including stored values and upstream services; record its type, size
    limits and trust boundary.
  - Trace the value through transformations to each sensitive operation. Check the protection at that destination
    and resource-level authorization.
  - Inspect the actual validation or protection implementation and its error path. A nearby keyword or a client-side
    check alone is insufficient evidence.
  recommendations:
  - Use server-side type, length and allowed-value checks appropriate to the input. For free-form text, preserve
    legitimate characters and protect each destination separately.
  - Bind database values as parameters, encode output for its rendering context, and constrain file or network destinations
    where applicable. Test rejected input and unauthorized access.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
