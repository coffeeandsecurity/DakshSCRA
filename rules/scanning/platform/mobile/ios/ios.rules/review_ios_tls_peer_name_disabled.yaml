format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_tls_peer_name_disabled
title: "TLS Hostname Validation Review"
order: 55
category: NETWORK Review
detection:
  pattern: \bkCFStreamSSLPeerName\s*(?:\]\s*=|:|=)\s*(?:NSNull\s*\(|kCFNull\b)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A stream SSL configuration explicitly disables the peer-name check. Verify the configuration is used
    by a reachable connection and inspect any independent hostname validation. Resolve the particular connection,
    host and client configuration selected by the shipped build.
  impact: A network attacker with a certificate valid for another name may impersonate the expected endpoint if
    certificate-to-hostname matching is disabled without an equivalent check.
  remediation: Retain certificate chain validation and match the peer name to the intended host. Remove null peer-name
    overrides from production connection settings. Use platform trust and hostname validation and encrypted transport.
    Remove permissive callbacks and narrow necessary exceptions to the intended hosts.
  reviewer: Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted
    client or HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or
    HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Retain certificate chain validation and match the peer name to the intended host. Remove null peer-name overrides
    from production connection settings. Use platform trust and hostname validation and encrypted transport. Remove
    permissive callbacks and narrow necessary exceptions to the intended hosts.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
