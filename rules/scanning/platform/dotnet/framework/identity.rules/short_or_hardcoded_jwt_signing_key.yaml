format: daksh-pattern-rule/v1
id: dotnet.framework.identity.short_or_hardcoded_jwt_signing_key
title: "JWT Signing Key Review"
order: 3
category: Framework-Specific Issues - ASP.NET Core Identity
detection:
  pattern: IssuerSigningKey\s*=\s*new\s+SymmetricSecurityKey\s*\(\s*Encoding\.[^.]+\.GetBytes\s*\(\s*["'][^"']{1,31}["']\s*\)\s*\)
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:Configuration\[|GetEnvironmentVariable|_secretsManager
reporting:
  type: area_of_interest
  reason: Detects hardcoded JWT symmetric signing keys shorter than 32 characters.
  trace:
  - Externalized rule logic for Short or Hardcoded JWT Signing Key.
  description: The checked source or build configuration embeds potentially sensitive credential or key material.
    Determine whether it is active and whether it reaches distributed artifacts or logs.
  impact: A party who can read exposed source, artifacts, configuration, or logs may recover active secrets and
    access the protected service or decrypt data with the secret owner’s privileges.
  remediation: Remove active secrets from source and build layers, rotate exposed values, and load replacements
    through a restricted secret-management facility. Use narrowly privileged, short-lived credentials.
  reviewer: Confirm JWT signing keys are loaded from secure configuration and are of sufficient length. This can
    be confirmed as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Determine whether the matched value is a real credential, key or token rather than a placeholder, public identifier
    or test fixture.
  - Inspect how it is used and where it is exposed, including source history, build artifacts, logs and deployment
    configuration.
  - Record the affected service and privileges without copying secret values into the review report.
  recommendations:
  - Keep real secrets out of source and public artifacts; obtain them through the deployment secret mechanism with
    restricted access.
  - If a credential has been exposed, revoke or rotate it and verify that old values no longer work; remove accidental
    logging and add a regression check.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '0'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: red
