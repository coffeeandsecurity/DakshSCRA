format: daksh-pattern-rule/v1
id: mobile.xplat.ionic.core.review_ionic_capacitor_debugging
title: "WebView Debugging Policy Review"
order: 12
category: RESILIENCE Review
detection:
  pattern: \bwebContentsDebuggingEnabled\s*:\s*true\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: WebView remote debugging or inspection is explicitly enabled. Determine whether the setting reaches
    a distributed production build. Resolve the loaded content and frame origin, the exact WebView instance, and
    the native operations available to that content.
  impact: A party with access to the platform’s debugging interface may inspect page content, extract session data,
    or execute scripts in the application’s WebView when production debugging remains accessible.
  remediation: Enable WebView inspection only in verified development builds. Disable it in distributed releases
    and verify the setting in the final application artifact. Restrict schemes and parsed hosts, isolate external
    content, and validate messages and permissions on the native side.
  reviewer: Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView
    beside an unsafe instance; JavaScript enablement alone is not a vulnerability.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Enable WebView inspection only in verified development builds. Disable it in distributed releases and verify
    the setting in the final application artifact. Restrict schemes and parsed hosts, isolate external content,
    and validate messages and permissions on the native side.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
