format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_keychain_access_group_surface
title: Shared Keychain Access Group
order: 46
category: STORAGE Review
detection:
  pattern: <key>keychain-access-groups</key>
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The application declares a keychain access group that may share items across authorized applications.
    Identify the value written, backing store and access class, including backup, restore, reinstall and logout
    behavior.
  impact: Sensitive keychain items may become accessible to other applications in the permitted group, expanding
    the credential trust boundary beyond a single application.
  remediation: Use narrowly scoped access groups, share only deliberately selected items, and verify entitlement
    membership and item access controls for every participating application. Keep privileged secrets on the server,
    use appropriate device-backed secure storage for local credentials, and restrict backup and sharing to intended
    non-sensitive data.
  reviewer: Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after
    reinstall, and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store
    as protection.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall,
    and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Use narrowly scoped access groups, share only deliberately selected items, and verify entitlement membership
    and item access controls for every participating application. Keep privileged secrets on the server, use appropriate
    device-backed secure storage for local credentials, and restrict backup and sharing to intended non-sensitive
    data.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
