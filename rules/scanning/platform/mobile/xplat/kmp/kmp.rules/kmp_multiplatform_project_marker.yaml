format: daksh-pattern-rule/v1
id: mobile.xplat.kmp.core.kmp_multiplatform_project_marker
title: "Multiplatform Project Review"
order: 3
category: Framework-Specific Issues - Kotlin Multiplatform
detection:
  pattern: kotlin\(\"multiplatform\"\)|org\.jetbrains\.kotlin\.multiplatform|kotlin-multiplatform
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  description: 'Review target: KMP Multiplatform Project Marker. The code contains a maintainability, accessibility,
    or build-configuration review marker. Establish a concrete affected behavior before assigning security severity.
    Resolve the exact declaration or operation in the selected build and identify its security boundary.'
  impact: No direct confidentiality or integrity consequence is established by this marker alone. A related implementation
    defect could affect availability or prevent users from using essential controls, depending on the actual behavior.
  remediation: Resolve the specific unfinished behavior, accessibility requirement, or build hygiene concern. Confirm
    its real operational effect and test the corrected behavior before classifying it as a security defect. Apply
    the least-privilege platform control appropriate to the matched operation and verify the production configuration.
  reviewer: Confirm the project is Kotlin Multiplatform and inspect shared mobile code paths. This can be confirmed
    as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent. Check
    debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source evidence
    alone does not establish shipped or runtime behavior.
  review_steps:
  - Inspect the matched construct in its containing function or configuration and identify the security-sensitive
    behavior under review.
  - Verify reachable callers, external influence and effective protections, including deployment overrides and failure
    paths.
  - Record concrete evidence for a confirmed issue or a justified suppression; retain an unresolved outcome when
    the required evidence is unavailable.
  - Resolve the exact declaration or operation in the selected build and identify its security boundary.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Apply the rule-specific correction above only after verifying the affected behavior and required control.
  - Add a regression case for the unsafe condition and a valid protected case; verify the effective behavior in
    the relevant deployment.
  - Apply the least-privilege platform control appropriate to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: cyan
