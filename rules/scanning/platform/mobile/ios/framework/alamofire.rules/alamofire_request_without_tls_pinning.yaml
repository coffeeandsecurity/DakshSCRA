format: daksh-pattern-rule/v1
id: mobile.ios.framework.alamofire.alamofire_request_without_tls_pinning
title: "Alamofire Certificate Pinning Review"
order: 2
category: Framework-Specific Issues - Alamofire (iOS)
detection:
  pattern: AF\.request\s*\(|Session\.default\s*\.|Alamofire\.request\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects Alamofire sessions making requests without a configured ServerTrustManager for pinning.
  trace:
  - Externalized mobile rule logic for Alamofire Request Without TLS Pinning.
  description: 'Review target: Alamofire Request Without TLS Pinning. The code configures an additional server or
    update authenticity mechanism. Confirm the intended trust boundary and effective verification policy. Resolve
    the particular connection, host and client configuration selected by the shipped build.'
  impact: If the intended authenticity check is absent or can be bypassed, a party controlling an otherwise accepted
    certificate or update source may impersonate a trusted endpoint or supply unauthorized code. Pinning absence
    alone does not prove broken TLS.
  remediation: Document the required authenticity policy, verify signatures or the intended certificate or public-key
    pins, and test key rotation and failure behavior without disabling normal platform validation. Use platform
    trust and hostname validation and encrypted transport. Remove permissive callbacks and narrow necessary exceptions
    to the intended hosts.
  reviewer: Confirm sensitive API calls use sessions with explicit trust evaluation policies. This can be confirmed
    as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent. Test
    invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or HTTPS
    URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  review_steps:
  - Inspect the matched construct in its containing function or configuration and identify the security-sensitive
    behavior under review.
  - Verify reachable callers, external influence and effective protections, including deployment overrides and failure
    paths.
  - Record concrete evidence for a confirmed issue or a justified suppression; retain an unresolved outcome when
    the required evidence is unavailable.
  - Resolve the particular connection, host and client configuration selected by the shipped build.
  - Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or
    HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Apply the rule-specific correction above only after verifying the affected behavior and required control.
  - Add a regression case for the unsafe condition and a valid protected case; verify the effective behavior in
    the relevant deployment.
  - Use platform trust and hostname validation and encrypted transport. Remove permissive callbacks and narrow necessary
    exceptions to the intended hosts.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '3'
  context_lines_after: '0'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: yellow
