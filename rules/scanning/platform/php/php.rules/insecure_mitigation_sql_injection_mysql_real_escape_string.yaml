format: daksh-pattern-rule/v1
id: php.core.insecure_mitigation_sql_injection_mysql_real_escape_string
title: "SQL Escaping Review"
order: 20
category: Insecure Mitigations
detection:
  pattern: mysql_real_escape_string
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:mysql_real_escape_string|addslashes
reporting:
  type: area_of_interest
  reason: Detects the usage of the mysql_real_escape_string function for SQL injection mitigation.
  trace:
  - 'Externalized rule logic for Insecure Mitigation: SQL Injection (mysql_real_escape_string).'
  description: The code contains a security-control marker. Its presence is a review surface rather than evidence
    that the control is defective or consistently enforced.
  impact: No adverse security consequence follows from the presence of a protection alone. If it is bypassed or
    applied outside the correct context, the protected operation may still permit injection or unauthorized access.
  remediation: Verify that the control applies to every relevant entry point and uses the required context and policy.
    Retain effective protections; test bypass cases before recommending a change.
  reviewer: Inspect query construction around mysql_real_escape_string usage and parameterization controls. This
    can be confirmed as an issue when the matched path is reachable and required controls are missing, weak, or
    inconsistent.
  review_steps:
  - Locate the final query and determine whether caller-controlled data can alter its structure; inspect interpolated
    fragments and raw-query helpers.
  - Verify that values are bound by the database driver. For identifiers or sort directions that cannot be bound,
    inspect a fixed mapping of allowed choices.
  - Record the reachable caller and effective controls; a constant query or correctly bound value does not establish
    injection.
  recommendations:
  - Bind data values with the driver or ORM parameter API; avoid constructing query syntax from external strings.
  - Use fixed mappings for dynamic identifiers and ordering. Test that unusual input remains data and that the database
    account has only required privileges.
scan_config:
  match_mode: line
  context_lines_before: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
