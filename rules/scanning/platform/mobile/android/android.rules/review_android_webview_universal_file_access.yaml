format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_webview_universal_file_access
title: "WebView File Access Review"
order: 74
category: PLATFORM Review
detection:
  pattern: \b(?:setAllowUniversalAccessFromFileURLs\s*\(\s*true\s*\)|allowUniversalAccessFromFileURLs\s*=\s*true\b)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A file provider, plugin, or WebView permits access to a broad filesystem scope or relaxes file-origin
    isolation. Resolve the loaded content and frame origin, the exact WebView instance, and the native operations
    available to that content.
  impact: Untrusted content or a recipient with a usable file grant may read private files, disclose stored credentials,
    or access resources outside the directory intended for sharing.
  remediation: Expose only dedicated app-owned sharing directories. Keep WebView file-origin and universal access
    disabled where possible, validate navigation, and issue narrowly scoped temporary file grants only to intended
    recipients. Restrict schemes and parsed hosts, isolate external content, and validate messages and permissions
    on the native side.
  reviewer: Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView
    beside an unsafe instance; JavaScript enablement alone is not a vulnerability.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Expose only dedicated app-owned sharing directories. Keep WebView file-origin and universal access disabled
    where possible, validate navigation, and issue narrowly scoped temporary file grants only to intended recipients.
    Restrict schemes and parsed hosts, isolate external content, and validate messages and permissions on the native
    side.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
