format: daksh-pattern-rule/v1
id: c.core.improper_use_of_setrlimit_for_core_dump_prevention
title: "Core Dump Policy Review"
order: 20
category: Sensitive Information Handling
detection:
  pattern: \bsetrlimit\s*\(\s*RLIMIT_CORE\s*,\s*(?:0|NULL|nullptr)\s*\)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Review a null rlimit pointer passed to setrlimit. This does not configure zero limits; check the return
    value and pass a correctly initialized struct rlimit when disabling core dumps.
  trace:
  - Externalized rule logic for Improper Use of `setrlimit` for Core Dump Prevention.
  description: The code handles private data or configures build and process hardening. Determine which information
    is retained and what protection the deployed artifact actually supplies.
  impact: Insufficient memory, diagnostic, or build protections may make private values easier to recover or increase
    the consequences of another defect. Their absence alone does not establish an exploit path.
  remediation: Minimize private data lifetimes and diagnostic exposure, apply the platform’s appropriate hardening
    controls, and verify the final binary rather than inferring protection from source markers alone.
  reviewer: Check that setrlimit receives a valid struct rlimit pointer with the intended limits and that its return
    value is checked. A null pointer does not configure zero limits. This can be confirmed as an issue when the
    matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched construct in its containing function or configuration and identify the security-sensitive
    behavior under review.
  - Verify reachable callers, external influence and effective protections, including deployment overrides and failure
    paths.
  - Record concrete evidence for a confirmed issue or a justified suppression; retain an unresolved outcome when
    the required evidence is unavailable.
  recommendations:
  - Apply the rule-specific correction above only after verifying the affected behavior and required control.
  - Add a regression case for the unsafe condition and a valid protected case; verify the effective behavior in
    the relevant deployment.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
