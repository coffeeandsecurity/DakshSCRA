format: daksh-pattern-rule/v1
id: mobile.android.core.hardcoded_static_initialization_vector
title: "Static IV Review"
order: 27
category: Cryptographic Failures
detection:
  pattern: new\s+IvParameterSpec\s*\(|new\s+byte\s*\[\s*(?:8|12|16|24|32)\s*\]\s*\{
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects use of a hardcoded or static byte array as an AES/cipher initialization vector.
  trace:
  - Externalized mobile rule logic for Hardcoded Static Initialization Vector.
  description: 'Review target: Hardcoded Static Initialization Vector. The checked source or build configuration
    embeds potentially sensitive credential or key material. Determine whether it is active and whether it reaches
    distributed artifacts or logs. Determine whether the operation protects secrets, authenticates data or serves
    a non-security purpose; resolve algorithm, mode and key provenance.'
  impact: A party who can read exposed source, artifacts, configuration, or logs may recover active secrets and
    access the protected service or decrypt data with the secret owner’s privileges.
  remediation: Remove active secrets from source and build layers, rotate exposed values, and load replacements
    through a restricted secret-management facility. Use narrowly privileged, short-lived credentials. Use supported
    authenticated cryptography, securely generated keys and nonces, and platform-backed key storage; replace hardcoded
    or constant key material.
  reviewer: Confirm that IvParameterSpec is always constructed from a SecureRandom-generated byte array, not from
    a static, final, or hardcoded value. This can be confirmed as an issue when the matched path is reachable and
    required controls are missing, weak, or inconsistent. Distinguish checksums from authentication, asymmetric
    RSA transformations from symmetric ECB, and test IV/nonce reuse, fixed keys and algorithm migration.
  review_steps:
  - Determine whether the matched value is a real credential, key or token rather than a placeholder, public identifier
    or test fixture.
  - Inspect how it is used and where it is exposed, including source history, build artifacts, logs and deployment
    configuration.
  - Record the affected service and privileges without copying secret values into the review report.
  - Determine whether the operation protects secrets, authenticates data or serves a non-security purpose; resolve
    algorithm, mode and key provenance.
  - Distinguish checksums from authentication, asymmetric RSA transformations from symmetric ECB, and test IV/nonce
    reuse, fixed keys and algorithm migration.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Keep real secrets out of source and public artifacts; obtain them through the deployment secret mechanism with
    restricted access.
  - If a credential has been exposed, revoke or rotate it and verify that old values no longer work; remove accidental
    logging and add a regression check.
  - Use supported authenticated cryptography, securely generated keys and nonces, and platform-backed key storage;
    replace hardcoded or constant key material.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '4'
  context_lines_after: '1'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
