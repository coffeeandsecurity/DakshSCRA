format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_minification_disabled
title: Code Shrinking Configuration Review
order: 44
category: RESILIENCE Review
detection:
  pattern: \b(?:minifyEnabled\s+(?:=\s*)?false|isMinifyEnabled\s*=\s*false)\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A build configuration disables code shrinking in a non-debug or unresolved scope. This does not establish
    the final application’s release configuration. Resolve the exact declaration or operation in the selected build
    and identify its security boundary.
  impact: Disabled shrinking or obfuscation may make distributed code easier to inspect and increase retained attack
    surface; it does not create an access-control boundary or prove an exploitable vulnerability.
  remediation: Verify shrinking and obfuscation requirements against the final application release artifact. Keep
    secrets and trust decisions out of client code regardless of obfuscation. Apply the least-privilege platform
    control appropriate to the matched operation and verify the production configuration.
  reviewer: Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths;
    source evidence alone does not establish shipped or runtime behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Verify shrinking and obfuscation requirements against the final application release artifact. Keep secrets and
    trust decisions out of client code regardless of obfuscation. Apply the least-privilege platform control appropriate
    to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
