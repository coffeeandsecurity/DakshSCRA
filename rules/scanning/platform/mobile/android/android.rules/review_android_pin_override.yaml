format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_pin_override
title: Certificate Pinning Override Enabled
order: 36
category: NETWORK Review
detection:
  pattern: \boverridePins\s*=\s*["\x27]true["\x27]
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A trust configuration allows a certificate source to override configured certificate pins. Resolve
    the particular connection, host and client configuration selected by the shipped build.
  impact: Connections may accept certificates outside the intended pin set, allowing interception by a party controlling
    an accepted certificate authority when pinning was intended to provide an additional trust boundary.
  remediation: Remove pin overrides from production trust configurations unless explicitly required by the threat
    model. Verify the effective trust anchors and pin policy for each sensitive endpoint. Use platform trust and
    hostname validation and encrypted transport. Remove permissive callbacks and narrow necessary exceptions to
    the intended hosts.
  reviewer: Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted
    client or HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or
    HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Remove pin overrides from production trust configurations unless explicitly required by the threat model. Verify
    the effective trust anchors and pin policy for each sensitive endpoint. Use platform trust and hostname validation
    and encrypted transport. Remove permissive callbacks and narrow necessary exceptions to the intended hosts.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
