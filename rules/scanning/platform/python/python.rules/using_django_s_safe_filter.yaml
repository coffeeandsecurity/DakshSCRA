format: daksh-pattern-rule/v1
id: python.core.using_django_s_safe_filter
title: "HTML Output Encoding Review"
order: 30
category: Insecure Mitigations
detection:
  pattern: (?i)\.safe_filter\s*\(\s*
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:escape|bleach\.clean|html\.escape|strip_tags|validate && MISSING:test|example
reporting:
  type: area_of_interest
  reason: Detects the use of Django's Safe Filter without proper sanitization.
  trace:
  - Externalized rule logic for Using Django's Safe Filter.
  description: Application data is inserted into an HTML or script rendering context, or marked safe in a way that
    may bypass automatic encoding.
  impact: If attacker-controlled content reaches an executable browser context, it may run under the application’s
    origin, read accessible session data, or perform actions with the victim’s permissions.
  remediation: Use automatic context-aware output encoding and data-only DOM APIs. Sanitize deliberately accepted
    rich HTML with a maintained allowlist sanitizer and avoid marking untrusted content as safe.
  reviewer: Check for the use of Django's Safe Filter and assess if the content passed to it is properly sanitized
    and validated to prevent XSS vulnerabilities. This can be confirmed as an issue when the matched path is reachable
    and required controls are missing, weak, or inconsistent.
  review_steps:
  - 'Trace the matched value to its browser rendering context: text, attribute, URL, script or DOM operation.'
  - Inspect the exact encoder or safe rendering API and any bypass of automatic escaping; verify it protects that
    context.
  - Distinguish literal trusted content from externally influenced markup. Record the reachable rendering path and
    any effective sanitizer configuration.
  recommendations:
  - Use safe text or template APIs and context-appropriate encoding at the rendering boundary.
  - If rich HTML is required, use a maintained sanitizer with a restricted policy; validate URL schemes and test
    the actual browser output.
scan_config:
  match_mode: line
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: yellow
