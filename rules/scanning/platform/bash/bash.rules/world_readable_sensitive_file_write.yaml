format: daksh-pattern-rule/v1
id: bash.core.world_readable_sensitive_file_write
title: World-Readable Sensitive File Write
order: 8
category: File and Permission Issues
detection:
  pattern: '>\s*(?:/etc/|/root/|~/)(?:passwd|shadow|sudoers|ssh|\.ssh|crontab)\b'
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:# intentional|test|example
reporting:
  type: area_of_interest
  reason: Detects writes to sensitive system files including shadow, sudoers, and SSH configuration.
  trace:
  - Externalized rule logic for World-Readable Sensitive File Write.
  description: The script writes to a sensitive system file. Determine the writer’s privileges, intended content,
    and effective file permissions.
  impact: Unauthorized changes to system authentication or configuration files may grant privileged access or establish
    persistence; exposure of readable secrets may also compromise account credentials.
  remediation: Restrict who can modify sensitive system files, validate the written content, and apply least-privileged
    file permissions through an approved administrative workflow.
  reviewer: Confirm whether writes to these paths are intentional, authorized, and include validation. This can
    be confirmed as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched construct in its containing function or configuration and identify the security-sensitive
    behavior under review.
  - Verify reachable callers, external influence and effective protections, including deployment overrides and failure
    paths.
  - Record concrete evidence for a confirmed issue or a justified suppression; retain an unresolved outcome when
    the required evidence is unavailable.
  recommendations:
  - Apply the rule-specific correction above only after verifying the affected behavior and required control.
  - Add a regression case for the unsafe condition and a valid protected case; verify the effective behavior in
    the relevant deployment.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
