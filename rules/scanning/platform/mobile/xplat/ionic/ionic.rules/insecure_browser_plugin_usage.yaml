format: daksh-pattern-rule/v1
id: mobile.xplat.ionic.core.insecure_browser_plugin_usage
title: "Legacy Browser Plugin Review"
order: 2
category: Framework-Specific Issues - Ionic/Capacitor
detection:
  pattern: \b(?:InAppBrowser|cordova\.InAppBrowser|Browser\.open)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects embedded browser opening flows that need URL allowlist validation.
  trace:
  - Externalized mobile rule logic for Insecure Browser Plugin Usage.
  description: 'Review target: Insecure Browser Plugin Usage. The application opens an external browser or embedded-browser
    target. Determine how the destination and any URL-carried data are selected. Resolve the exact declaration or
    operation in the selected build and identify its security boundary.'
  impact: An attacker-selected destination may support phishing or receive sensitive URL values if the application
    trusts unvalidated external navigation parameters.
  remediation: Allowlist required destinations and schemes, keep credentials out of URLs, and use platform browser
    flows with verified callback handling for authentication. Apply the least-privilege platform control appropriate
    to the matched operation and verify the production configuration.
  reviewer: Confirm URL validation and navigation restrictions are enforced. This can be confirmed as an issue when
    the matched path is reachable and required controls are missing, weak, or inconsistent. Check debug/release
    and product flavors, generated/native code, plugin boundaries and failure paths; source evidence alone does
    not establish shipped or runtime behavior.
  review_steps:
  - Inspect the matched construct in its containing function or configuration and identify the security-sensitive
    behavior under review.
  - Verify reachable callers, external influence and effective protections, including deployment overrides and failure
    paths.
  - Record concrete evidence for a confirmed issue or a justified suppression; retain an unresolved outcome when
    the required evidence is unavailable.
  - Resolve the exact declaration or operation in the selected build and identify its security boundary.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Apply the rule-specific correction above only after verifying the affected behavior and required control.
  - Add a regression case for the unsafe condition and a valid protected case; verify the effective behavior in
    the relevant deployment.
  - Apply the least-privilege platform control appropriate to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: magenta
