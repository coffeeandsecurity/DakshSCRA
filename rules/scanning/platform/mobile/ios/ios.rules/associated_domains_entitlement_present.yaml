format: daksh-pattern-rule/v1
id: mobile.ios.core.associated_domains_entitlement_present
title: "Associated Domain Configuration Review"
order: 13
category: Platform-Specific Issues - iOS Build and Entitlements
detection:
  pattern: com\.apple\.developer\.associated-domains
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects associated domains entitlement that requires strict domain ownership and validation.
  trace:
  - Externalized mobile rule logic for Associated Domains Entitlement Present.
  description: 'Review target: Associated Domains Entitlement Present. The code handles a link, redirect, or externally
    selected navigation target. Validate the effective destination and any action triggered by the receiving handler.
    Resolve the exact declaration or operation in the selected build and identify its security boundary.'
  impact: A crafted destination or link may direct users to a phishing site, leak URL-carried secrets, or trigger
    unauthorized operations if routing trusts external parameters without the required access checks.
  remediation: Allowlist schemes, hosts, paths, and operations. Validate parsed link parameters, avoid credentials
    in URLs, and require authentication and authorization before sensitive actions. Apply the least-privilege platform
    control appropriate to the matched operation and verify the production configuration.
  reviewer: Verify entitlement scope and universal-link validation/authorization checks. This can be confirmed as
    an issue when the matched path is reachable and required controls are missing, weak, or inconsistent. Check
    debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source evidence
    alone does not establish shipped or runtime behavior.
  review_steps:
  - Determine whether untrusted input controls the redirect destination and whether the redirect is reachable.
  - Inspect URL parsing, relative versus absolute destinations, scheme handling and authorization around the redirect.
  - Check how encoded or ambiguous URLs are interpreted by the framework and browser before confirming an unsafe
    redirect.
  - Resolve the exact declaration or operation in the selected build and identify its security boundary.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Prefer application route identifiers mapped to fixed destinations; permit only necessary relative paths or explicitly
    allowed external destinations.
  - Reject unsupported schemes and ambiguous destinations and test redirect handling after decoding and normalization.
  - Apply the least-privilege platform control appropriate to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '1'
  context_lines_after: '0'
  aggregate: file
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: yellow
