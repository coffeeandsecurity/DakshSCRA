format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_pasteboard_shared_secret
title: "Clipboard Data Exposure Review"
order: 58
category: PRIVACY Review
detection:
  pattern: (?i)\bUIPasteboard\s*\.\s*general\s*\.\s*string\s*=\s*(?:[\w]+\.)?(?:password|token|secret|credential)\w*
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A variable named as sensitive is written to the general pasteboard. Confirm the actual value and
    whether cross-application or cross-device sharing and clipboard lifetime meet the application's policy.
  impact: Sensitive information may reach logs, other applications, keyboard services, screen capture, analytics
    or unintended recipients.
  remediation: Avoid copying active credentials when possible. For required clipboard operations, choose local-only
    sharing and an appropriate expiration, minimize copied data, and verify clearing behavior without disrupting
    unrelated clipboard content.
  reviewer: Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime;
    permission or API capability alone does not establish collection or malicious behavior.
  review_steps:
  - Resolve the exact instance, declaration, value and release configuration.
  - Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime; permission
    or API capability alone does not establish collection or malicious behavior.
  - Confirm reachability and security impact before confirming an issue.
  recommendations:
  - Avoid copying active credentials when possible. For required clipboard operations, choose local-only sharing
    and an appropriate expiration, minimize copied data, and verify clearing behavior without disrupting unrelated
    clipboard content.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
