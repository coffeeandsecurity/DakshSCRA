format: daksh-pattern-rule/v1
id: mobile.ios.core.ats_arbitrary_loads
title: "App Transport Security Review"
order: 1
category: Platform-Specific Issues - iOS Configuration
detection:
  pattern: NSAllowsArbitraryLoads\s*</key>\s*<true\s*/>
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: ATS arbitrary loads remain review-worthy even when other plist exceptions exist; project plist artifacts
    were inspected for context.
  trace:
  - Mobile RDL pilot evaluated the Info.plist transport exception and recorded related project plist files for review
    context.
  description: 'Review target: App Transport Security Allows Arbitrary Loads. The checked source contains a transport-security
    exception, insecure endpoint, or certificate-validation configuration. Resolve the effective policy and the
    connections it governs. Resolve the exact declaration or operation in the selected build and identify its security
    boundary.'
  impact: An attacker on the network may read or alter affected traffic if sensitive data travels over cleartext
    or the connection accepts an untrusted server. Normal HTTPS endpoints and correctly implemented validation do
    not establish exposure.
  remediation: Use HTTPS with normal certificate-chain and hostname verification. Remove permissive production callbacks
    and broad transport exceptions; restrict any justified exception to a documented, non-sensitive endpoint. Apply
    the least-privilege platform control appropriate to the matched operation and verify the production configuration.
  reviewer: Review Info. plist ATS entries and validate that all exceptions are justified and limited. This can
    be confirmed as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
    Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  review_steps:
  - Inspect the effective connection settings, certificate-chain validation and hostname verification for the deployed
    client or server.
  - Trace configuration overrides, custom trust handlers and error paths; determine whether untrusted networks can
    affect the connection.
  - Verify the actual handshake and failure behavior against an untrusted or mismatched certificate before confirming
    a transport issue.
  - Resolve the exact declaration or operation in the selected build and identify its security boundary.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Use authenticated encrypted transport and retain certificate and hostname verification; limit any development
    exception to a verified non-production scope.
  - Configure trust through the platform trust mechanism and test that invalid certificates and insecure protocol
    downgrades are rejected.
  - Apply the least-privilege platform control appropriate to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '2'
  context_lines_after: '0'
  aggregate: file
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
