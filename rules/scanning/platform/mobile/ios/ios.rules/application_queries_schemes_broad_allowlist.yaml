format: daksh-pattern-rule/v1
id: mobile.ios.core.application_queries_schemes_broad_allowlist
title: URL Scheme Allowlist Review
order: 3
category: Platform-Specific Issues - iOS Configuration
detection:
  pattern: LSApplicationQueriesSchemes
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects URL scheme query allowlists in Info.plist.
  trace:
  - Externalized mobile rule logic for Application Queries Schemes Broad Allowlist.
  description: 'Review target: Application Queries Schemes Broad Allowlist. Application configuration permits querying
    a broad set of URL schemes associated with other applications. Resolve the external entry point, its caller
    or URI grant, and the sensitive operation or resource reached.'
  impact: "Collecting the resulting application-presence information may reveal aspects of a user\u2019s installed\
    \ applications or behavior if the collection exceeds the authorized feature."
  remediation: Limit query schemes to required integrations, avoid collecting an unnecessary application inventory,
    and document the purpose and handling of resulting information.
  reviewer: Ensure scheme allowlist entries are minimal and justified. This can be confirmed as an issue when the
    matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched construct in its containing function or configuration and identify the security-sensitive
    behavior under review.
  - Verify reachable callers, external influence and effective protections, including deployment overrides and failure
    paths.
  - Record concrete evidence for a confirmed issue or a justified suppression; retain an unresolved outcome when
    the required evidence is unavailable.
  - Resolve the external entry point, its caller or URI grant, and the sensitive operation or resource reached.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Apply the rule-specific correction above only after verifying the affected behavior and required control.
  - Add a regression case for the unsafe condition and a valid protected case; verify the effective behavior in
    the relevant deployment.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '1'
  context_lines_after: '0'
  aggregate: file
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: yellow
