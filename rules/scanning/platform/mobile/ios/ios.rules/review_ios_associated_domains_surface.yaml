format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_associated_domains_surface
title: "Associated Domain Configuration Review"
order: 47
category: PLATFORM Review
detection:
  pattern: <key>com.apple.developer.associated-domains</key>
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The application registers or parses an externally supplied URI or link. Registration alone does not
    establish unsafe routing or authorization. Resolve the particular connection, host and client configuration
    selected by the shipped build.
  impact: A crafted link may trigger unauthorized actions, redirect navigation, or expose private data if the receiving
    handler trusts URI fields or bypasses authentication and object-level authorization.
  remediation: Allowlist accepted schemes, hosts, paths, and operations. Validate link parameters, require authorization
    before sensitive actions, and verify domain association when relying on trusted web links. Use platform trust
    and hostname validation and encrypted transport. Remove permissive callbacks and narrow necessary exceptions
    to the intended hosts.
  reviewer: Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted
    client or HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or
    HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Allowlist accepted schemes, hosts, paths, and operations. Validate link parameters, require authorization before
    sensitive actions, and verify domain association when relying on trusted web links. Use platform trust and hostname
    validation and encrypted transport. Remove permissive callbacks and narrow necessary exceptions to the intended
    hosts.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
