format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_webview_app_bound_disabled
title: "App-Bound WebView Navigation Review"
order: 29
category: PLATFORM Review
detection:
  pattern: \blimitsNavigationsToAppBoundDomains\s*(?:=\s*(?:false|NO)\b|:\s*NO\b)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: WebView configuration disables the app-bound navigation limit. Resolve the loaded content and frame
    origin, the exact WebView instance, and the native operations available to that content.
  impact: Untrusted navigation may expose a broader set of pages to privileged WebView functionality if application-bound
    restrictions were intended to isolate sensitive features.
  remediation: Enable app-bound navigation where the feature requires it, restrict navigation destinations, and
    avoid exposing privileged scripts or native handlers to untrusted pages. Restrict schemes and parsed hosts,
    isolate external content, and validate messages and permissions on the native side.
  reviewer: Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView
    beside an unsafe instance; JavaScript enablement alone is not a vulnerability.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Enable app-bound navigation where the feature requires it, restrict navigation destinations, and avoid exposing
    privileged scripts or native handlers to untrusted pages. Restrict schemes and parsed hosts, isolate external
    content, and validate messages and permissions on the native side.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
