format: daksh-pattern-rule/v1
id: mobile.ios.framework.coredata.review_ios_coredata_unprotected_persistent_store
title: "Core Data Protection Review"
order: 3
category: STORAGE Review
detection:
  pattern: \bsetOption\s*\(\s*FileProtectionType\.none\b[^\n]{0,160}\bNSPersistentStoreFileProtectionKey\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A file or persistent store explicitly disables platform data protection. Identify the value written,
    backing store and access class, including backup, restore, reinstall and logout behavior.
  impact: Someone who obtains the stored files may recover private application data without the device-lock protection
    intended for those files, depending on the device state and available access.
  remediation: Choose an appropriate platform file-protection class for sensitive data and apply it to the persistent
    store and related files. Verify protection after migration and backup or restore. Keep privileged secrets on
    the server, use appropriate device-backed secure storage for local credentials, and restrict backup and sharing
    to intended non-sensitive data.
  reviewer: Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after
    reinstall, and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store
    as protection.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall,
    and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Choose an appropriate platform file-protection class for sensitive data and apply it to the persistent store
    and related files. Verify protection after migration and backup or restore. Keep privileged secrets on the server,
    use appropriate device-backed secure storage for local credentials, and restrict backup and sharing to intended
    non-sensitive data.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
