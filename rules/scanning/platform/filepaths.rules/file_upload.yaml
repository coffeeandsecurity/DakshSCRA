format: daksh-pattern-rule/v1
id: filepaths.core.file_upload
title: "File Upload Review"
order: 16
detection:
  pattern: (?i)Upload
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:(?i)(/|\\\\).*(upload|uploader|attachments?|files?) && MISSING:(?i)(/docs?/|/examples?/|/samples?/|/tests?/)
reporting:
  type: area_of_interest
  reason: Detects file paths related to file upload functionality.
  description: A file or directory name matches the file upload review area. This check inspects paths, not the
    implementation or a reachable execution path.
  impact: A crafted upload may execute as application code, overwrite files, disclose data through later processing,
    or exhaust storage if the upload crosses the intended content and filesystem boundaries. A filename match alone
    does not establish this consequence.
  remediation: Allowlist required file types, inspect content rather than trusting extensions, bound sizes, generate
    server-side names, and store uploads outside executable paths with appropriate access controls.
  reviewer: Verify the presence and correctness of code paths related to file upload functionality. This can be
    confirmed as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched file or directory contents and determine whether it is deployed or externally accessible.
  - Identify whether sensitive data, configuration or executable content is present; a name match alone does not
    establish exposure.
  - Check effective access controls and build or packaging exclusions and record the specific content and exposure
    path.
  recommendations:
  - Where exposure is verified, remove unnecessary files from deployment or restrict access to the intended users
    and processes.
  - Verify the deployed artifact and access behavior after the change; retain required application files with appropriate
    controls.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
