format: daksh-pattern-rule/v1
id: cpp.core.potential_memory_leak_use_of_new_without_delete
title: "Allocation Ownership Review"
order: 10
category: Memory Management and Allocation
detection:
  pattern: \bnew\s+\w+(?![^<>]*\s*>)
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:free\s*\(|delete\s+|unique_ptr|shared_ptr|RAII
reporting:
  type: area_of_interest
  reason: Detects dynamic memory allocation using `new` but no matching `delete`, potentially leading to memory
    leaks.
  trace:
  - 'Externalized rule logic for Potential Memory Leak: Use of `new` Without `delete`.'
  description: The code manages allocation, ownership, indexed access, or resource release. Confirm capacity, lifetime,
    nullability, and transfer of ownership across callers.
  impact: An invalid lifetime or out-of-range access may corrupt memory, disclose process data, or crash the application.
    Unbounded or unreleased resources may exhaust memory and deny service under repeated use.
  remediation: Enforce bounds and lifetime invariants, handle allocation failure, and use appropriate automatic
    resource ownership. Confirm a leak or invalid access before adding cleanup that could introduce double release.
  reviewer: Check whether allocated memory is properly deallocated using `delete` or managed by smart pointers.
    If raw pointers are unavoidable, ensure all `new` calls have corresponding `delete` calls. This can be confirmed
    as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Trace who controls the operation count, input size, duration or resource allocation.
  - Inspect limits, cancellation, cleanup and error paths, including concurrency and deployment quotas.
  - Establish a reachable way to exhaust or retain a relevant resource before confirming an availability issue.
  recommendations:
  - Set limits and timeouts appropriate to the operation and release resources on success, failure and cancellation.
  - Test oversized input and concurrent requests against the intended limits and verify cleanup under failure.
scan_config:
  match_mode: line
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: yellow
