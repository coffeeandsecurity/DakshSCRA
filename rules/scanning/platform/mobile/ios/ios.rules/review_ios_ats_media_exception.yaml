format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_ats_media_exception
title: "App Transport Security Review"
order: 42
category: NETWORK Review
detection:
  pattern: <key>NSAllowsArbitraryLoadsForMedia</key>
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The effective transport policy may permit insecure HTTP content or relax transport protections for
    a WebView, media request, domain, or application. Resolve the exact declaration or operation in the selected
    build and identify its security boundary.
  impact: A network attacker may read or modify affected cleartext traffic. Modified executable web content may
    also compromise the containing WebView session or exposed native interfaces.
  remediation: Use HTTPS with normal certificate validation. Remove unnecessary transport exceptions, keep any unavoidable
    exception narrowly scoped, and avoid sending credentials or loading executable content over cleartext connections.
    Apply the least-privilege platform control appropriate to the matched operation and verify the production configuration.
  reviewer: Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths;
    source evidence alone does not establish shipped or runtime behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Use HTTPS with normal certificate validation. Remove unnecessary transport exceptions, keep any unavoidable
    exception narrowly scoped, and avoid sending credentials or loading executable content over cleartext connections.
    Apply the least-privilege platform control appropriate to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
