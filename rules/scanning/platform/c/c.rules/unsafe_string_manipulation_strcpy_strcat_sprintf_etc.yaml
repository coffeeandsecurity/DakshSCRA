format: daksh-pattern-rule/v1
id: c.core.unsafe_string_manipulation_strcpy_strcat_sprintf_etc
title: "String Buffer Bounds Review"
order: 1
category: Untrusted Input Handling and Buffer Overflow
detection:
  pattern: \b(strcpy|strcat|sprintf|gets|scanf)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: An unbounded string or formatting API is present. Review destination capacity and argument provenance;
    another bounded API in this file does not establish safety of this call.
  trace:
  - 'Externalized rule logic for Unsafe String Manipulation: strcpy(), strcat(), sprintf(), etc..'
  description: The code calls a string-copy or formatting API without an explicit destination capacity. Review the
    actual buffer size, terminator space and source length for each call.
  impact: A write exceeding the destination capacity may corrupt memory or crash the process. The API call alone
    does not prove an overflow; constant strings and correctly sized buffers can be safe.
  remediation: Prefer bounded operations and verify their size and termination contracts. Where an unbounded call
    remains, establish and test the destination-capacity invariant.
  reviewer: Compare the exact destination capacity with every possible input length. Do not infer either a vulnerability
    or a mitigation from unrelated calls elsewhere in the file.
  review_steps:
  - Identify who can supply the matched input, including stored values and upstream services; record its type, size
    limits and trust boundary.
  - Trace the value through transformations to each sensitive operation. Check the protection at that destination
    and resource-level authorization.
  - Inspect the actual validation or protection implementation and its error path. A nearby keyword or a client-side
    check alone is insufficient evidence.
  recommendations:
  - Use server-side type, length and allowed-value checks appropriate to the input. For free-form text, preserve
    legitimate characters and protect each destination separately.
  - Bind database values as parameters, encode output for its rendering context, and constrain file or network destinations
    where applicable. Test rejected input and unauthorized access.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
