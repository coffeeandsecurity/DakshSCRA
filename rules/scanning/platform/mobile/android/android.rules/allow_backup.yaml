format: daksh-pattern-rule/v1
id: mobile.android.core.allow_backup
title: "Application Backup Review"
order: 4
category: AndroidManifest.xml - Insecure Misconfiguration
detection:
  pattern: '[A-Za-z_][\w.-]*:allowBackup\s*=\s*"(true|TRUE)"'
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects the use of allowBackup="true" in the application's manifest.
  trace:
  - Externalized mobile rule logic for Allow Backup.
  description: 'Review target: Allow Backup. Application backup or restore is permitted. Resolve the effective inclusion
    rules, platform behavior, encryption, and stored data sensitivity. Identify the value written, backing store
    and access class, including backup, restore, reinstall and logout behavior.'
  impact: Private records or credentials may become accessible through an insufficiently protected backup or transfer
    destination. The presence of a backup flag alone does not prove that sensitive files are included.
  remediation: Exclude non-transferable secrets from backup and verify cloud and device-transfer policies. Protect
    required backups with suitable encryption, access controls, and tested recovery procedures. Keep privileged
    secrets on the server, use appropriate device-backed secure storage for local credentials, and restrict backup
    and sharing to intended non-sensitive data.
  reviewer: Verify that sensitive data is not being backed up insecurely by checking the value of the allowBackup
    attribute in the AndroidManifest.xml file. Ensure that sensitive data is properly protected and not exposed
    to unauthorized access through backup mechanisms. This can be confirmed as an issue when the matched path is
    reachable and required controls are missing, weak, or inconsistent. Test device lock state, cloud backup versus
    device transfer, restored keys, keychain persistence after reinstall, and secure-storage failure; do not silently
    fall back to plaintext or treat an unrelated secure store as protection.
  review_steps:
  - Identify the sensitive data, actual storage location, backup inclusion and lock-state or account access policy.
  - Inspect encryption, key access and data retention, including copies in caches, backups and exported artifacts.
  - Verify access under the relevant attacker model; a storage API alone does not establish an exposure.
  - Identify the value written, backing store and access class, including backup, restore, reinstall and logout
    behavior.
  - Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall,
    and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Store secrets using the platform credential store and apply appropriate access controls and protection to other
    private data.
  - Limit retention and unnecessary copies, configure backup handling deliberately, and verify access and recovery
    behavior in the deployed environment.
  - Keep privileged secrets on the server, use appropriate device-backed secure storage for local credentials, and
    restrict backup and sharing to intended non-sensitive data.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '1'
  context_lines_after: '0'
  aggregate: file
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: yellow
