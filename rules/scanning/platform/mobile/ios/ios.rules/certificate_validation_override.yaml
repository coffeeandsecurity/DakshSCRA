format: daksh-pattern-rule/v1
id: mobile.ios.core.certificate_validation_override
title: "TLS Certificate Validation Review"
order: 7
category: Platform-Specific Issues - iOS Runtime Security
detection:
  pattern: didReceive\s+challenge|NSURLSessionAuthChallengeDisposition\.useCredential
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects custom TLS challenge handling that may weaken certificate validation.
  trace:
  - Externalized mobile rule logic for Certificate Validation Override.
  description: 'Review target: Certificate Validation Override. The checked source contains a transport-security
    exception, insecure endpoint, or certificate-validation configuration. Resolve the effective policy and the
    connections it governs. Resolve the particular connection, host and client configuration selected by the shipped
    build.'
  impact: An attacker on the network may read or alter affected traffic if sensitive data travels over cleartext
    or the connection accepts an untrusted server. Normal HTTPS endpoints and correctly implemented validation do
    not establish exposure.
  remediation: Use HTTPS with normal certificate-chain and hostname verification. Remove permissive production callbacks
    and broad transport exceptions; restrict any justified exception to a documented, non-sensitive endpoint. Use
    platform trust and hostname validation and encrypted transport. Remove permissive callbacks and narrow necessary
    exceptions to the intended hosts.
  reviewer: Inspect challenge handlers to confirm strict certificate and host validation logic. This can be confirmed
    as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent. Test
    invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or HTTPS
    URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  review_steps:
  - Inspect the effective connection settings, certificate-chain validation and hostname verification for the deployed
    client or server.
  - Trace configuration overrides, custom trust handlers and error paths; determine whether untrusted networks can
    affect the connection.
  - Verify the actual handshake and failure behavior against an untrusted or mismatched certificate before confirming
    a transport issue.
  - Resolve the particular connection, host and client configuration selected by the shipped build.
  - Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or
    HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Use authenticated encrypted transport and retain certificate and hostname verification; limit any development
    exception to a verified non-production scope.
  - Configure trust through the platform trust mechanism and test that invalid certificates and insecure protocol
    downgrades are rejected.
  - Use platform trust and hostname validation and encrypted transport. Remove permissive callbacks and narrow necessary
    exceptions to the intended hosts.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
