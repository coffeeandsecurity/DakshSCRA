format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_webview_message_handler
title: WKWebView Native Message Handler
order: 27
category: PLATFORM Review
detection:
  pattern: \b(?:addScriptMessageHandler\s*:|addScriptMessageHandler\s*\(|add\s*\([^\n;]{0,200}\bname\s*:)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The application exposes a native bridge or message handler to web content. Resolve the loaded content
    and frame origin, the exact WebView instance, and the native operations available to that content.
  impact: Untrusted web content may invoke native operations with the application’s privileges if origin restrictions,
    message validation, or per-operation authorization are missing.
  remediation: Expose only narrowly required native methods. Restrict loaded origins and message senders, validate
    message schemas, and authorize every sensitive native action. Restrict schemes and parsed hosts, isolate external
    content, and validate messages and permissions on the native side.
  reviewer: Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView
    beside an unsafe instance; JavaScript enablement alone is not a vulnerability.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Expose only narrowly required native methods. Restrict loaded origins and message senders, validate message
    schemas, and authorize every sensitive native action. Restrict schemes and parsed hosts, isolate external content,
    and validate messages and permissions on the native side.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
