format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_runtime_method_hooking
title: Android Runtime Method Hooking
order: 80
category: RESILIENCE Review
detection:
  pattern: \b(?:findAndHookMethod|hookAllMethods|hookMethod|hookAllConstructors)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The code dynamically loads executable material or alters runtime method dispatch. Resolve the source,
    integrity checks, and intended use of that material. Resolve the exact declaration or operation in the selected
    build and identify its security boundary.
  impact: A party able to replace loaded code or control a runtime hook may execute with the application’s privileges,
    inspect private data, or alter security decisions. Legitimate bundled code and instrumentation do not establish
    an attack.
  remediation: Load only approved code from trusted locations, verify integrity and authenticity before loading,
    and keep runtime hooks confined to documented, authorized behavior. Apply the least-privilege platform control
    appropriate to the matched operation and verify the production configuration.
  reviewer: Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths;
    source evidence alone does not establish shipped or runtime behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Load only approved code from trusted locations, verify integrity and authenticity before loading, and keep runtime
    hooks confined to documented, authorized behavior. Apply the least-privilege platform control appropriate to
    the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
