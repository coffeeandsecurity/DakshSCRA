format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_unsafe_intent_uri
title: Intent URI Parsing Entry Point
order: 49
category: PLATFORM Review
detection:
  pattern: \bIntent\s*\.\s*parseUri\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The application registers or parses an externally supplied URI or link. Registration alone does not
    establish unsafe routing or authorization. Resolve the external entry point, its caller or URI grant, and the
    sensitive operation or resource reached.
  impact: A crafted link may trigger unauthorized actions, redirect navigation, or expose private data if the receiving
    handler trusts URI fields or bypasses authentication and object-level authorization.
  remediation: Allowlist accepted schemes, hosts, paths, and operations. Validate link parameters, require authorization
    before sensitive actions, and verify domain association when relying on trusted web links. Minimize exported
    surfaces and URI grants; validate parsed schemes, hosts and paths, use verified links where appropriate, and
    authorize each sensitive action.
  reviewer: Resolve merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded
    paths, nested intents, read/write grants and permission inheritance. Registration or permission presence alone
    does not prove unauthorized access.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Resolve merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded paths,
    nested intents, read/write grants and permission inheritance. Registration or permission presence alone does
    not prove unauthorized access.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Allowlist accepted schemes, hosts, paths, and operations. Validate link parameters, require authorization before
    sensitive actions, and verify domain association when relying on trusted web links. Minimize exported surfaces
    and URI grants; validate parsed schemes, hosts and paths, use verified links where appropriate, and authorize
    each sensitive action.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
