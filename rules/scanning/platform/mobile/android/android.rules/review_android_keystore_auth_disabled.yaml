format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_keystore_auth_disabled
title: "Keystore Authentication Binding Review"
order: 41
category: AUTH Review
detection:
  pattern: \bsetUserAuthenticationRequired\s*\(\s*false\s*\)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A keystore key explicitly disables the requirement for user authentication before use. Trace the
    actual authorization decision, credential binding and failure path rather than accepting a local success marker.
  impact: A process able to use the application’s key may perform protected cryptographic operations without confirming
    user presence, weakening controls intended to gate decryption or sensitive actions.
  remediation: Require user authentication for keys whose operations need user presence. Choose an appropriate authentication
    timeout and verify both key-generation parameters and the operation’s authorization policy. Enforce authorization
    on the trusted server and bind local authentication to protected keys or credentials where required; use external-browser
    authorization and proof-key protection for public native clients.
  reviewer: Test cancellation, device-credential fallback, enrollment changes, stale reuse windows, redirect interception
    and unavailable secure storage; local biometrics do not replace server authorization.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test cancellation, device-credential fallback, enrollment changes, stale reuse windows, redirect interception
    and unavailable secure storage; local biometrics do not replace server authorization.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Require user authentication for keys whose operations need user presence. Choose an appropriate authentication
    timeout and verify both key-generation parameters and the operation’s authorization policy. Enforce authorization
    on the trusted server and bind local authentication to protected keys or credentials where required; use external-browser
    authorization and proof-key protection for public native clients.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
