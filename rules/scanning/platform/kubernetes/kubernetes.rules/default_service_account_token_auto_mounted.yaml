format: daksh-pattern-rule/v1
id: kubernetes.core.default_service_account_token_auto_mounted
title: "Service Account Token Automount"
order: 13
category: Resource Management
detection:
  pattern: automountServiceAccountToken\s*:\s*true
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:automountServiceAccountToken:\s*false && PRESENT:kind:\s*Deployment|kind:\s*StatefulSet|kind:\s*Pod|kind:\s*DaemonSet
reporting:
  type: area_of_interest
  reason: Detects pods or service accounts with automatic service account token mounting enabled.
  trace:
  - Externalized rule logic for Default Service Account Token Auto-Mounted.
  description: The workload may receive an automatically mounted Kubernetes service-account token.
  impact: A compromised process may use the token to call the cluster API with the service account’s granted permissions,
    extending access beyond the application’s intended resources.
  remediation: Disable token automount when cluster API access is unnecessary. Otherwise use a dedicated, narrowly
    privileged service account and short-lived projected tokens.
  reviewer: Confirm automountServiceAccountToken is false for all workloads that do not explicitly require Kubernetes
    API access. This can be confirmed as an issue when the matched path is reachable and required controls are missing,
    weak, or inconsistent.
  review_steps:
  - Resolve the effective privileges, filesystem modes or identity grants, including inherited and deployment-level
    permissions.
  - Determine which operations are required and whether an untrusted actor can exercise the excess access.
  - Record the affected resource and effective policy; distinguish a declared capability from an exploitable authorization
    gap.
  recommendations:
  - Limit access and privileges to the operations and resources the application requires; remove unnecessary broad
    grants.
  - Test permitted operations and denied access with the actual deployment identity and effective policy.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
