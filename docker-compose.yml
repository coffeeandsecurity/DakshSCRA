services:
  api:
    build:
      context: .
      dockerfile: webui/deploy/docker/api.Dockerfile
    container_name: daksh-api
    environment:
      DAKSH_NON_INTERACTIVE: "1"
      PYTHONPATH: /app/webui
      DAKSH_PORT: "${DAKSH_PORT:-8080}"
      DAKSH_CONTAINER: "1"
      DAKSH_HOST_OS: "${DAKSH_HOST_OS:-auto}"
      DAKSH_BROWSE_ROOTS: "${DAKSH_BROWSE_ROOTS:-}"
      # Web UI authentication - see .env.example for details.
      DAKSH_ADMIN_USERNAME: "${DAKSH_ADMIN_USERNAME:-admin}"
      DAKSH_ADMIN_PASSWORD: "${DAKSH_ADMIN_PASSWORD:-}"
      DAKSH_COOKIE_SECURE: "${DAKSH_COOKIE_SECURE:-false}"
      DAKSH_SESSION_TTL_HOURS: "${DAKSH_SESSION_TTL_HOURS:-168}"
      DAKSH_CORS_ORIGINS: "${DAKSH_CORS_ORIGINS:-}"
    volumes:
      - .:/app
      # Keep runtime data (DB + logs) on a Linux named volume so SQLite works
      # reliably. NTFS (Windows-mounted) paths break SQLite locking.
      - daksh_runtime:/app/runtime

      # Portable baseline. The host launcher adds detected drives/common paths.
      # Missing sources must fail instead of creating misleading empty folders.
      - type: bind
        source: ${DAKSH_SCAN_ROOT:-.}
        target: /scan-targets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DAKSH_HOST_MOUNT:-/}
        target: /host/root
        read_only: true
        bind:
          create_host_path: false

  web:
    build:
      context: .
      dockerfile: webui/deploy/docker/frontend-nginx.Dockerfile
    container_name: webui
    ports:
      - "${DAKSH_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

  cli:
    build:
      context: .
      dockerfile: webui/deploy/docker/api.Dockerfile
    container_name: daksh-cli
    environment:
      DAKSH_NON_INTERACTIVE: "1"
    working_dir: /app
    entrypoint: ["python", "dakshscra.py"]
    volumes:
      - .:/app
      - daksh_runtime:/app/runtime
      - type: bind
        source: ${DAKSH_SCAN_ROOT:-.}
        target: /scan-targets
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DAKSH_HOST_MOUNT:-/}
        target: /host/root
        read_only: true
        bind:
          create_host_path: false

volumes:
  daksh_runtime:
