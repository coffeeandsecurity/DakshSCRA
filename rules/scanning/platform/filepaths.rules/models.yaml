format: daksh-pattern-rule/v1
id: filepaths.core.models
title: Models
order: 19
detection:
  pattern: (?i)\/(Models)\/
  conditions:
  - WHEN PRESENT (?i)/(Models)/
  - WHEN EXPR PRESENT:(?i)(/|\\\\).*(models?|entities?)
reporting:
  type: area_of_interest
  reason: Detects file paths related to models.
  description: A file or directory name matches the models review area. This check inspects paths, not the implementation
    or a reachable execution path.
  impact: A boundary that trusts unauthorized callers or exposes private output may permit data disclosure or state
    changes. A declaration, address, or architectural marker alone does not establish such a failure. A filename
    match alone does not establish this consequence.
  remediation: Trace the actual boundary, restrict accepted inputs and recipients, and enforce authentication and
    object-level authorization where required. Verify both authorized and denied use cases.
  reviewer: Verify the presence and correctness of code paths related to models. This can be confirmed as an issue
    when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched file or directory contents and determine whether it is deployed or externally accessible.
  - Identify whether sensitive data, configuration or executable content is present; a name match alone does not
    establish exposure.
  - Check effective access controls and build or packaging exclusions and record the specific content and exposure
    path.
  recommendations:
  - Where exposure is verified, remove unnecessary files from deployment or restrict access to the intended users
    and processes.
  - Verify the deployed artifact and access behavior after the change; retain required application files with appropriate
    controls.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
