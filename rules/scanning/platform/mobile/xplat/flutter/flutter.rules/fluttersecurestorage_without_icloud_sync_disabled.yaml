format: daksh-pattern-rule/v1
id: mobile.xplat.flutter.core.fluttersecurestorage_without_icloud_sync_disabled
title: "Secure Storage Synchronization Review"
order: 4
category: Framework-Specific Issues - Flutter
detection:
  pattern: \bFlutterSecureStorage\s*\(|\bconst\s+FlutterSecureStorage\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects FlutterSecureStorage instantiation that may sync data to iCloud by default on iOS.
  trace:
  - Externalized mobile rule logic for FlutterSecureStorage Without iCloud Sync Disabled.
  description: 'Review target: FlutterSecureStorage Without iCloud Sync Disabled. Secure-storage configuration does
    not establish the intended synchronization and lock-state accessibility policy. Resolve library defaults and
    the effective platform options. Identify the value written, backing store and access class, including backup,
    restore, reinstall and logout behavior.'
  impact: Secrets may be accessible on synchronized devices or while the device is locked if the effective policy
    is broader than the application requires. Missing options alone do not prove plaintext storage or synchronization.
  remediation: Set synchronization and accessibility options explicitly for the threat model, verify library defaults
    on supported platforms, and avoid plaintext fallback when secure storage fails. Keep privileged secrets on the
    server, use appropriate device-backed secure storage for local credentials, and restrict backup and sharing
    to intended non-sensitive data.
  reviewer: Confirm FlutterSecureStorage instances include explicit iCloud sync opt-out for sensitive data. This
    can be confirmed as an issue when the matched path is reachable and required controls are missing, weak, or
    inconsistent. Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence
    after reinstall, and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure
    store as protection.
  review_steps:
  - Identify the sensitive data, actual storage location, backup inclusion and lock-state or account access policy.
  - Inspect encryption, key access and data retention, including copies in caches, backups and exported artifacts.
  - Verify access under the relevant attacker model; a storage API alone does not establish an exposure.
  - Identify the value written, backing store and access class, including backup, restore, reinstall and logout
    behavior.
  - Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall,
    and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Store secrets using the platform credential store and apply appropriate access controls and protection to other
    private data.
  - Limit retention and unnecessary copies, configure backup handling deliberately, and verify access and recovery
    behavior in the deployed environment.
  - Keep privileged secrets on the server, use appropriate device-backed secure storage for local credentials, and
    restrict backup and sharing to intended non-sensitive data.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: yellow
