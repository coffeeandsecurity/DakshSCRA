format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_debug_entitlement_typed
title: "Debug Task Entitlement in Apple Configuration"
order: 52
category: RESILIENCE Review
detection:
  pattern: <key>get-task-allow</key>
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: Apple application configuration enables the debug-task entitlement. Verify the entitlement in the
    signed distribution artifact. Resolve the exact declaration or operation in the selected build and identify
    its security boundary.
  impact: An actor with the necessary device access may attach a debugger to the distributed application and inspect
    or alter its process, potentially exposing in-memory secrets or bypassing client-side checks.
  remediation: Remove debug-task entitlements from distribution builds. Verify the final signed entitlement set
    and keep production authorization enforced independently of the client process. Apply the least-privilege platform
    control appropriate to the matched operation and verify the production configuration.
  reviewer: Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths;
    source evidence alone does not establish shipped or runtime behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Remove debug-task entitlements from distribution builds. Verify the final signed entitlement set and keep production
    authorization enforced independently of the client process. Apply the least-privilege platform control appropriate
    to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
