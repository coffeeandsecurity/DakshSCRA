format: daksh-pattern-rule/v1
id: php.core.insecure_code_execution_assert_and_eval
title: "Dynamic Code Evaluation Review"
order: 11
category: Insecure Method/Function Call
detection:
  pattern: (assert|eval)\s*\(\s*(\$_(GET|POST|REQUEST)|\$\{?(?:_[a-zA-Z0-9_]+|[a-zA-Z_\x7f-\xff][a-zA-Z0-9_\x7f-\xff]*)\}?)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects usage of assert() and eval() with potentially untrusted inputs, leading to code injection vulnerabilities.
  trace:
  - 'Externalized rule logic for Insecure Code Execution: assert() and eval().'
  description: The code invokes an interpreter, process, dynamic expression, or template-execution mechanism. Trace executable
    selection and evaluated content to their trust boundaries.
  impact: If an attacker controls interpreted syntax or the operation selected, code or commands may run with the application’s
    privileges, allowing data theft, state changes, or service disruption.
  remediation: Replace externally influenced evaluation with fixed operations and data-only inputs. Use separate argument
    arrays for processes, allowlist permitted operations, and keep untrusted text out of executable templates or expressions.
  reviewer: Trace input flow into eval, exec, or assert sinks and verify that strict constraints prevent attacker-controlled
    execution. This can be confirmed as an issue when the matched path is reachable and required controls are missing, weak,
    or inconsistent.
  review_steps:
  - Determine whether the matched operation interprets code, expressions or templates; identify its execution context and
    permissions.
  - Trace control over the executed text and distinguish fixed application code from externally influenced content.
  - Inspect restrictions and failure paths; record a reachable input-to-execution path before confirming code execution.
  recommendations:
  - Replace externally assembled code with fixed operations and data-only inputs where possible.
  - Keep template or expression sources under application control; restrict exposed capabilities and test rejection of unexpected
    syntax.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
