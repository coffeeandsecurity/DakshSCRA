format: daksh-pattern-rule/v1
id: mobile.android.core.contentprovider_raw_selection_parameter_injection
title: "SQL Query Construction Review"
order: 24
category: IPC Attack Surface
detection:
  pattern: (?i)public\s+(?:Cursor|int|String)\s+\w+\s*\(\s*Uri\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects ContentProvider query/update/delete method signatures that may forward raw caller-supplied selection
    strings to the database.
  trace:
  - Externalized mobile rule logic for ContentProvider Raw Selection Parameter Injection.
  description: 'Review target: ContentProvider Raw Selection Parameter Injection. The application exposes or invokes
    an inter-process interface. Resolve export settings, permissions, intent recipients, URI grants, and runtime
    caller checks. Resolve the external entry point, its caller or URI grant, and the sensitive operation or resource
    reached.'
  impact: An untrusted application may read private data, alter state, or invoke operations under the application’s
    identity if an externally reachable interface lacks effective caller authorization or permits unsafe mutation.
  remediation: Disable unnecessary export and prefer explicit recipients and immutable PendingIntents. Apply appropriate
    caller permissions and authorization, bind query arguments, and validate every incoming payload. Minimize exported
    surfaces and URI grants; validate parsed schemes, hosts and paths, use verified links where appropriate, and
    authorize each sensitive action.
  reviewer: Trace the selection parameter from the provider method signature through to the underlying database
    call. Confirm parameterised queries and column allowlist filtering are applied consistently. This can be confirmed
    as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent. Resolve
    merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded paths, nested
    intents, read/write grants and permission inheritance. Registration or permission presence alone does not prove
    unauthorized access.
  review_steps:
  - Inspect the effective export status, permission requirements and runtime identity checks on the inter-process
    interface.
  - Trace untrusted callers and received values to sensitive actions, including indirect recipients and granted
    resource access.
  - Verify unauthorized callers cannot invoke the protected operation; a declared component or intent alone is not
    an issue.
  - Resolve the external entry point, its caller or URI grant, and the sensitive operation or resource reached.
  - Resolve merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded paths,
    nested intents, read/write grants and permission inheritance. Registration or permission presence alone does
    not prove unauthorized access.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Keep internal components private where possible; enforce caller permissions and resource authorization on exposed
    operations.
  - Constrain recipients and granted access and test calls from an untrusted process or application.
  - Minimize exported surfaces and URI grants; validate parsed schemes, hosts and paths, use verified links where
    appropriate, and authorize each sensitive action.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '2'
  context_lines_after: '10'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
