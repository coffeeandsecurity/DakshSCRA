format: daksh-pattern-rule/v1
id: dotnet.core.reversible_password_storage
title: Reversible Password Storage
order: 30
category: Authentication and Credential Storage
detection:
  pattern: \b(?:TripleDESCryptoServiceProvider|DESCryptoServiceProvider|AesManaged|AesCryptoServiceProvider|Aes\.Create)\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: An encryption or decryption operation appears in a password-processing function. Inspect its use as password
    storage.
  trace:
  - Inspect password-processing code and its authentication callers.
  description: An encryption or decryption operation appears in a password-processing function. Inspect its use
    as password storage.
  impact: A stored password may be recoverable with the encryption key. Credential storage should use a salted adaptive
    password hash.
  remediation: Replace reversible password storage with a maintained password-hashing implementation. Review key
    exposure and plan a controlled migration.
  reviewer: Review the recorded operation and authentication call sites; a rule match is not proof of exploitation.
  review_steps:
  - Identify the purpose of the cryptographic operation, algorithm, mode, key or nonce handling, and protected data.
  - Distinguish password storage, confidentiality, integrity and non-security checksums; each requires different
    controls.
  - Inspect deployed configuration and all encrypt, decrypt or verification paths before deciding whether the use
    is unsafe.
  recommendations:
  - Use maintained high-level cryptographic APIs appropriate to the purpose; use authenticated encryption for confidential
    application data.
  - For passwords, use the platform password-hashing facility rather than a fast general-purpose digest. Verify
    key, nonce and migration handling for affected data.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: red
