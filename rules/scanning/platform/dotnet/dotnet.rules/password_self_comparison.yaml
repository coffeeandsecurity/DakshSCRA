format: daksh-pattern-rule/v1
id: dotnet.core.password_self_comparison
title: "Password Comparison Review"
order: 29
category: Authentication and Credential Storage
detection:
  pattern: (?i)\b((?:[A-Za-z_][\w.]{0,200}\.)?(?:Password|PasswordHash|PWHash|Pin|Token))\s*==\s*\1\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: A credential expression is compared with itself. Inspect authentication control flow and whether the supplied
    credential is checked.
  trace:
  - Inspect password-processing code and its authentication callers.
  description: A credential expression is compared with itself. Inspect authentication control flow and whether
    the supplied credential is checked.
  impact: An equality check against the same stored value may bypass credential verification if it controls an authentication
    decision. Reachability must be confirmed.
  remediation: Compare the supplied credential with the expected value using the intended verification routine.
    Test wrong credentials and each authentication path.
  reviewer: Review the recorded operation and authentication call sites; a rule match is not proof of exploitation.
  review_steps:
  - Inspect the complete login or credential-validation path, including alternate providers, error paths and session
    issuance.
  - Verify that credential checks operate on the supplied and stored values and that bypass conditions are unreachable
    in production.
  - Record effective authentication middleware and test invalid credentials and unauthorized session creation.
  recommendations:
  - Use the established authentication mechanism consistently and fail closed when credentials or provider responses
    are invalid.
  - Remove bypass paths, avoid revealing credential-validation details to clients, and test that failed authentication
    cannot create an authenticated session.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: red
