format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_sensitive_location_capability
title: "Background or Continuous Location Capability"
order: 36
category: PRIVACY Review
detection:
  pattern: \b(?:requestAlwaysAuthorization|startUpdatingLocation|startMonitoringSignificantLocationChanges)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The application enables continuous or background location access. Identify the actual sensitive value
    and the recipients, retention and user-consent context of this exposure or capability.
  impact: Location records may reveal movements, home or work addresses, and personal routines if collection or
    sharing exceeds the authorized feature or stored history is exposed.
  remediation: Request the least location scope and precision needed, make background use visible, and restrict
    access, retention, and transmission of location history. Minimize collection and retention, redact secret values,
    and apply the platform controls needed for sensitive UI and data sharing.
  reviewer: Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime;
    permission or API capability alone does not establish collection or malicious behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime; permission
    or API capability alone does not establish collection or malicious behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Request the least location scope and precision needed, make background use visible, and restrict access, retention,
    and transmission of location history. Minimize collection and retention, redact secret values, and apply the
    platform controls needed for sensitive UI and data sharing.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
