format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_fragment_validation_accepts_all
title: Fragment Validation Accepts Every Class
order: 89
category: PLATFORM Review
detection:
  pattern: \bisValidFragment\s*\([^)]{0,240}\)\s*(?::\s*Boolean\s*)?(?:=\s*true\b|\{\s*return\s+true\b)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The isValidFragment override unconditionally returns true. Determine whether an externally supplied
    fragment class can reach a privileged preference activity in the application's supported Android versions.
  impact: The observed behavior may weaken confidentiality, integrity or availability when exposed to an untrusted
    caller or sensitive value.
  remediation: Apply the least-privilege platform control appropriate to the matched operation and verify the production
    configuration.
  reviewer: Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths;
    source evidence alone does not establish shipped or runtime behavior.
  review_steps:
  - Resolve the exact instance, declaration, value and release configuration.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Confirm reachability and security impact before confirming an issue.
  recommendations:
  - Apply the least-privilege platform control appropriate to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
