format: daksh-pattern-rule/v1
id: powershell.core.hardcoded_credential_in_powershell_script
title: "Hardcoded Credential or Secret Review"
order: 3
category: Sensitive Data Exposure
detection:
  pattern: (?i)(?:password|passwd|secret|apikey|api_key|token|accesskey)\s*=\s*["'][A-Za-z0-9@#$%^&*!_\-]{8,}["']
  conditions:
  - WHEN PRESENT ${pattern}
  - 'WHEN EXPR MISSING:SecureString|Get-Secret|Vault|\$env:'
reporting:
  type: area_of_interest
  reason: Detects hardcoded credentials or secrets assigned as plaintext string variables.
  trace:
  - Externalized rule logic for Hardcoded Credential in PowerShell Script.
  description: The code invokes an interpreter, process, dynamic expression, or template-execution mechanism. Trace
    executable selection and evaluated content to their trust boundaries.
  impact: If an attacker controls interpreted syntax or the operation selected, code or commands may run with the
    application’s privileges, allowing data theft, state changes, or service disruption.
  remediation: Replace externally influenced evaluation with fixed operations and data-only inputs. Use separate
    argument arrays for processes, allowlist permitted operations, and keep untrusted text out of executable templates
    or expressions.
  reviewer: Confirm no credential assignments use plaintext string literals. This can be confirmed as an issue when
    the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Determine whether the matched value is a real credential, key or token rather than a placeholder, public identifier
    or test fixture.
  - Inspect how it is used and where it is exposed, including source history, build artifacts, logs and deployment
    configuration.
  - Record the affected service and privileges without copying secret values into the review report.
  recommendations:
  - Keep real secrets out of source and public artifacts; obtain them through the deployment secret mechanism with
    restricted access.
  - If a credential has been exposed, revoke or rotate it and verify that old values no longer work; remove accidental
    logging and add a regression check.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '0'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: red
