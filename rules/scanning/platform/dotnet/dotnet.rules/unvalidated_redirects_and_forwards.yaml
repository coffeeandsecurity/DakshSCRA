format: daksh-pattern-rule/v1
id: dotnet.core.unvalidated_redirects_and_forwards
title: "Redirect Destination Review"
order: 12
category: Trust-boundary Validation or 3rd-Party Interactions
detection:
  pattern: (?i)Response\.Redirect
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:(IsLocalUrl|allowlist|whitelist|Uri\.TryCreate)
reporting:
  type: area_of_interest
  reason: Detects the usage of open redirect methods that can introduce security vulnerabilities.
  trace:
  - Externalized rule logic for Unvalidated Redirects and Forwards.
  description: The code handles a link, redirect, or externally selected navigation target. Validate the effective
    destination and any action triggered by the receiving handler.
  impact: A crafted destination or link may direct users to a phishing site, leak URL-carried secrets, or trigger
    unauthorized operations if routing trusts external parameters without the required access checks.
  remediation: Allowlist schemes, hosts, paths, and operations. Validate parsed link parameters, avoid credentials
    in URLs, and require authentication and authorization before sensitive actions.
  reviewer: Ensure that proper input validation and sanitization techniques are implemented for open redirect methods.
    Verify that developers have taken appropriate measures to prevent open redirect vulnerabilities, such as validating
    and constraining redirect URLs to trusted domains. Also assess the sensitivity of the redirect destinations
    and confirm that relevant security controls are in place. This can be confirmed as an issue when the matched
    path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Determine whether untrusted input controls the redirect destination and whether the redirect is reachable.
  - Inspect URL parsing, relative versus absolute destinations, scheme handling and authorization around the redirect.
  - Check how encoded or ambiguous URLs are interpreted by the framework and browser before confirming an unsafe
    redirect.
  recommendations:
  - Prefer application route identifiers mapped to fixed destinations; permit only necessary relative paths or explicitly
    allowed external destinations.
  - Reject unsupported schemes and ambiguous destinations and test redirect handling after decoding and normalization.
scan_config:
  match_mode: line
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: yellow
