format: daksh-pattern-rule/v1
id: mobile.android.core.credential_backup_correlation
title: Credential Backup Policy Review
order: 1101
category: Mobile Security
detection:
  pattern: <application\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: A credential-related preferences write is correlated with a source backup policy that may include that
    store. Resolve OS and target SDK behavior, build resources and actual value protection.
  description: A credential-related preferences write is correlated with a source backup policy that may include
    that store. Resolve OS and target SDK behavior, build resources and actual value protection.
  impact: Permitted backup or device-transfer contents may retain reusable credentials if storage protection and
    policy do not exclude them. This does not imply public backup access.
  remediation: Avoid password retention, use appropriate platform-backed credential protection and exclude credential
    stores from relevant backup and transfer scopes.
  reviewer: Verify the selected build and active callers. Retain unresolved evidence when runtime, backend or generated
    configuration is unavailable.
scan_config:
  match_mode: file
  context_lines_before: '0'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
