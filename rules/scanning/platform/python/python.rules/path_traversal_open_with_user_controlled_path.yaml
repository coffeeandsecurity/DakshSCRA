format: daksh-pattern-rule/v1
id: python.core.path_traversal_open_with_user_controlled_path
title: "Path Traversal Review"
order: 37
category: Path Traversal
detection:
  pattern: \bopen\s*\(\s*(?:os\.path\.join\s*\(|request\.|input\(|argv)
  conditions:
  - WHEN PRESENT \bopen\s*\(
  - WHEN EXPR PRESENT:request\.|input\(|argv|os\.path\.join && MISSING:os\.path\.realpath|os\.path\.abspath|startswith|allowlist|whitelist
reporting:
  type: area_of_interest
  reason: Detects file open calls that incorporate user-controlled path components.
  trace:
  - 'Externalized rule logic for Path Traversal: open() with User-Controlled Path.'
  description: The code accesses, creates, deletes, or shares filesystem data. Resolve path provenance, destination
    containment, permission modes, and any concurrent access.
  impact: An attacker controlling a path or shared file may read or replace private files, delete data, or redirect
    an operation outside its intended directory if containment and access controls are ineffective.
  remediation: Resolve paths beneath a fixed permitted root and verify containment and effective permissions. Use
    safe exclusive temporary-file creation, restrict sharing, and account for symlinks and concurrent changes.
  reviewer: Verify path normalization and base-directory containment checks around all user-influenced file open
    operations. This can be confirmed as an issue when the matched path is reachable and required controls are missing,
    weak, or inconsistent.
  review_steps:
  - Trace external influence over the path and resolve it as the filesystem will, including relative segments and
    symbolic links.
  - Check the resolved destination remains within the permitted root and that the caller is authorized for the specific
    file operation.
  - Inspect read, write and extraction paths separately; record the effective path restrictions and deployment permissions.
  recommendations:
  - Resolve paths against a fixed permitted root and enforce containment with filesystem-aware checks; avoid simple
    prefix checks.
  - Use application-controlled file identifiers where possible, restrict filesystem privileges, and test traversal
    and archive extraction boundaries.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
