format: daksh-pattern-rule/v1
id: php.framework.drupal.bulk_binding_review
title: Bulk Object Field Binding Review
order: 950
category: Security Operation Context
detection:
  pattern: \b(?:Object\s*\.\s*assign|BeanUtils\s*\.\s*copyProperties|TryUpdateModel(?:Async)?|UpdateModel|PopulateObject|bulk_(?:update|insert)_mappings|assign_attributes|update_attributes)\s*\(|(?:->|::)\s*(?:forceFill|fill|setAttributes)\s*\(|\b(?:JsonConvert\s*\.\s*)?DeserializeObject\s*<
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: An operation copies or binds object fields in bulk. Review the exact source, destination type and writable
    fields; this candidate does not establish mass assignment.
  description: An operation copies or binds object fields in bulk. Review the exact source, destination type and
    writable fields; this candidate does not establish mass assignment.
  impact: If untrusted fields can set privilege, ownership or protected state, a caller may exceed the intended
    operation permissions.
  remediation: Use an explicit request schema and an operation-specific writable-field allowlist. Assign ownership,
    tenant and privilege fields from trusted server context.
  reviewer: Verify the exact source, operation and applicable controls. This is a review candidate, not a confirmed
    vulnerability.
  review_steps:
  - An operation copies or binds object fields in bulk. Review the exact source, destination type and writable fields;
    this candidate does not establish mass assignment.
  - Check the control on the actual path; unrelated markers must not suppress the candidate.
  - Validate a reachable unsafe case and a protected control before confirming the issue.
  recommendations:
  - Use an explicit request schema and an operation-specific writable-field allowlist. Assign ownership, tenant
    and privilege fields from trusted server context.
scan_config:
  match_mode: line
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
