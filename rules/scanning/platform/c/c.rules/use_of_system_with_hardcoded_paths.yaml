format: daksh-pattern-rule/v1
id: c.core.use_of_system_with_hardcoded_paths
title: "Process Executable Path Review"
order: 6
category: Command Injection
detection:
  pattern: \bsystem\s*\(\s*["'].*(/bin|/usr/bin)
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:validate|check|verify && MISSING:test|example|sample
reporting:
  type: area_of_interest
  reason: Detects the use of `system()` with hardcoded file paths that may introduce security risks.
  trace:
  - Externalized rule logic for Use of `system()` with Hardcoded Paths.
  description: The code invokes a shell command containing a fixed executable path. Review shell interpretation,
    arguments, environment and privileges.
  impact: A fixed executable path does not prevent command injection if externally influenced arguments are interpreted
    as shell syntax. A constant command alone does not establish an exploitable defect.
  remediation: Prefer a fixed executable with a separate argument array and avoid shell interpretation of externally
    influenced text.
  reviewer: Confirm that no dangerous paths are used in `system()` calls. This can be confirmed as an issue when
    the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Identify the executable, arguments, shell use and working directory; trace external influence over each.
  - Check whether a shell interprets metacharacters or whether options can change command behavior even without
    a shell.
  - Verify the operation is reachable and examine validation, executable selection and process privileges before
    confirming an issue.
  recommendations:
  - Prefer a library API or a fixed executable with a separate argument array; avoid passing external text to a
    shell.
  - Restrict permitted operations and arguments, constrain option handling, and test rejected input under the actual
    deployment privileges.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
