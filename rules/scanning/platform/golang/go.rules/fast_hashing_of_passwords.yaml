format: daksh-pattern-rule/v1
id: golang.core.fast_hashing_of_passwords
title: "Password Hashing Review"
order: 6
category: Authentication and Credential Storage
detection:
  pattern: \b(?:sha256|sha512|sha1|md5)\.(?:New|Sum(?:256|512)?)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Fast hashing is used inside a password-processing function. Review whether password storage uses a salted,
    adaptive password hash.
  trace:
  - Inspect password-processing code and its authentication callers.
  description: Fast hashing is used inside a password-processing function. Review whether password storage uses
    a salted, adaptive password hash.
  impact: Offline password guessing can be cheaper when passwords use a fast general-purpose hash. This review condition
    does not establish database exposure.
  remediation: Use a maintained adaptive password-hashing implementation with a per-password salt and an appropriate
    work factor; migrate stored hashes on authentication.
  reviewer: Review the recorded operation and authentication call sites; a rule match is not proof of exploitation.
  review_steps:
  - Identify the purpose of the cryptographic operation, algorithm, mode, key or nonce handling, and protected data.
  - Distinguish password storage, confidentiality, integrity and non-security checksums; each requires different
    controls.
  - Inspect deployed configuration and all encrypt, decrypt or verification paths before deciding whether the use
    is unsafe.
  recommendations:
  - Use maintained high-level cryptographic APIs appropriate to the purpose; use authenticated encryption for confidential
    application data.
  - For passwords, use the platform password-hashing facility rather than a fast general-purpose digest. Verify
    key, nonce and migration handling for affected data.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: red
