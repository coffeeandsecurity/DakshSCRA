format: daksh-pattern-rule/v1
id: java.core.unencrypted_data_transmission_over_http
title: "Cleartext HTTP Communication Review"
order: 30
category: Information Disclosure
detection:
  pattern: new\s*HttpGet|new\s*HttpPost|new\s*HttpPut|new\s*HttpDelete|new\s*HttpURLConnection
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:http:// && MISSING:https://
reporting:
  type: area_of_interest
  reason: Detects the usage of HTTP client classes (HttpGet, HttpPost, HttpPut, HttpDelete, HttpURLConnection) without
    encryption, potentially resulting in information leaks.
  trace:
  - Externalized rule logic for Unencrypted Data Transmission over HTTP.
  description: The checked source contains a transport-security exception, insecure endpoint, or certificate-validation
    configuration. Resolve the effective policy and the connections it governs.
  impact: An attacker on the network may read or alter affected traffic if sensitive data travels over cleartext
    or the connection accepts an untrusted server. Normal HTTPS endpoints and correctly implemented validation do
    not establish exposure.
  remediation: Use HTTPS with normal certificate-chain and hostname verification. Remove permissive production callbacks
    and broad transport exceptions; restrict any justified exception to a documented, non-sensitive endpoint.
  reviewer: Verify that sensitive data is not transmitted over unencrypted HTTP connections. Assess whether appropriate
    encryption mechanisms are implemented using HTTP client classes and ensure the proper validation of server certificates.
    Also evaluate the overall security architecture and ensure that secure communication practices are followed.
    This can be confirmed as an issue when the matched path is reachable and required controls are missing, weak,
    or inconsistent.
  review_steps:
  - Inspect the effective connection settings, certificate-chain validation and hostname verification for the deployed
    client or server.
  - Trace configuration overrides, custom trust handlers and error paths; determine whether untrusted networks can
    affect the connection.
  - Verify the actual handshake and failure behavior against an untrusted or mismatched certificate before confirming
    a transport issue.
  recommendations:
  - Use authenticated encrypted transport and retain certificate and hostname verification; limit any development
    exception to a verified non-production scope.
  - Configure trust through the platform trust mechanism and test that invalid certificates and insecure protocol
    downgrades are rejected.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
