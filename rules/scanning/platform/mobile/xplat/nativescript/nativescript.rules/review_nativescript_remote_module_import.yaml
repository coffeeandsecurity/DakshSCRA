format: daksh-pattern-rule/v1
id: mobile.xplat.nativescript.core.review_nativescript_remote_module_import
title: "Remote Native Module Loading Review"
order: 15
category: CODE Review
detection:
  pattern: \bimport\s*\(\s*["\x27]https?://
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: An executable dynamic import names a remote HTTP or HTTPS module. Determine who controls that content
    and whether it is bundled, verified or replaceable after the application ships.
  impact: A caller outside the intended trust boundary may trigger privileged behavior or access data if component
    restrictions and runtime authorization are insufficient.
  remediation: Minimize exported surfaces and URI grants; validate parsed schemes, hosts and paths, use verified
    links where appropriate, and authorize each sensitive action.
  reviewer: Resolve merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded
    paths, nested intents, read/write grants and permission inheritance. Registration or permission presence alone
    does not prove unauthorized access.
  review_steps:
  - Resolve the exact instance, declaration, value and release configuration.
  - Resolve merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded paths,
    nested intents, read/write grants and permission inheritance. Registration or permission presence alone does
    not prove unauthorized access.
  - Confirm reachability and security impact before confirming an issue.
  recommendations:
  - Minimize exported surfaces and URI grants; validate parsed schemes, hosts and paths, use verified links where
    appropriate, and authorize each sensitive action.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
