format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_sql_raw_query_surface
title: "SQL Query Construction Review"
order: 55
category: CODE Review
detection:
  pattern: \b(?:rawQuery|execSQL)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The code invokes a raw SQL interface. The text match does not establish whether query structure is
    controlled by external data. Resolve the exact declaration or operation in the selected build and identify its
    security boundary.
  impact: If untrusted values are concatenated into SQL syntax, an attacker may read or modify database records
    or bypass data-access restrictions with the database connection’s privileges.
  remediation: Bind data values as parameters and allowlist dynamic identifiers. Trace query construction and validate
    object-level authorization for the records being accessed. Apply the least-privilege platform control appropriate
    to the matched operation and verify the production configuration.
  reviewer: Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths;
    source evidence alone does not establish shipped or runtime behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Bind data values as parameters and allowlist dynamic identifiers. Trace query construction and validate object-level
    authorization for the records being accessed. Apply the least-privilege platform control appropriate to the
    matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
