format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_weak_biometric
title: "Biometric Authentication Policy Review"
order: 40
category: AUTH Review
detection:
  pattern: \bsetAllowedAuthenticators\s*\([^\n;]{0,160}\bBIOMETRIC_WEAK\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: Biometric policy accepts a weaker authenticator, any enrolled biometric set, or a cached authentication
    result. Verify the protection required by the guarded operation. Trace the actual authorization decision, credential
    binding and failure path rather than accepting a local success marker.
  impact: A person who satisfies a weaker or previously cached authentication condition may unlock protected operations
    or keys without the user-presence or enrollment guarantees required by the application.
  remediation: Select the authenticator strength and freshness required by the operation. Bind sensitive keys to
    the intended authentication policy and invalidate them on enrollment changes when the threat model requires
    it. Enforce authorization on the trusted server and bind local authentication to protected keys or credentials
    where required; use external-browser authorization and proof-key protection for public native clients.
  reviewer: Test cancellation, device-credential fallback, enrollment changes, stale reuse windows, redirect interception
    and unavailable secure storage; local biometrics do not replace server authorization.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test cancellation, device-credential fallback, enrollment changes, stale reuse windows, redirect interception
    and unavailable secure storage; local biometrics do not replace server authorization.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Select the authenticator strength and freshness required by the operation. Bind sensitive keys to the intended
    authentication policy and invalidate them on enrollment changes when the threat model requires it. Enforce authorization
    on the trusted server and bind local authentication to protected keys or credentials where required; use external-browser
    authorization and proof-key protection for public native clients.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
