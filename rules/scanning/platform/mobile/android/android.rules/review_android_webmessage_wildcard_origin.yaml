format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_webmessage_wildcard_origin
title: "Message Origin Policy Review"
order: 50
category: PLATFORM Review
detection:
  pattern: \b(?:postWebMessage|addWebMessageListener)\s*\([^;\n]{0,500}(?:["\x27]\*["\x27])
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: An origin policy accepts a wildcard for browser requests or WebView messaging. Identify the resources
    or native operations accessible through this policy. Resolve the loaded content and frame origin, the exact
    WebView instance, and the native operations available to that content.
  impact: An untrusted website may read protected responses or invoke privileged message handlers if the effective
    origin policy admits it and the resource or handler lacks the required independent access controls.
  remediation: Allow only the exact trusted origins required by the feature. Authenticate and authorize each operation
    independently; validate message origin and content before invoking native functionality. Restrict schemes and
    parsed hosts, isolate external content, and validate messages and permissions on the native side.
  reviewer: Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView
    beside an unsafe instance; JavaScript enablement alone is not a vulnerability.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Allow only the exact trusted origins required by the feature. Authenticate and authorize each operation independently;
    validate message origin and content before invoking native functionality. Restrict schemes and parsed hosts,
    isolate external content, and validate messages and permissions on the native side.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
