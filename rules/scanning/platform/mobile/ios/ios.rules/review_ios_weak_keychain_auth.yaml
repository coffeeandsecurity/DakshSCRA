format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_weak_keychain_auth
title: "Keychain Biometric Access Review"
order: 22
category: AUTH Review
detection:
  pattern: \b(?:biometryAny|kSecAccessControlBiometryAny)\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: Biometric policy accepts a weaker authenticator, any enrolled biometric set, or a cached authentication
    result. Verify the protection required by the guarded operation. Identify the value written, backing store and
    access class, including backup, restore, reinstall and logout behavior.
  impact: A person who satisfies a weaker or previously cached authentication condition may unlock protected operations
    or keys without the user-presence or enrollment guarantees required by the application.
  remediation: Select the authenticator strength and freshness required by the operation. Bind sensitive keys to
    the intended authentication policy and invalidate them on enrollment changes when the threat model requires
    it. Keep privileged secrets on the server, use appropriate device-backed secure storage for local credentials,
    and restrict backup and sharing to intended non-sensitive data.
  reviewer: Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after
    reinstall, and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store
    as protection.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall,
    and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Select the authenticator strength and freshness required by the operation. Bind sensitive keys to the intended
    authentication policy and invalidate them on enrollment changes when the threat model requires it. Keep privileged
    secrets on the server, use appropriate device-backed secure storage for local credentials, and restrict backup
    and sharing to intended non-sensitive data.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
