format: daksh-pattern-rule/v1
id: mobile.xplat.flutter.core.review_flutter_sensitive_text_prediction
title: "Sensitive Input Prediction Review"
order: 22
category: PRIVACY Review
detection:
  pattern: \b(?:autocorrect|enableSuggestions)\s*:\s*true\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The same TextField or TextFormField both obscures its input and enables autocorrection or suggestions.
    Verify whether sensitive values can reach keyboard prediction or learning services on each supported platform.
  impact: Sensitive information may reach logs, other applications, keyboard services, screen capture, analytics
    or unintended recipients.
  remediation: Disable autocorrection and suggestions for sensitive text fields, select appropriate secure input
    and autofill settings, and test actual keyboard behavior on Android and iOS.
  reviewer: Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime;
    permission or API capability alone does not establish collection or malicious behavior.
  review_steps:
  - Resolve the exact instance, declaration, value and release configuration.
  - Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime; permission
    or API capability alone does not establish collection or malicious behavior.
  - Confirm reachability and security impact before confirming an issue.
  recommendations:
  - Disable autocorrection and suggestions for sensitive text fields, select appropriate secure input and autofill
    settings, and test actual keyboard behavior on Android and iOS.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
