format: daksh-pattern-rule/v1
id: python.core.direct_password_comparison_review
title: "Password Comparison Review"
order: 40
category: Authentication and Session Security
detection:
  pattern: \b(?:password|passwd|pwd)\b(?:\s*[\x27\x22]\s*\])?\s*(?:==|!=)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: A password-named value is directly compared; investigate whether this is
    authentication or a harmless confirmation check.
  description: Python syntax directly compares a password-named field with another
    password field or dictionary value. This supports a credential-storage review;
    field names alone do not establish plaintext database contents.
  impact: If the stored operand is a plaintext or equivalently reusable password and
    the other operand is the submitted credential, a storage leak exposes reusable
    credentials. ORM parameter binding prevents SQL injection but does not protect
    stored passwords.
  remediation: Verify the active login and registration paths. Store a salted password
    hash using an appropriate password-hashing library and verify with its checking
    API. Do not replace this with fast general-purpose hashing or reversible encryption.
  reviewer: Trace both operands. Verify storage representation and active route registration.
    A nearby hash helper does not protect this comparison; a password confirmation
    form alone does not establish plaintext storage.
  review_steps:
  - Trace both operands to stored data and the submitted request.
  - Check registration writes and login verification; record uncertainty about database
    contents.
  recommendations:
  - Use a dedicated password-hashing and verification library for authentication.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
