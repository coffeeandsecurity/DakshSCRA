format: daksh-pattern-rule/v1
id: java.framework.spring.anonymous_operation_review
title: Explicit Anonymous Operation Review
order: 950
category: Security Operation Context
detection:
  pattern: \[AllowAnonymous(?:Attribute)?\b|@PermitAll\b|\bpermitAll\s*\(|\b(?:AllowAnonymous|withAnonymousAccess)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: An explicit anonymous-access declaration is present. Associate it with the affected route and operations,
    including inherited policy requirements.
  description: An explicit anonymous-access declaration is present. Associate it with the affected route and operations,
    including inherited policy requirements.
  impact: Public access is often intentional. A defect exists only if the reachable operation requires identity
    or resource permissions that are not enforced.
  remediation: Declare public entry points intentionally and enforce the required resource permissions at sensitive
    operations. Test neighboring protected routes and override behavior.
  reviewer: Verify the exact source, operation and applicable controls. This is a review candidate, not a confirmed
    vulnerability.
  review_steps:
  - An explicit anonymous-access declaration is present. Associate it with the affected route and operations, including
    inherited policy requirements.
  - Check the control on the actual path; unrelated markers must not suppress the candidate.
  - Validate a reachable unsafe case and a protected control before confirming the issue.
  recommendations:
  - Declare public entry points intentionally and enforce the required resource permissions at sensitive operations.
    Test neighboring protected routes and override behavior.
scan_config:
  match_mode: line
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
