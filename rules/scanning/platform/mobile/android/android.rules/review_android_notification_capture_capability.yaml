format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_notification_capture_capability
title: "Notification Access Capability"
order: 62
category: PRIVACY Review
detection:
  pattern: \b(?:onNotificationPosted|onNotificationRemoved)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The application uses an accessibility or notification-access capability that can observe information
    or interact with other applications. Identify the actual sensitive value and the recipients, retention and user-consent
    context of this exposure or capability.
  impact: Captured interface or notification content may disclose private messages, authentication codes, or user
    activity; automated actions may affect other applications if the capability is used beyond the user’s authorization.
  remediation: Explain the capability clearly and require appropriate user authorization. Limit captured content
    and automated actions to the requested feature, minimize retention, and prevent unauthorized transmission. Minimize
    collection and retention, redact secret values, and apply the platform controls needed for sensitive UI and
    data sharing.
  reviewer: Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime;
    permission or API capability alone does not establish collection or malicious behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime; permission
    or API capability alone does not establish collection or malicious behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Explain the capability clearly and require appropriate user authorization. Limit captured content and automated
    actions to the requested feature, minimize retention, and prevent unauthorized transmission. Minimize collection
    and retention, redact secret values, and apply the platform controls needed for sensitive UI and data sharing.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
