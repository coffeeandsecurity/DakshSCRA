format: daksh-pattern-rule/v1
id: common.core.ipv4_ipv6_address
title: "IP Address Usage Review"
order: 15
category: Trust-boundary Validation or 3rd-Party Interactions
detection:
  pattern: (?<![A-Za-z0-9_:.%])(?:[A-Fa-f0-9]{0,4}:){2,8}[A-Fa-f0-9.]{0,45}(?:%[A-Za-z0-9_.~-]{1,64})?(?![A-Za-z0-9_:.%])|(?<![A-Za-z0-9_:.])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![A-Za-z0-9_.%])
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Review validated IP address literals; reject recognized version strings, invalid addresses and regex or scope-operator
    fragments.
  trace:
  - Externalized rule logic for IPv4 / IPv6 Address.
  description: A syntactically valid address literal occurs outside recognized version metadata or source-code syntax. An
    address occurrence is a review surface, not a vulnerability.
  impact: A boundary that trusts unauthorized callers or exposes private output may permit data disclosure or state changes.
    A declaration, address, or architectural marker alone does not establish such a failure.
  remediation: Check the purpose of the address, how it is configured and which operations use it. For network destinations,
    review access policy, resolved addresses and deployment overrides. Do not treat every literal address as insecure.
  reviewer: Verify the complete IPv4 or IPv6 value and its use as a destination, bind address, mask or access rule. Distinguish
    version metadata, regular-expression syntax and examples from active configuration. A literal alone does not prove exposure
    or a trust-boundary failure.
  review_steps:
  - Inspect the matched construct in its containing function or configuration and identify the security-sensitive behavior
    under review.
  - Verify reachable callers, external influence and effective protections, including deployment overrides and failure paths.
  - Record concrete evidence for a confirmed issue or a justified suppression; retain an unresolved outcome when the required
    evidence is unavailable.
  recommendations:
  - Apply the rule-specific correction above only after verifying the affected behavior and required control.
  - Add a regression case for the unsafe condition and a valid protected case; verify the effective behavior in the relevant
    deployment.
  fail_reason: 'No validated address literal remains: candidates are invalid addresses, recognized version metadata, or non-address
    source syntax.'
scan_config:
  match_mode: line
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: yellow
