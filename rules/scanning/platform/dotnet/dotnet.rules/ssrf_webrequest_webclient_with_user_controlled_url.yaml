format: daksh-pattern-rule/v1
id: dotnet.core.ssrf_webrequest_webclient_with_user_controlled_url
title: "Server-Side Request Forgery Review"
order: 26
category: Server-Side Request Forgery (SSRF)
detection:
  pattern: WebRequest\.Create\s*\(|new\s+WebClient\s*\(\s*\)|new\s+HttpWebRequest\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:Request\.|QueryString|Form|userInput|\+ && MISSING:allowlist|whitelist|Uri\.IsWellFormedUriString
reporting:
  type: area_of_interest
  reason: Detects legacy outbound HTTP requests potentially driven by user-supplied URLs.
  trace:
  - 'Externalized rule logic for SSRF: WebRequest/WebClient with User-Controlled URL.'
  description: The application makes an outbound request whose destination may be influenced by external data. Resolve
    URL construction, redirects, DNS results, and network reachability.
  impact: If an attacker can select a reachable destination, the application may expose internal services or metadata
    credentials, or send protected data to an unauthorized recipient.
  remediation: Allowlist required destinations and protocols, validate resolved addresses and every redirect, and
    restrict outbound access to internal and metadata services.
  reviewer: Trace URL origin to WebRequest/WebClient calls and verify allowlist-based validation. This can be confirmed
    as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Verify the operation makes a server-side request, then trace external control over the URL, host, port and redirects.
  - Inspect destination restrictions, DNS resolution and redirect handling; distinguish fixed destinations from
    caller-controlled requests.
  - Check deployment egress controls and whether internal services or local files are reachable from the requesting
    process.
  recommendations:
  - Prefer fixed destinations or a restricted set of permitted services; validate schemes, hosts and ports before
    the request.
  - Apply destination checks to redirects and resolved addresses where applicable, restrict network egress, and
    test prohibited destinations.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
