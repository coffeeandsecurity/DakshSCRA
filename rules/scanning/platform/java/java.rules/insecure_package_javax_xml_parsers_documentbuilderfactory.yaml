format: daksh-pattern-rule/v1
id: java.core.insecure_package_javax_xml_parsers_documentbuilderfactory
title: "XML Parser Configuration Review"
order: 21
category: Insecure/Deprecated Libraries
detection:
  pattern: javax\.xml\.parsers\.DocumentBuilderFactory
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:setFeature.*XMLConstants\.FEATURE_SECURE_PROCESSING|setFeature.*disallow-doctype-decl|setExpandEntityReferences\s*\(\s*false|XMLInputFactory.*IS_SUPPORTING_EXTERNAL_ENTITIES.*false
reporting:
  type: area_of_interest
  reason: Detects the use of javax.xml.parsers.DocumentBuilderFactory, which may lead to XML external entity (XXE)
    attacks.
  trace:
  - 'Externalized rule logic for Insecure Package: javax.xml.parsers.DocumentBuilderFactory.'
  description: The code parses or transforms XML. Resolve external entity, DTD, and resource-loading settings for
    the actual parser instance.
  impact: If external resources or entity expansion are permitted for untrusted XML, an attacker may read local
    files, make requests to internal services, or exhaust parser resources.
  remediation: Disable external entities and DTD loading for untrusted XML, use a restrictive resolver, and enforce
    input-size and expansion limits on the effective parser.
  reviewer: Ensure that the XML parsing is done securely, with proper configurations in place to mitigate XXE vulnerabilities.
    This can be confirmed as an issue when the matched path is reachable and required controls are missing, weak,
    or inconsistent.
  review_steps:
  - Identify the parser and whether untrusted XML reaches it; inspect its effective settings rather than relying
    on library defaults.
  - Check external entity resolution, DTD processing, network or file access, and limits for document size and expansion.
  - Inspect all parser construction paths and error handling; record which reachable path lacks the required restrictions.
  recommendations:
  - Configure the parser to disable unneeded external entities and DTD processing; restrict resolvers when those
    features are necessary.
  - Apply document and expansion limits and test prohibited file or network resolution in the deployed parser configuration.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
