format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_webview_safe_browsing_disabled
title: WebView Safe Browsing Disabled
order: 52
category: NETWORK Review
detection:
  pattern: \b(?:setSafeBrowsingEnabled\s*\(\s*false\s*\)|safeBrowsingEnabled\s*=\s*false\b)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: WebView configuration explicitly disables the platform’s safe-browsing checks. Resolve the loaded
    content and frame origin, the exact WebView instance, and the native operations available to that content.
  impact: Users may be exposed to known malicious or phishing content without the platform’s warning or blocking
    layer when such content is loaded.
  remediation: Keep safe browsing enabled for externally reachable web content. Restrict navigation to required
    trusted destinations and handle unsafe-resource callbacks without bypassing warnings. Restrict schemes and parsed
    hosts, isolate external content, and validate messages and permissions on the native side.
  reviewer: Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView
    beside an unsafe instance; JavaScript enablement alone is not a vulnerability.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Keep safe browsing enabled for externally reachable web content. Restrict navigation to required trusted destinations
    and handle unsafe-resource callbacks without bypassing warnings. Restrict schemes and parsed hosts, isolate
    external content, and validate messages and permissions on the native side.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
