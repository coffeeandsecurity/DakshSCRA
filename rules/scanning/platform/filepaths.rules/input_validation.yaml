format: daksh-pattern-rule/v1
id: filepaths.core.input_validation
title: "Input Validation Review"
order: 11
detection:
  pattern: (?i)(validation|sanitize|input)
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:(?i)(/|\\\\).*(validation|validator|sanitize|input) && MISSING:(?i)(/docs?/|/examples?/|/samples?/|/tests?/)
reporting:
  type: area_of_interest
  reason: Detects file paths related to input validation functionality.
  description: A file or directory name matches the input validation review area. This check inspects paths, not
    the implementation or a reachable execution path.
  impact: External input may cause injection, incorrect decisions, or unauthorized data access if it reaches a sensitive
    operation without the controls required by that operation. Reading input alone does not establish a vulnerability.
    A filename match alone does not establish this consequence.
  remediation: Validate type, size, and allowed values at trust boundaries, and apply destination-specific parameter
    binding or output encoding. Enforce authorization independently of input validation.
  reviewer: Verify the presence and correctness of input validation-related code. This can be confirmed as an issue
    when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched file or directory contents and determine whether it is deployed or externally accessible.
  - Identify whether sensitive data, configuration or executable content is present; a name match alone does not
    establish exposure.
  - Check effective access controls and build or packaging exclusions and record the specific content and exposure
    path.
  recommendations:
  - Where exposure is verified, remove unnecessary files from deployment or restrict access to the intended users
    and processes.
  - Verify the deployed artifact and access behavior after the change; retain required application files with appropriate
    controls.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
