format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_pasteboard_read_capability
title: "Clipboard Read Capability"
order: 34
category: PRIVACY Review
detection:
  pattern: \b(?:UIPasteboard\s*\.\s*general\s*\.\s*(?:string|strings|items|data)|generalPasteboard\s*\]\s*(?:\.\s*(?:string|items)|\s+(?:string|items)\s*\]))
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The application reads the shared clipboard or pasteboard. Review whether the read follows an explicit
    paste action and whether the returned content enters logs, storage, or network requests. Identify the actual
    sensitive value and the recipients, retention and user-consent context of this exposure or capability.
  impact: Passwords, payment details, or other private content copied from another application could be collected
    or disclosed if clipboard reads occur without user intent or the content is sent to an unauthorized recipient.
    Platform access restrictions and the actual handling of the data determine exposure.
  remediation: Read clipboard content only for an explicit user paste action. Process only the value needed for
    that action, avoid logging or transmitting it unnecessarily, and respect platform clipboard access restrictions.
    Minimize collection and retention, redact secret values, and apply the platform controls needed for sensitive
    UI and data sharing.
  reviewer: Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime;
    permission or API capability alone does not establish collection or malicious behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime; permission
    or API capability alone does not establish collection or malicious behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Read clipboard content only for an explicit user paste action. Process only the value needed for that action,
    avoid logging or transmitting it unnecessarily, and respect platform clipboard access restrictions. Minimize
    collection and retention, redact secret values, and apply the platform controls needed for sensitive UI and
    data sharing.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
