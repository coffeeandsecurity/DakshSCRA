format: daksh-pattern-rule/v1
id: mobile.xplat.reactnative.core.review_reactnative_webview_origin_all
title: "WebView Navigation Policy Review"
order: 19
category: PLATFORM Review
detection:
  pattern: \boriginWhitelist\s*=\s*\{\s*\[\s*["\x27]\*["\x27]
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A WebView origin whitelist contains a wildcard. Trace the content and native bridge privileges; static
    local HTML may legitimately require a wildcard, while external navigation needs instance-specific controls.
  impact: Untrusted frames or navigation may reach privileged native operations or expose session data if origin
    isolation and per-operation authorization are insufficient.
  remediation: Restrict schemes and parsed hosts, isolate external content, and validate messages and permissions
    on the native side.
  reviewer: Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView
    beside an unsafe instance; JavaScript enablement alone is not a vulnerability.
  review_steps:
  - Resolve the exact instance, declaration, value and release configuration.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Confirm reachability and security impact before confirming an issue.
  recommendations:
  - Restrict schemes and parsed hosts, isolate external content, and validate messages and permissions on the native
    side.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
