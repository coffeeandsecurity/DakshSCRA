format: daksh-pattern-rule/v1
id: common.core.authentication_modules
title: "Authentication Review"
order: 1
category: Authentication or Authorization Functionalities
detection:
  pattern: (?i)\b(Login|authenticate|authenticating|authenticated|oauth|jwt)\b
  conditions:
  - WHEN PRESENT (?i)\b(login|authenticate|oauth|jwt)\b
  - WHEN EXPR PRESENT:(?i)\b(auth|login|token|session|credential)\b
reporting:
  type: area_of_interest
  reason: Detects authentication-related markers for human review. Package names, license headers and example labels
    do not invalidate executable authentication code; a marker is not proof of effective authentication.
  trace:
  - Externalized rule logic for Authentication Modules.
  description: The checked code implements an identity, access-control, or abuse-prevention decision. Determine
    the trusted verifier, protected resources, and whether the control is enforced on every relevant path.
  impact: If identity or resource authorization can be bypassed, an attacker may impersonate a user, access another
    user’s data, or perform restricted operations. A control’s presence alone does not establish a weakness.
  remediation: Enforce authentication and object-level authorization on the trusted server or privileged boundary.
    Use strong verifier material, appropriate rate limits and recovery controls, and test access by unauthenticated
    and insufficiently privileged callers.
  reviewer: Verify that authentication mechanisms are implemented securely, with protections like parameterized
    inputs, encryption, and secure session management. This can be confirmed as an issue when the matched path is
    reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Identify the trusted identity verifier, protected resources and decision made by the matched control.
  - Inspect effective middleware and service checks, alternate routes and failure paths; validate the supplied evidence
    before issuing privileges.
  - Test invalid identity evidence, insufficient permissions and access to another user or tenant before confirming
    a bypass.
  recommendations:
  - Use a trusted verifier and enforce the applicable server-side identity and resource checks consistently.
  - Fail closed on invalid evidence and test that alternate routes and error paths cannot issue unintended access.
scan_config:
  match_mode: line
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: yellow
