format: daksh-pattern-rule/v1
id: python.core.network_calls_urllib2_and_socket
title: "Network Request Review"
order: 7
category: Untrusted Input Handling or Injection Flaws
detection:
  pattern: (?i)(urllib2|socket)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects the usage of network-related modules urllib2 and socket in Python code.
  trace:
  - 'Externalized rule logic for Network Calls: urllib2 and socket.'
  description: The application makes an outbound request whose destination may be influenced by external data. Resolve
    URL construction, redirects, DNS results, and network reachability.
  impact: If an attacker can select a reachable destination, the application may expose internal services or metadata
    credentials, or send protected data to an unauthorized recipient.
  remediation: Allowlist required destinations and protocols, validate resolved addresses and every redirect, and
    restrict outbound access to internal and metadata services.
  reviewer: Verify that the usage of urllib2 and socket modules is secure and that proper input validation and security
    best practices are followed when making network calls. Any potential security concerns should be flagged for
    further review and remediation. This can be confirmed as an issue when the matched path is reachable and required
    controls are missing, weak, or inconsistent.
  review_steps:
  - Identify who can supply the matched input, including stored values and upstream services; record its type, size
    limits and trust boundary.
  - Trace the value through transformations to each sensitive operation. Check the protection at that destination
    and resource-level authorization.
  - Inspect the actual validation or protection implementation and its error path. A nearby keyword or a client-side
    check alone is insufficient evidence.
  recommendations:
  - Use server-side type, length and allowed-value checks appropriate to the input. For free-form text, preserve
    legitimate characters and protect each destination separately.
  - Bind database values as parameters, encode output for its rendering context, and constrain file or network destinations
    where applicable. Test rejected input and unauthorized access.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
