format: daksh-pattern-rule/v1
id: mobile.xplat.cordova.core.review_cordova_inappbrowser_ssl_bypass
title: "TLS Certificate Validation Review"
order: 12
category: NETWORK Review
detection:
  pattern: (?i)\b(?:IgnoreSSLErrors\s*=\s*yes|name\s*=\s*["\x27]IgnoreSSLErrors["\x27]\s+value\s*=\s*["\x27]true["\x27])
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The checked code or configuration bypasses a certificate, hostname, or server-trust decision. Resolve
    the effective callback and build configuration before confirming a production bypass. Resolve the particular
    connection, host and client configuration selected by the shipped build.
  impact: A network attacker may impersonate the intended server and read or modify traffic if the bypass accepts
    an untrusted certificate or mismatched hostname on a reachable connection.
  remediation: Restore platform certificate-chain and hostname validation. Reject invalid server trust, remove permissive
    callbacks and environment overrides from production, and use properly configured test trust stores for development.
    Use platform trust and hostname validation and encrypted transport. Remove permissive callbacks and narrow necessary
    exceptions to the intended hosts.
  reviewer: Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted
    client or HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or
    HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Restore platform certificate-chain and hostname validation. Reject invalid server trust, remove permissive callbacks
    and environment overrides from production, and use properly configured test trust stores for development. Use
    platform trust and hostname validation and encrypted transport. Remove permissive callbacks and narrow necessary
    exceptions to the intended hosts.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
