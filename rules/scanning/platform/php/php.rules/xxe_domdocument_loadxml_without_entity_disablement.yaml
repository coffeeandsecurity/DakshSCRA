format: daksh-pattern-rule/v1
id: php.core.xxe_domdocument_loadxml_without_entity_disablement
title: "XML External Entity Review"
order: 28
category: XML External Entity (XXE)
detection:
  pattern: \$dom\s*=\s*new\s+DOMDocument|DOMDocument\s*\(\s*\)|simplexml_load_string\s*\(|simplexml_load_file\s*\(|SimpleXMLElement\s*\(
  conditions:
  - WHEN PRESENT \$dom\s*=\s*new\s+DOMDocument|simplexml_load_string\s*\(|simplexml_load_file\s*\(
  - WHEN EXPR MISSING:LIBXML_NOENT\s*=\s*0|libxml_disable_entity_loader\s*\(\s*true\s*\)|LIBXML_DTDLOAD
reporting:
  type: area_of_interest
  reason: Detects PHP XML parsing functions that may be vulnerable to XXE attacks.
  trace:
  - 'Externalized rule logic for XXE: DOMDocument loadXML Without Entity Disablement.'
  description: The code parses or transforms XML. Resolve external entity, DTD, and resource-loading settings for
    the actual parser instance.
  impact: If external resources or entity expansion are permitted for untrusted XML, an attacker may read local
    files, make requests to internal services, or exhaust parser resources.
  remediation: Disable external entities and DTD loading for untrusted XML, use a restrictive resolver, and enforce
    input-size and expansion limits on the effective parser.
  reviewer: Confirm that libxml_disable_entity_loader(true) or equivalent protections are applied before all XML
    parsing of untrusted data. This can be confirmed as an issue when the matched path is reachable and required
    controls are missing, weak, or inconsistent.
  review_steps:
  - Identify the parser and whether untrusted XML reaches it; inspect its effective settings rather than relying
    on library defaults.
  - Check external entity resolution, DTD processing, network or file access, and limits for document size and expansion.
  - Inspect all parser construction paths and error handling; record which reachable path lacks the required restrictions.
  recommendations:
  - Configure the parser to disable unneeded external entities and DTD processing; restrict resolvers when those
    features are necessary.
  - Apply document and expansion limits and test prohibited file or network resolution in the deployed parser configuration.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
