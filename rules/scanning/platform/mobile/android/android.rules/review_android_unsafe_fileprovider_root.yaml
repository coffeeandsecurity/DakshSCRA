format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_unsafe_fileprovider_root
title: "FileProvider Root Scope Review"
order: 39
category: PLATFORM Review
detection:
  pattern: <(?:root-path|external-path)\b[^>]{0,300}\bpath\s*=\s*["\x27](?:/|\.|\./)["\x27]
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A file provider, plugin, or WebView permits access to a broad filesystem scope or relaxes file-origin
    isolation. Resolve the external entry point, its caller or URI grant, and the sensitive operation or resource
    reached.
  impact: Untrusted content or a recipient with a usable file grant may read private files, disclose stored credentials,
    or access resources outside the directory intended for sharing.
  remediation: Expose only dedicated app-owned sharing directories. Keep WebView file-origin and universal access
    disabled where possible, validate navigation, and issue narrowly scoped temporary file grants only to intended
    recipients. Minimize exported surfaces and URI grants; validate parsed schemes, hosts and paths, use verified
    links where appropriate, and authorize each sensitive action.
  reviewer: Resolve merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded
    paths, nested intents, read/write grants and permission inheritance. Registration or permission presence alone
    does not prove unauthorized access.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Resolve merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded paths,
    nested intents, read/write grants and permission inheritance. Registration or permission presence alone does
    not prove unauthorized access.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Expose only dedicated app-owned sharing directories. Keep WebView file-origin and universal access disabled
    where possible, validate navigation, and issue narrowly scoped temporary file grants only to intended recipients.
    Minimize exported surfaces and URI grants; validate parsed schemes, hosts and paths, use verified links where
    appropriate, and authorize each sensitive action.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
