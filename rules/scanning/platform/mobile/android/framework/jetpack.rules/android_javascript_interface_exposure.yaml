format: daksh-pattern-rule/v1
id: mobile.android.framework.jetpack.android_javascript_interface_exposure
title: Android JavaScript Interface Exposure
order: 6
category: Framework-Specific Security
detection:
  pattern: addJavascriptInterface\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects JavaScript bridge exposure into WebView.
  trace:
  - Externalized mobile rule logic for Android JavaScript Interface Exposure.
  description: 'Review target: Android JavaScript Interface Exposure. The application exposes script execution or
    a native interface to rendered web content. Resolve the content source and effective origin restrictions. Resolve
    the loaded content and frame origin, the exact WebView instance, and the native operations available to that
    content.'
  impact: Attacker-controlled content may execute in a trusted page or invoke native operations, exposing application
    data or privileges when origin isolation and operation authorization are insufficient.
  remediation: Restrict loaded origins, avoid interpolating untrusted data into scripts, and expose only required
    native operations with input validation and per-operation authorization. Restrict schemes and parsed hosts,
    isolate external content, and validate messages and permissions on the native side.
  reviewer: Review annotated bridge methods and content trust boundaries. This can be confirmed as an issue when
    the matched path is reachable and required controls are missing, weak, or inconsistent. Test subframes, redirects,
    javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside an unsafe instance; JavaScript
    enablement alone is not a vulnerability.
  review_steps:
  - Identify the loaded content, permitted origins and script-to-native operations exposed by the application.
  - Inspect navigation, message validation and resource or operation authorization on the native side.
  - Test untrusted content and unexpected messages; a bridge declaration alone does not prove unauthorized native
    access.
  - Resolve the loaded content and frame origin, the exact WebView instance, and the native operations available
    to that content.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Restrict trusted content and navigation and expose only the native operations required by the application.
  - Validate messages and enforce native-side authorization; test rejection of unapproved origins and unexpected
    operations.
  - Restrict schemes and parsed hosts, isolate external content, and validate messages and permissions on the native
    side.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '3'
  context_lines_after: '0'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: magenta
