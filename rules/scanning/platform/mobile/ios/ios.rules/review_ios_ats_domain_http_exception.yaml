format: daksh-pattern-rule/v1
id: mobile.ios.core.review_ios_ats_domain_http_exception
title: "ATS HTTP Exception Review"
order: 43
category: NETWORK Review
detection:
  pattern: <key>NSExceptionAllowsInsecureHTTPLoads</key>
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The effective transport policy may permit insecure HTTP content or relax transport protections for
    a WebView, media request, domain, or application. Resolve the particular connection, host and client configuration
    selected by the shipped build.
  impact: A network attacker may read or modify affected cleartext traffic. Modified executable web content may
    also compromise the containing WebView session or exposed native interfaces.
  remediation: Use HTTPS with normal certificate validation. Remove unnecessary transport exceptions, keep any unavoidable
    exception narrowly scoped, and avoid sending credentials or loading executable content over cleartext connections.
    Use platform trust and hostname validation and encrypted transport. Remove permissive callbacks and narrow necessary
    exceptions to the intended hosts.
  reviewer: Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted
    client or HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or
    HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Use HTTPS with normal certificate validation. Remove unnecessary transport exceptions, keep any unavoidable
    exception narrowly scoped, and avoid sending credentials or loading executable content over cleartext connections.
    Use platform trust and hostname validation and encrypted transport. Remove permissive callbacks and narrow necessary
    exceptions to the intended hosts.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
