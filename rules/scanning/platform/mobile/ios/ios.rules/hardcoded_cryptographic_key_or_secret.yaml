format: daksh-pattern-rule/v1
id: mobile.ios.core.hardcoded_cryptographic_key_or_secret
title: "Hardcoded Cryptographic Key Review"
order: 17
category: Framework-Specific Security
detection:
  pattern: (?i)(apiKey|api_key|secret|privateKey|encryptionKey|password|token)\s*[:=]\s*["'][A-Za-z0-9/+]{16,}["']
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects likely hardcoded cryptographic keys or credentials in iOS Swift/Objective-C source.
  trace:
  - Externalized mobile rule logic for Hardcoded Cryptographic Key or Secret.
  description: 'Review target: Hardcoded Cryptographic Key or Secret. The checked source or build configuration
    embeds potentially sensitive credential or key material. Determine whether it is active and whether it reaches
    distributed artifacts or logs. Identify the value written, backing store and access class, including backup,
    restore, reinstall and logout behavior.'
  impact: A party who can read exposed source, artifacts, configuration, or logs may recover active secrets and
    access the protected service or decrypt data with the secret owner’s privileges.
  remediation: Remove active secrets from source and build layers, rotate exposed values, and load replacements
    through a restricted secret-management facility. Use narrowly privileged, short-lived credentials. Keep privileged
    secrets on the server, use appropriate device-backed secure storage for local credentials, and restrict backup
    and sharing to intended non-sensitive data.
  reviewer: Verify no long-lived secrets or keys are embedded as string literals. This can be confirmed as an issue
    when the matched path is reachable and required controls are missing, weak, or inconsistent. Test device lock
    state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall, and secure-storage
    failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  review_steps:
  - Determine whether the matched value is a real credential, key or token rather than a placeholder, public identifier
    or test fixture.
  - Inspect how it is used and where it is exposed, including source history, build artifacts, logs and deployment
    configuration.
  - Record the affected service and privileges without copying secret values into the review report.
  - Identify the value written, backing store and access class, including backup, restore, reinstall and logout
    behavior.
  - Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall,
    and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Keep real secrets out of source and public artifacts; obtain them through the deployment secret mechanism with
    restricted access.
  - If a credential has been exposed, revoke or rotate it and verify that old values no longer work; remove accidental
    logging and add a regression check.
  - Keep privileged secrets on the server, use appropriate device-backed secure storage for local credentials, and
    restrict backup and sharing to intended non-sensitive data.
scan_config:
  match_mode: file
  context_type: none
  aggregate: file
  report_format: secret_list
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
