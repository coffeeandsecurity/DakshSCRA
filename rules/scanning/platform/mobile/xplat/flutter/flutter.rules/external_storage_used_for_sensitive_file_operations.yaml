format: daksh-pattern-rule/v1
id: mobile.xplat.flutter.core.external_storage_used_for_sensitive_file_operations
title: "External File Storage Review"
order: 6
category: Framework-Specific Issues - Flutter
detection:
  pattern: \bgetExternalStorageDirectory\s*\(|\bgetExternalFilesDir\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects sensitive file operations targeting external storage on Android.
  trace:
  - Externalized mobile rule logic for External Storage Used for Sensitive File Operations.
  description: 'Review target: External Storage Used for Sensitive File Operations. The code accesses, creates,
    deletes, or shares filesystem data. Resolve path provenance, destination containment, permission modes, and
    any concurrent access. Identify the value written, backing store and access class, including backup, restore,
    reinstall and logout behavior.'
  impact: An attacker controlling a path or shared file may read or replace private files, delete data, or redirect
    an operation outside its intended directory if containment and access controls are ineffective.
  remediation: Resolve paths beneath a fixed permitted root and verify containment and effective permissions. Use
    safe exclusive temporary-file creation, restrict sharing, and account for symlinks and concurrent changes. Keep
    privileged secrets on the server, use appropriate device-backed secure storage for local credentials, and restrict
    backup and sharing to intended non-sensitive data.
  reviewer: Verify the file path resolves to internal storage, or that content is encrypted before writing to external
    paths. This can be confirmed as an issue when the matched path is reachable and required controls are missing,
    weak, or inconsistent. Test device lock state, cloud backup versus device transfer, restored keys, keychain
    persistence after reinstall, and secure-storage failure; do not silently fall back to plaintext or treat an
    unrelated secure store as protection.
  review_steps:
  - Trace external influence over the path and resolve it as the filesystem will, including relative segments and
    symbolic links.
  - Check the resolved destination remains within the permitted root and that the caller is authorized for the specific
    file operation.
  - Inspect read, write and extraction paths separately; record the effective path restrictions and deployment permissions.
  - Identify the value written, backing store and access class, including backup, restore, reinstall and logout
    behavior.
  - Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall,
    and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Resolve paths against a fixed permitted root and enforce containment with filesystem-aware checks; avoid simple
    prefix checks.
  - Use application-controlled file identifiers where possible, restrict filesystem privileges, and test traversal
    and archive extraction boundaries.
  - Keep privileged secrets on the server, use appropriate device-backed secure storage for local credentials, and
    restrict backup and sharing to intended non-sensitive data.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
