format: daksh-pattern-rule/v1
id: kubernetes.core.host_ipc_namespace_shared
title: Host IPC Namespace Shared
order: 7
category: Host Namespace Sharing
detection:
  pattern: hostIPC\s*:\s*true
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:hostIPC:\s*true && MISSING:# intentional|# required
reporting:
  type: area_of_interest
  reason: Detects pods configured to share the host IPC namespace.
  trace:
  - Externalized rule logic for Host IPC Namespace Shared.
  description: The workload shares the host inter-process communication namespace.
  impact: A process with the necessary permissions may access host IPC resources or shared-memory content, exposing
    data or interfering with host applications.
  remediation: Disable host IPC sharing unless it is essential. Isolate required host-integrated workloads and restrict
    IPC resource permissions and process privileges.
  reviewer: Confirm hostIPC is restricted to justified low-level infrastructure workloads. This can be confirmed
    as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Resolve the effective privileges, filesystem modes or identity grants, including inherited and deployment-level
    permissions.
  - Determine which operations are required and whether an untrusted actor can exercise the excess access.
  - Record the affected resource and effective policy; distinguish a declared capability from an exploitable authorization
    gap.
  recommendations:
  - Limit access and privileges to the operations and resources the application requires; remove unnecessary broad
    grants.
  - Test permitted operations and denied access with the actual deployment identity and effective policy.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
