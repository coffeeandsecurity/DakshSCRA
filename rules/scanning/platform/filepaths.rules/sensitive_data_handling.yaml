format: daksh-pattern-rule/v1
id: filepaths.core.sensitive_data_handling
title: "Sensitive Data Handling Review"
order: 9
detection:
  pattern: (?i)(sensitive|secret|private_key)
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:(?i)(/|\\\\).*(secret|key|vault|credential|token) && MISSING:(?i)(/docs?/|/examples?/|/samples?/|/tests?/|example|sample|dummy|test|placeholder)
reporting:
  type: area_of_interest
  reason: Detects file paths related to sensitive data handling functionality.
  description: A file or directory name matches the sensitive data handling review area. This check inspects paths,
    not the implementation or a reachable execution path.
  impact: Insufficient memory, diagnostic, or build protections may make private values easier to recover or increase
    the consequences of another defect. Their absence alone does not establish an exploit path. A filename match
    alone does not establish this consequence.
  remediation: Minimize private data lifetimes and diagnostic exposure, apply the platform’s appropriate hardening
    controls, and verify the final binary rather than inferring protection from source markers alone.
  reviewer: Verify the presence and correctness of code paths related to sensitive data handling. This can be confirmed
    as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched file or directory contents and determine whether it is deployed or externally accessible.
  - Identify whether sensitive data, configuration or executable content is present; a name match alone does not
    establish exposure.
  - Check effective access controls and build or packaging exclusions and record the specific content and exposure
    path.
  recommendations:
  - Where exposure is verified, remove unnecessary files from deployment or restrict access to the intended users
    and processes.
  - Verify the deployed artifact and access behavior after the change; retain required application files with appropriate
    controls.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
