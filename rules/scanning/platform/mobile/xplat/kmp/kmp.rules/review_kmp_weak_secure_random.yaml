format: daksh-pattern-rule/v1
id: mobile.xplat.kmp.core.review_kmp_weak_secure_random
title: "Security-Sensitive Randomness Review"
order: 7
category: CRYPTO Review
detection:
  pattern: \bRandom\s*\.\s*(?:nextBytes|nextInt|nextLong)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: General-purpose Random generates a value assigned to a security-named variable. Verify whether the
    value is a token, key, nonce or other security material; non-security randomized behavior is outside this check.
  impact: Weak or predictable protection can expose sensitive values or allow unauthorized modification when used
    at a security boundary.
  remediation: Use supported authenticated cryptography, securely generated keys and nonces, and platform-backed
    key storage; replace hardcoded or constant key material.
  reviewer: Distinguish checksums from authentication, asymmetric RSA transformations from symmetric ECB, and test
    IV/nonce reuse, fixed keys and algorithm migration.
  review_steps:
  - Resolve the exact instance, declaration, value and release configuration.
  - Distinguish checksums from authentication, asymmetric RSA transformations from symmetric ECB, and test IV/nonce
    reuse, fixed keys and algorithm migration.
  - Confirm reachability and security impact before confirming an issue.
  recommendations:
  - Use supported authenticated cryptography, securely generated keys and nonces, and platform-backed key storage;
    replace hardcoded or constant key material.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
