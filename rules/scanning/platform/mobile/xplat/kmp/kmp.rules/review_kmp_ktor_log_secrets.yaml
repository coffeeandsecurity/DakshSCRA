format: daksh-pattern-rule/v1
id: mobile.xplat.kmp.core.review_kmp_ktor_log_secrets
title: "HTTP Body Logging Review"
order: 5
category: PRIVACY Review
detection:
  pattern: \blevel\s*=\s*LogLevel\.(?:ALL|BODY)\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: Diagnostic output or execution tracing includes values that may contain credentials, tokens, or private
    user data. Resolve the particular connection, host and client configuration selected by the shipped build.
  impact: Sensitive values written to logs may be recovered by log readers, telemetry operators, or other parties
    with access to collected diagnostics, enabling account misuse or disclosure of private data.
  remediation: Remove or redact sensitive values before logging. Disable verbose payload and shell tracing in production,
    restrict log access, and rotate active credentials that have already been exposed. Use platform trust and hostname
    validation and encrypted transport. Remove permissive callbacks and narrow necessary exceptions to the intended
    hosts.
  reviewer: Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted
    client or HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or
    HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Remove or redact sensitive values before logging. Disable verbose payload and shell tracing in production, restrict
    log access, and rotate active credentials that have already been exposed. Use platform trust and hostname validation
    and encrypted transport. Remove permissive callbacks and narrow necessary exceptions to the intended hosts.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
