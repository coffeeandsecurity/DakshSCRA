format: daksh-pattern-rule/v1
id: mobile.ios.framework.swiftui.review_ios_swiftui_appstorage_secret
title: "Preferences Data Storage Review"
order: 8
category: STORAGE Review
detection:
  pattern: (?i)@AppStorage\s*\(\s*"(?:password|token|secret|api[_-]?key|credential)"
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The application stores a potentially sensitive value in general-purpose preferences, saved state,
    or other storage not designed as a credential vault. Identify the value written, backing store and access class,
    including backup, restore, reinstall and logout behavior.
  impact: A party who can access saved state, backups, or application storage may recover the sensitive value and
    use exposed credentials or private data outside the intended security boundary.
  remediation: Store credentials and cryptographic secrets in the platform’s secure credential or key store. Keep
    them out of preferences and saved-state snapshots, and minimize retained values and backup exposure. Keep privileged
    secrets on the server, use appropriate device-backed secure storage for local credentials, and restrict backup
    and sharing to intended non-sensitive data.
  reviewer: Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after
    reinstall, and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store
    as protection.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall,
    and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Store credentials and cryptographic secrets in the platform’s secure credential or key store. Keep them out
    of preferences and saved-state snapshots, and minimize retained values and backup exposure. Keep privileged
    secrets on the server, use appropriate device-backed secure storage for local credentials, and restrict backup
    and sharing to intended non-sensitive data.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
