format: daksh-pattern-rule/v1
id: powershell.core.invoke_expression_with_variable_input
title: "Dynamic Code Evaluation Review"
order: 1
category: Injection
detection:
  pattern: Invoke-Expression\s+["']?.*\$\w|iex\s+["']?.*\$\w
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:Validate|Sanitize|allowlist|\[ValidateSet\]|\[ValidatePattern\]
reporting:
  type: area_of_interest
  reason: Detects Invoke-Expression (iex) calls that include variable interpolation.
  trace:
  - Externalized rule logic for Invoke-Expression with Variable Input.
  description: The code invokes an interpreter, process, dynamic expression, or template-execution mechanism. Trace
    executable selection and evaluated content to their trust boundaries.
  impact: If an attacker controls interpreted syntax or the operation selected, code or commands may run with the
    application’s privileges, allowing data theft, state changes, or service disruption.
  remediation: Replace externally influenced evaluation with fixed operations and data-only inputs. Use separate
    argument arrays for processes, allowlist permitted operations, and keep untrusted text out of executable templates
    or expressions.
  reviewer: Trace the origin of the string passed to Invoke-Expression and confirm no attacker-controlled path reaches
    it. This can be confirmed as an issue when the matched path is reachable and required controls are missing,
    weak, or inconsistent.
  review_steps:
  - Determine whether the matched operation interprets code, expressions or templates; identify its execution context
    and permissions.
  - Trace control over the executed text and distinguish fixed application code from externally influenced content.
  - Inspect restrictions and failure paths; record a reachable input-to-execution path before confirming code execution.
  recommendations:
  - Replace externally assembled code with fixed operations and data-only inputs where possible.
  - Keep template or expression sources under application control; restrict exposed capabilities and test rejection
    of unexpected syntax.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
