format: daksh-pattern-rule/v1
id: terraform.core.rdp_port_open_to_all_internet
title: "Public RDP Access Review"
order: 5
category: Network Security
detection:
  pattern: from_port\s*=\s*3389[^\d][^}]*cidr_blocks\s*=\s*\["0\.0\.0\.0/0"\]|cidr_blocks\s*=\s*\["0\.0\.0\.0/0"\][^}]*from_port\s*=\s*3389[^\d]
  conditions:
  - WHEN PRESENT from_port\s*=\s*3389[^\d][^}]*cidr_blocks\s*=\s*\["0\.0\.0\.0/0"\]
  - WHEN EXPR PRESENT:from_port\s*=\s*3389|to_port\s*=\s*3389 && PRESENT:cidr_blocks.*0\.0\.0\.0/0|cidr_ipv6.*::/0
    && MISSING:# intentional|# bastion
reporting:
  type: area_of_interest
  reason: Detects security group rules allowing RDP (port 3389) ingress from all IP addresses.
  trace:
  - Externalized rule logic for RDP Port Open to All Internet.
  description: The deployment declares a public address, exposed ports, or broad inbound access. Resolve effective
    routes, firewall rules, listening services, and authentication.
  impact: If a sensitive service is reachable from an untrusted network, remote actors may attempt credential attacks
    or exploit reachable service defects. A public address or image EXPOSE declaration alone does not establish
    internet reachability.
  remediation: Restrict inbound access to required services and trusted networks. Keep management and database endpoints
    private where possible, and verify actual listening ports, firewall rules, and access controls.
  reviewer: RDP open to 0.0.0.0/0 is a critical finding. Confirm no public RDP exposure exists in production. This
    can be confirmed as an issue when the matched path is reachable and required controls are missing, weak, or
    inconsistent.
  review_steps:
  - Resolve actual listeners, routes, firewall rules and reachable deployment interfaces.
  - Inspect authentication and authorization on the exposed service and identify the data or operations it makes
    available.
  - Test reachability from the relevant network boundary; an exposed-port declaration alone does not establish a
    vulnerability.
  recommendations:
  - Expose only required services to the intended networks and restrict administrative interfaces.
  - Verify the effective network policy and application access controls after deployment, including denied access
    from untrusted networks.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
