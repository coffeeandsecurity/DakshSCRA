format: daksh-pattern-rule/v1
id: mobile.ios.framework.alamofire.servertrustevaluating_disabled_with_disabledtrustevaluator
title: "TLS Certificate Validation Review"
order: 1
category: Framework-Specific Issues - Alamofire (iOS)
detection:
  pattern: DisabledTrustEvaluator\s*\(\s*\)|DisabledEvaluation|trustAllCertificates|serverTrustManager\s*=\s*nil
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects Alamofire configurations that disable TLS server trust evaluation.
  trace:
  - Externalized mobile rule logic for ServerTrustEvaluating Disabled with DisabledTrustEvaluator.
  description: 'Review target: ServerTrustEvaluating Disabled with DisabledTrustEvaluator. The code invokes an interpreter,
    process, dynamic expression, or template-execution mechanism. Trace executable selection and evaluated content
    to their trust boundaries. Resolve the particular connection, host and client configuration selected by the
    shipped build.'
  impact: If an attacker controls interpreted syntax or the operation selected, code or commands may run with the
    application’s privileges, allowing data theft, state changes, or service disruption.
  remediation: Replace externally influenced evaluation with fixed operations and data-only inputs. Use separate
    argument arrays for processes, allowlist permitted operations, and keep untrusted text out of executable templates
    or expressions. Use platform trust and hostname validation and encrypted transport. Remove permissive callbacks
    and narrow necessary exceptions to the intended hosts.
  reviewer: DisabledTrustEvaluator is a critical finding. Confirm removal from all production configurations. This
    can be confirmed as an issue when the matched path is reachable and required controls are missing, weak, or
    inconsistent. Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted
    client or HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  review_steps:
  - Determine whether the matched operation interprets code, expressions or templates; identify its execution context
    and permissions.
  - Trace control over the executed text and distinguish fixed application code from externally influenced content.
  - Inspect restrictions and failure paths; record a reachable input-to-execution path before confirming code execution.
  - Resolve the particular connection, host and client configuration selected by the shipped build.
  - Test invalid chains, wrong hostnames, redirects and build-specific exceptions; an unrelated trusted client or
    HTTPS URL does not protect this connection. Missing pinning alone is not proof of insecurity.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Replace externally assembled code with fixed operations and data-only inputs where possible.
  - Keep template or expression sources under application control; restrict exposed capabilities and test rejection
    of unexpected syntax.
  - Use platform trust and hostname validation and encrypted transport. Remove permissive callbacks and narrow necessary
    exceptions to the intended hosts.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
