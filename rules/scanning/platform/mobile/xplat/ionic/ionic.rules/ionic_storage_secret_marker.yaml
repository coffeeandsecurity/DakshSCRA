format: daksh-pattern-rule/v1
id: mobile.xplat.ionic.core.ionic_storage_secret_marker
title: "Local Secret Storage Review"
order: 8
category: Framework-Specific Security
detection:
  pattern: (localStorage|sessionStorage)\.(setItem|set)\((?:[^\n]*|[^;{}]*?)(token|secret|password|apikey)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects potentially sensitive values stored in web storage.
  trace:
  - Externalized mobile rule logic for Ionic Storage Secret Marker.
  description: 'Review target: Ionic Storage Secret Marker. The application stores sensitive values or configures
    protection for persistent data. Determine the actual storage location, backup policy, and lock-state access
    restrictions. Identify the value written, backing store and access class, including backup, restore, reinstall
    and logout behavior.'
  impact: An actor with access to unprotected application files, backups, or overly broad keychain access may recover
    credentials or private records and use them outside the intended trust boundary.
  remediation: Use the platform credential or key store for secrets and appropriate authenticated encryption and
    file protection for private records. Minimize stored data, backup exposure, and lock-state accessibility. Keep
    privileged secrets on the server, use appropriate device-backed secure storage for local credentials, and restrict
    backup and sharing to intended non-sensitive data.
  reviewer: Review client storage keys and data sensitivity. This can be confirmed as an issue when the matched
    path is reachable and required controls are missing, weak, or inconsistent. Test device lock state, cloud backup
    versus device transfer, restored keys, keychain persistence after reinstall, and secure-storage failure; do
    not silently fall back to plaintext or treat an unrelated secure store as protection.
  review_steps:
  - Determine whether the matched value is a real credential, key or token rather than a placeholder, public identifier
    or test fixture.
  - Inspect how it is used and where it is exposed, including source history, build artifacts, logs and deployment
    configuration.
  - Record the affected service and privileges without copying secret values into the review report.
  - Identify the value written, backing store and access class, including backup, restore, reinstall and logout
    behavior.
  - Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall,
    and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Keep real secrets out of source and public artifacts; obtain them through the deployment secret mechanism with
    restricted access.
  - If a credential has been exposed, revoke or rotate it and verify that old values no longer work; remove accidental
    logging and add a regression check.
  - Keep privileged secrets on the server, use appropriate device-backed secure storage for local credentials, and
    restrict backup and sharing to intended non-sensitive data.
scan_config:
  match_mode: file
  context_lines_before: '2'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: red
