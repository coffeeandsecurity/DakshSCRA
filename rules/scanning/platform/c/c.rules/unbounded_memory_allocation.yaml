format: daksh-pattern-rule/v1
id: c.core.unbounded_memory_allocation
title: Unbounded Memory Allocation
order: 3
category: Untrusted Input Handling and Buffer Overflow
detection:
  pattern: \bmalloc\s*\(\s*[^\)]*user_input
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:sizeof\s*\(|MAX_SIZE|MAX_LEN|limit|bounds|check
reporting:
  type: area_of_interest
  reason: Detects memory allocation functions (`malloc()`, `calloc()`) where size is influenced by user input without
    validation.
  trace:
  - Externalized rule logic for Unbounded Memory Allocation.
  description: The code manages allocation, ownership, indexed access, or resource release. Confirm capacity, lifetime,
    nullability, and transfer of ownership across callers.
  impact: An invalid lifetime or out-of-range access may corrupt memory, disclose process data, or crash the application.
    Unbounded or unreleased resources may exhaust memory and deny service under repeated use.
  remediation: Enforce bounds and lifetime invariants, handle allocation failure, and use appropriate automatic
    resource ownership. Confirm a leak or invalid access before adding cleanup that could introduce double release.
  reviewer: Ensure that memory allocations based on user input are properly constrained. This can be confirmed as
    an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Identify who can supply the matched input, including stored values and upstream services; record its type, size
    limits and trust boundary.
  - Trace the value through transformations to each sensitive operation. Check the protection at that destination
    and resource-level authorization.
  - Inspect the actual validation or protection implementation and its error path. A nearby keyword or a client-side
    check alone is insufficient evidence.
  recommendations:
  - Use server-side type, length and allowed-value checks appropriate to the input. For free-form text, preserve
    legitimate characters and protect each destination separately.
  - Bind database values as parameters, encode output for its rendering context, and constrain file or network destinations
    where applicable. Test rejected input and unauthorized access.
scan_config:
  match_mode: line
  context_lines_before: '2'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: yellow
