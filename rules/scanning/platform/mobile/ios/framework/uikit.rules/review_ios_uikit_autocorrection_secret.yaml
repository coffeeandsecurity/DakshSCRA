format: daksh-pattern-rule/v1
id: mobile.ios.framework.uikit.review_ios_uikit_autocorrection_secret
title: "Sensitive Input Prediction Review"
order: 9
category: PRIVACY Review
detection:
  pattern: (?i)\b(?:password|passwd|pin|secret|token)\w*\s*\.\s*autocorrectionType\s*=\s*(?:\.yes|UITextAutocorrectionTypeYes)\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A potentially sensitive input explicitly enables autocorrection. Check secure-entry settings on the
    same field, since secure entry disables autocorrection and spelling behavior. Identify the actual sensitive
    value and the recipients, retention and user-consent context of this exposure or capability.
  impact: If secure entry is ineffective and the keyboard retains this input, secret text may enter keyboard learning
    or suggestion data and be exposed outside the intended field.
  remediation: Use secure entry for credentials and disable autocorrection and spell checking for other sensitive
    fields. Validate the effective settings and third-party keyboard behavior on a device. Minimize collection and
    retention, redact secret values, and apply the platform controls needed for sensitive UI and data sharing.
  reviewer: Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime;
    permission or API capability alone does not establish collection or malicious behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime; permission
    or API capability alone does not establish collection or malicious behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Use secure entry for credentials and disable autocorrection and spell checking for other sensitive fields. Validate
    the effective settings and third-party keyboard behavior on a device. Minimize collection and retention, redact
    secret values, and apply the platform controls needed for sensitive UI and data sharing.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
