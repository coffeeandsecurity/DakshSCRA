format: daksh-pattern-rule/v1
id: terraform.framework.aws.ec2_instance_metadata_service_v1_enabled
title: "Instance Metadata Service Review"
order: 1
category: AWS Compute Security
detection:
  pattern: resource\s+"aws_instance"[^}]*http_tokens\s*=\s*"optional"
  conditions:
  - WHEN PRESENT resource\s+"aws_instance"
  - WHEN EXPR MISSING:http_tokens\s*=\s*"required"
reporting:
  type: area_of_interest
  reason: Detects EC2 instances that allow IMDSv1 (unauthenticated metadata service access).
  trace:
  - Externalized rule logic for EC2 Instance Metadata Service v1 Enabled.
  description: The instance permits sessionless metadata requests through the legacy metadata protocol.
  impact: A reachable server-side request forgery or local process may obtain instance metadata and role credentials
    without the additional session-token requirement.
  remediation: Require token-based metadata access, restrict metadata reachability to required processes, and scope
    instance-role permissions to the workload’s needs.
  reviewer: Confirm http_tokens is set to "required" on all EC2 instances. This can be confirmed as an issue when
    the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched construct in its containing function or configuration and identify the security-sensitive
    behavior under review.
  - Verify reachable callers, external influence and effective protections, including deployment overrides and failure
    paths.
  - Record concrete evidence for a confirmed issue or a justified suppression; retain an unresolved outcome when
    the required evidence is unavailable.
  recommendations:
  - Apply the rule-specific correction above only after verifying the affected behavior and required control.
  - Add a regression case for the unsafe condition and a valid protected case; verify the effective behavior in
    the relevant deployment.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
