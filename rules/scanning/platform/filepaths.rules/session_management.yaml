format: daksh-pattern-rule/v1
id: filepaths.core.session_management
title: Session Management
order: 3
detection:
  pattern: (?i)(session|cookie|token)
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:(?i)(/|\\\\).*(session|cookie|token) && MISSING:(?i)(/docs?/|/examples?/|/samples?/|/tests?/|example|sample|dummy|test|placeholder)
reporting:
  type: area_of_interest
  reason: Detects file paths related to session management functionality.
  description: A file or directory name matches the session management review area. This check inspects paths, not
    the implementation or a reachable execution path.
  impact: Weak session secrets, exposed cookies, or inadequate expiry may allow session theft, token forgery, or
    continued access after the user’s intended authorization ends. A filename match alone does not establish this
    consequence.
  remediation: Use strong unpredictable session secrets, rotate tokens on privilege changes, and enforce expiry
    and revocation. Set Secure, HttpOnly, and appropriate SameSite attributes for sensitive browser cookies.
  reviewer: Verify the presence and correctness of session management-related code. This can be confirmed as an
    issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched file or directory contents and determine whether it is deployed or externally accessible.
  - Identify whether sensitive data, configuration or executable content is present; a name match alone does not
    establish exposure.
  - Check effective access controls and build or packaging exclusions and record the specific content and exposure
    path.
  recommendations:
  - Where exposure is verified, remove unnecessary files from deployment or restrict access to the intended users
    and processes.
  - Verify the deployed artifact and access behavior after the change; retain required application files with appropriate
    controls.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
