format: daksh-pattern-rule/v1
id: powershell.core.start_process_or_cmd_exe_with_variable_arguments
title: "Process Execution Review"
order: 2
category: Injection
detection:
  pattern: (?:Start-Process|&\s+cmd(?:\.exe)?|Invoke-Command)\s+[^`\n]*\$(?:args|input|params|\w+URL|\w+Path|\w+Cmd)
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:EscapeShellArgument|Sanitize|\[ValidatePattern\]
reporting:
  type: area_of_interest
  reason: Detects process invocation with variable arguments that may contain unsanitized input.
  trace:
  - Externalized rule logic for Start-Process or cmd.exe with Variable Arguments.
  description: The code invokes a process or shell execution API. Trace the executable, arguments, shell use, and
    source of externally supplied values.
  impact: If attacker-controlled data changes command syntax or executable selection, an attacker may execute commands
    with application privileges, read or modify files, or disrupt service.
  remediation: Use a fixed executable with a separate argument array and avoid a shell where possible. Validate
    arguments for the selected program and allowlist permitted operations.
  reviewer: Verify argument sources and confirm no user-supplied data reaches process invocations unescaped. This
    can be confirmed as an issue when the matched path is reachable and required controls are missing, weak, or
    inconsistent.
  review_steps:
  - Identify the executable, arguments, shell use and working directory; trace external influence over each.
  - Check whether a shell interprets metacharacters or whether options can change command behavior even without
    a shell.
  - Verify the operation is reachable and examine validation, executable selection and process privileges before
    confirming an issue.
  recommendations:
  - Prefer a library API or a fixed executable with a separate argument array; avoid passing external text to a
    shell.
  - Restrict permitted operations and arguments, constrain option handling, and test rejected input under the actual
    deployment privileges.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
