format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_biometric_enrollment_invalidation_disabled
title: "Biometric Key Invalidation Review"
order: 83
category: AUTH Review
detection:
  pattern: \b(?:setInvalidatedByBiometricEnrollment\s*\(\s*false\s*\)|invalidatedByBiometricEnrollment\s*=\s*false\b)
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: A key policy explicitly disables invalidation after biometric enrollment changes. Verify biometric-only
    key authentication, credential fallback, key lifetime and applicable platform behavior. Trace the actual authorization
    decision, credential binding and failure path rather than accepting a local success marker.
  impact: A person able to enroll a new biometric may gain access to an existing protected key if the key’s effective
    policy accepts the new enrollment. This risk depends on authentication configuration.
  remediation: Invalidate biometric-bound keys when enrollment changes where the threat model requires it. Verify
    the effective key policy and use authenticated cryptographic operations for sensitive actions. Enforce authorization
    on the trusted server and bind local authentication to protected keys or credentials where required; use external-browser
    authorization and proof-key protection for public native clients.
  reviewer: Test cancellation, device-credential fallback, enrollment changes, stale reuse windows, redirect interception
    and unavailable secure storage; local biometrics do not replace server authorization.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test cancellation, device-credential fallback, enrollment changes, stale reuse windows, redirect interception
    and unavailable secure storage; local biometrics do not replace server authorization.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Invalidate biometric-bound keys when enrollment changes where the threat model requires it. Verify the effective
    key policy and use authenticated cryptographic operations for sensitive actions. Enforce authorization on the
    trusted server and bind local authentication to protected keys or credentials where required; use external-browser
    authorization and proof-key protection for public native clients.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
