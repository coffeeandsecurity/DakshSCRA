format: daksh-pattern-rule/v1
id: mobile.android.core.android_keystore_key_without_user_authentication_binding
title: "Keystore Authentication Binding Review"
order: 29
category: Cryptographic Failures
detection:
  pattern: KeyGenParameterSpec\.Builder\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects Android KeyStore key generation that does not require user authentication before the key is usable.
  trace:
  - Externalized mobile rule logic for Android KeyStore Key Without User Authentication Binding.
  description: 'Review target: Android KeyStore Key Without User Authentication Binding. The checked code implements
    an identity, access-control, or abuse-prevention decision. Determine the trusted verifier, protected resources,
    and whether the control is enforced on every relevant path. Determine whether the operation protects secrets,
    authenticates data or serves a non-security purpose; resolve algorithm, mode and key provenance.'
  impact: If identity or resource authorization can be bypassed, an attacker may impersonate a user, access another
    user’s data, or perform restricted operations. A control’s presence alone does not establish a weakness.
  remediation: Enforce authentication and object-level authorization on the trusted server or privileged boundary.
    Use strong verifier material, appropriate rate limits and recovery controls, and test access by unauthenticated
    and insufficiently privileged callers. Use supported authenticated cryptography, securely generated keys and
    nonces, and platform-backed key storage; replace hardcoded or constant key material.
  reviewer: Confirm that KeyGenParameterSpec.Builder chains include setUserAuthenticationRequired(true) for keys
    that protect sensitive data. This can be confirmed as an issue when the matched path is reachable and required
    controls are missing, weak, or inconsistent. Distinguish checksums from authentication, asymmetric RSA transformations
    from symmetric ECB, and test IV/nonce reuse, fixed keys and algorithm migration.
  review_steps:
  - Identify the trusted identity verifier, protected resources and decision made by the matched control.
  - Inspect effective middleware and service checks, alternate routes and failure paths; validate the supplied evidence
    before issuing privileges.
  - Test invalid identity evidence, insufficient permissions and access to another user or tenant before confirming
    a bypass.
  - Determine whether the operation protects secrets, authenticates data or serves a non-security purpose; resolve
    algorithm, mode and key provenance.
  - Distinguish checksums from authentication, asymmetric RSA transformations from symmetric ECB, and test IV/nonce
    reuse, fixed keys and algorithm migration.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Use a trusted verifier and enforce the applicable server-side identity and resource checks consistently.
  - Fail closed on invalid evidence and test that alternate routes and error paths cannot issue unintended access.
  - Use supported authenticated cryptography, securely generated keys and nonces, and platform-backed key storage;
    replace hardcoded or constant key material.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '2'
  context_lines_after: '10'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: yellow
