format: daksh-pattern-rule/v1
id: ruby.core.potential_sql_injection_via_string_interpolation
title: "SQL Injection Review"
order: 2
category: Injection and Untrusted Input Handling
detection:
  pattern: \b(?:where|find_by_sql|execute|order|joins)\s*\(\s*["'][^"']*#\{
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:where\s*\(\s*"[^"]*\?|sanitize_sql_for_conditions|Arel
reporting:
  type: area_of_interest
  reason: Detects SQL query construction using string interpolation in ActiveRecord or raw SQL calls.
  trace:
  - Externalized rule logic for Potential SQL Injection via String Interpolation.
  description: The checked source contains a database query or query-construction operation. Determine whether untrusted
    values can change statement structure and whether record access is authorized.
  impact: If externally controlled values enter query syntax, an attacker may read, change, or delete records or
    bypass data-access restrictions with the database connection’s privileges. Fixed queries and correctly bound
    parameters do not establish this condition.
  remediation: Bind data values as parameters, choose dynamic identifiers from a fixed allowlist, and enforce object-level
    access checks. Trace the complete query construction before replacing a safe query.
  reviewer: Check all dynamic query fragments for parameterization and robust input validation. This can be confirmed
    as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Identify who can supply the matched input, including stored values and upstream services; record its type, size
    limits and trust boundary.
  - Trace the value through transformations to each sensitive operation. Check the protection at that destination
    and resource-level authorization.
  - Inspect the actual validation or protection implementation and its error path. A nearby keyword or a client-side
    check alone is insufficient evidence.
  recommendations:
  - Use server-side type, length and allowed-value checks appropriate to the input. For free-form text, preserve
    legitimate characters and protect each destination separately.
  - Bind database values as parameters, encode output for its rendering context, and constrain file or network destinations
    where applicable. Test rejected input and unauthorized access.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
