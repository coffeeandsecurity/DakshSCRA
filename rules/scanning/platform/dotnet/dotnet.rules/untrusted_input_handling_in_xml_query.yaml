format: daksh-pattern-rule/v1
id: dotnet.core.untrusted_input_handling_in_xml_query
title: "XML Query Input Handling Review"
order: 5
category: Untrusted Input/Output Handling
detection:
  pattern: (?i)(XmlDocument\.Load|XmlDocument\.LoadXml|XmlTextReader\.Create|XmlReader\.Create|XmlSerializer\.Deserialize|XDocument\.Load|XDocument\.Parse|XElement\.Load|XElement\.Parse|XPathDocument\.Create|XPathDocument\.Load|XPathDocument\.LoadXml|XPathNavigator\.Create|XPathNavigator\.Load|XPathNavigator\.LoadXml|XslCompiledTransform\.Load|XslCompiledTransform\.LoadXml|XslTransform\.Load|XslTransform\.LoadXml|XmlSchema\.Read|XmlSchemaSet\.Add|XmlSchemaSet\.Read)
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:(DtdProcessing\s*=\s*Prohibit|XmlResolver\s*=\s*null|MaxCharactersFromEntities|ProhibitDtd\s*=\s*true)
reporting:
  type: area_of_interest
  reason: Detects the usage of XML processing methods in .NET that can introduce XML External Entity (XXE) vulnerabilities.
  trace:
  - Externalized rule logic for Untrusted Input Handling in XML Query.
  description: The code parses or transforms XML. Resolve external entity, DTD, and resource-loading settings for
    the actual parser instance.
  impact: If external resources or entity expansion are permitted for untrusted XML, an attacker may read local
    files, make requests to internal services, or exhaust parser resources.
  remediation: Disable external entities and DTD loading for untrusted XML, use a restrictive resolver, and enforce
    input-size and expansion limits on the effective parser.
  reviewer: Ensure that proper input validation and sanitization techniques are implemented for XML processing methods
    in. NET. Verify that developers have taken appropriate measures to prevent XXE vulnerabilities, such as disabling
    external entity resolution or using secure XML parsers. Also assess the sensitivity of the XML data processed
    and confirm that relevant security controls are in place. This can be confirmed as an issue when the matched
    path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Identify who can supply the matched input, including stored values and upstream services; record its type, size
    limits and trust boundary.
  - Trace the value through transformations to each sensitive operation. Check the protection at that destination
    and resource-level authorization.
  - Inspect the actual validation or protection implementation and its error path. A nearby keyword or a client-side
    check alone is insufficient evidence.
  recommendations:
  - Use server-side type, length and allowed-value checks appropriate to the input. For free-form text, preserve
    legitimate characters and protect each destination separately.
  - Bind database values as parameters, encode output for its rendering context, and constrain file or network destinations
    where applicable. Test rejected input and unauthorized access.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
