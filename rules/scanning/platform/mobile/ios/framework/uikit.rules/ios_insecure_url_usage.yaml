format: daksh-pattern-rule/v1
id: mobile.ios.framework.uikit.ios_insecure_url_usage
title: Cleartext HTTP Communication Review
order: 7
category: Framework-Specific Security
detection:
  pattern: http://
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects plain HTTP endpoint usage in iOS code/config.
  trace:
  - Externalized mobile rule logic for iOS Insecure URL Usage.
  description: 'Review target: iOS Insecure URL Usage. The code declares an entry point, model, destination, or
    configuration value that may cross a trust boundary. Identify callers, recipients, and the required data-access
    policy. Resolve the external entry point, its caller or URI grant, and the sensitive operation or resource reached.'
  impact: A boundary that trusts unauthorized callers or exposes private output may permit data disclosure or state
    changes. A declaration, address, or architectural marker alone does not establish such a failure.
  remediation: Trace the actual boundary, restrict accepted inputs and recipients, and enforce authentication and
    object-level authorization where required. Verify both authorized and denied use cases.
  reviewer: Audit API endpoint definitions and networking calls. This can be confirmed as an issue when the matched
    path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched construct in its containing function or configuration and identify the security-sensitive
    behavior under review.
  - Verify reachable callers, external influence and effective protections, including deployment overrides and failure
    paths.
  - Record concrete evidence for a confirmed issue or a justified suppression; retain an unresolved outcome when
    the required evidence is unavailable.
  - Resolve the external entry point, its caller or URI grant, and the sensitive operation or resource reached.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Apply the rule-specific correction above only after verifying the affected behavior and required control.
  - Add a regression case for the unsafe condition and a valid protected case; verify the effective behavior in
    the relevant deployment.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '2'
  context_lines_after: '0'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: yellow
