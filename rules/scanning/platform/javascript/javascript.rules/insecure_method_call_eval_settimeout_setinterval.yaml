format: daksh-pattern-rule/v1
id: javascript.core.insecure_method_call_eval_settimeout_setinterval
title: "Dynamic Code Evaluation Review"
order: 6
category: Insecure Method/Function Call
detection:
  pattern: \b(?:eval|setTimeout|setInterval)\s*\([^\n]+
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects the usage of the `eval`, `setTimeout`, and `setInterval` functions.
  trace:
  - 'Externalized rule logic for Insecure Method Call: eval|setTimeout|setInterval.'
  description: The code calls eval or a timer API. eval interprets code; setTimeout and setInterval evaluate code only when
    the callback argument is a string.
  impact: If an attacker controls interpreted syntax or the operation selected, code or commands may run with the application’s
    privileges, allowing data theft, state changes, or service disruption.
  remediation: Replace dynamic evaluation with fixed operations and data-only parsing. Pass function callbacks to setTimeout
    and setInterval and keep external values out of executable strings.
  reviewer: Inspect the actual argument type. A function callback passed to a timer is not string evaluation. For eval or
    a string callback, trace who controls the executed text and verify the reachable browser or server context.
  review_steps:
  - Distinguish eval from timer calls.
  - Determine whether a timer callback is a function or a string.
  - Trace control over interpreted text and the privileges of execution.
  recommendations:
  - Use function callbacks for timers.
  - Use JSON.parse for JSON data and fixed dispatch tables for permitted operations.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
