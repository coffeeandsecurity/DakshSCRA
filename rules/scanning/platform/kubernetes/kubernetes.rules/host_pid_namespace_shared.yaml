format: daksh-pattern-rule/v1
id: kubernetes.core.host_pid_namespace_shared
title: Host PID Namespace Shared
order: 5
category: Host Namespace Sharing
detection:
  pattern: hostPID\s*:\s*true
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:hostPID:\s*true && MISSING:# intentional|# required
reporting:
  type: area_of_interest
  reason: Detects pods configured to share the host's PID namespace.
  trace:
  - Externalized rule logic for Host PID Namespace Shared.
  description: The workload shares the host process namespace.
  impact: A compromised container may observe host process information and, when additional permissions permit it,
    signal or interfere with host processes, expanding the impact beyond normal container isolation.
  remediation: Disable host PID sharing unless a documented operational requirement needs it. Minimize process capabilities
    and restrict the workload to an appropriately isolated node.
  reviewer: Confirm hostPID usage is justified by a node-level operational requirement. This can be confirmed as
    an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Resolve the effective privileges, filesystem modes or identity grants, including inherited and deployment-level
    permissions.
  - Determine which operations are required and whether an untrusted actor can exercise the excess access.
  - Record the affected resource and effective policy; distinguish a declared capability from an exploitable authorization
    gap.
  recommendations:
  - Limit access and privileges to the operations and resources the application requires; remove unnecessary broad
    grants.
  - Test permitted operations and denied access with the actual deployment identity and effective policy.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
