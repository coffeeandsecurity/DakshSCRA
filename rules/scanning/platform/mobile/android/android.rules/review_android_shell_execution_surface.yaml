format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_shell_execution_surface
title: "Process Execution Review"
order: 59
category: CODE Review
detection:
  pattern: \b(?:Runtime\s*\.\s*getRuntime\s*\(\s*\)\s*\.\s*exec|(?:new\s+)?ProcessBuilder)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The checked code invokes a command or shell execution API. Trace command construction and argument
    values to determine whether external input can influence execution. Resolve the exact declaration or operation
    in the selected build and identify its security boundary.
  impact: If an attacker can alter executable selection or shell syntax, commands may run with the application’s
    privileges, exposing data, modifying files, or disrupting service.
  remediation: Use a fixed executable and a separate argument array without a shell. Allowlist permitted operations
    and validate each argument according to the invoked program’s semantics. Apply the least-privilege platform
    control appropriate to the matched operation and verify the production configuration.
  reviewer: Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths;
    source evidence alone does not establish shipped or runtime behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Check debug/release and product flavors, generated/native code, plugin boundaries and failure paths; source
    evidence alone does not establish shipped or runtime behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Use a fixed executable and a separate argument array without a shell. Allowlist permitted operations and validate
    each argument according to the invoked program’s semantics. Apply the least-privilege platform control appropriate
    to the matched operation and verify the production configuration.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
