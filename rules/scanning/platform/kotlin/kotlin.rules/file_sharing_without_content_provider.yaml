format: daksh-pattern-rule/v1
id: kotlin.core.file_sharing_without_content_provider
title: "File Sharing Provider Review"
order: 14
category: Internal Storage - Insecure File Permissions
detection:
  pattern: Intent\s*\(\s*(?:[^,]*,\s*)?Uri\.parse\s*\(\s*"(?!(?:https?|smsto|sms|tel|mailto|about|geo|market):)
  conditions:
  - WHEN PRESENT Intent\s*\(\s*(?:[^,]*,\s*)?Uri\.parse
  - WHEN EXPR MISSING:Uri\.parse\s*\(\s*"(?:https?:|smsto:|sms:|tel:|mailto:|about:|geo:|market:|content:)
reporting:
  type: area_of_interest
  reason: Detects file sharing via raw file-path URIs without going through a ContentProvider/FileProvider.
  trace:
  - Externalized rule logic for File Sharing Without Content Provider.
  description: The application exposes or invokes an inter-process interface. Resolve export settings, permissions,
    intent recipients, URI grants, and runtime caller checks.
  impact: An untrusted application may read private data, alter state, or invoke operations under the application’s
    identity if an externally reachable interface lacks effective caller authorization or permits unsafe mutation.
  remediation: Disable unnecessary export and prefer explicit recipients and immutable PendingIntents. Apply appropriate
    caller permissions and authorization, bind query arguments, and validate every incoming payload.
  reviewer: Confirm that no file:// URIs are passed in Intents for file sharing. Verify FileProvider is configured
    and content:// URIs with grant flags are used instead. This can be confirmed as an issue when the matched path
    is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the effective export status, permission requirements and runtime identity checks on the inter-process
    interface.
  - Trace untrusted callers and received values to sensitive actions, including indirect recipients and granted
    resource access.
  - Verify unauthorized callers cannot invoke the protected operation; a declared component or intent alone is not
    an issue.
  recommendations:
  - Keep internal components private where possible; enforce caller permissions and resource authorization on exposed
    operations.
  - Constrain recipients and granted access and test calls from an untrusted process or application.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
