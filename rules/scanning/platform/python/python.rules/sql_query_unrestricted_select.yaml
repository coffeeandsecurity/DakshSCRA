format: daksh-pattern-rule/v1
id: python.core.sql_query_unrestricted_select
title: "Database Column Selection Review"
order: 14
category: Database Queries
detection:
  pattern: \bSELECT\s+\*\s+FROM\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: A query projects all columns. Review the fields required and the data returned
    to each caller.
  trace:
  - 'Externalized rule logic for SQL Query: Unrestricted SELECT *.'
  description: SELECT * requests every column from the selected table or result. This
    is a data-exposure and query-maintenance review surface; the projection alone
    does not establish SQL injection.
  impact: If the result is passed to a caller without field filtering or authorization,
    unnecessary private fields may be disclosed. Returning all columns may also increase
    query cost and make results depend on future schema changes.
  remediation: Select the fields needed by the operation and control which fields
    are returned to each role. Bind query values and enforce resource ownership separately.
  reviewer: Inspect the query result and serialization path. LIMIT restricts rows,
    not columns; a LIMIT in this or another query does not remove this review surface.
    Fixed, parameterized SQL does not prove injection.
  review_steps:
  - Locate the final query and determine whether caller-controlled data can alter
    its structure; inspect interpolated fragments and raw-query helpers.
  - Verify that values are bound by the database driver. For identifiers or sort directions
    that cannot be bound, inspect a fixed mapping of allowed choices.
  - Record the reachable caller and effective controls; a constant query or correctly
    bound value does not establish injection.
  recommendations:
  - Select explicit fields appropriate to the operation and minimize externally returned
    records.
  - Bind values and enforce authorization independently of column projection.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
