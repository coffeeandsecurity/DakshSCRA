format: daksh-pattern-rule/v1
id: kotlin.core.sensitive_data_in_logcat_output
title: "Sensitive Data Logging Review"
order: 21
category: Data Leakage
detection:
  pattern: Log\.(?:[deiwtv]|wtf|println)\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:password|token|secret|credential|auth|session|key|pin|ssn|dob|credit|cvv|privateKey|accessToken|refreshToken
reporting:
  type: area_of_interest
  reason: Detects Logcat calls that may write security-sensitive variable data to the Android log.
  trace:
  - Externalized rule logic for Sensitive Data in Logcat Output.
  description: The code writes diagnostic data or exposes detailed errors. Establish the values emitted, production
    configuration, and recipients of the output.
  impact: Readers of exposed diagnostics may obtain credentials, private records, internal paths, or implementation
    details that enable account misuse or targeted attacks.
  remediation: Keep sensitive values and detailed errors out of user-facing responses and routine logs. Redact before
    emission, restrict diagnostic access, and verify production logging configuration.
  reviewer: Search for Log.* calls that reference security-sensitive field names or variables. Verify that sensitive
    values are redacted or omitted in production log output. This can be confirmed as an issue when the matched
    path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Determine whether the matched path logs sensitive data or exposes diagnostics to an untrusted recipient.
  - Trace the actual values, redaction and error handling, including production configuration and log retention
    or access.
  - Distinguish internal operational diagnostics from client-visible output and record the reachable disclosure
    path without reproducing secrets.
  recommendations:
  - Log only the operational details needed, redact sensitive values, and return limited error messages to clients.
  - Restrict diagnostic and log access and test production error responses and representative log output.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
