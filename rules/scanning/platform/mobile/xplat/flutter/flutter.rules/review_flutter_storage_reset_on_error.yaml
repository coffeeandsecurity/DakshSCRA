format: daksh-pattern-rule/v1
id: mobile.xplat.flutter.core.review_flutter_storage_reset_on_error
title: "Secure Storage Recovery Policy Review"
order: 17
category: STORAGE Review
detection:
  pattern: \bAndroidOptions\s*\([^)]{0,240}\bresetOnError\s*:\s*true
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: Storage configuration permits destructive reset when migration or decryption fails. Identify the
    value written, backing store and access class, including backup, restore, reinstall and logout behavior.
  impact: A failure or triggered reset may erase persisted user data or credentials and disrupt service. Actual
    data loss depends on whether the reset path is reachable and whether recovery is available.
  remediation: Use explicit tested migrations and controlled recovery for decryption failures. Preserve recoverable
    data, surface failures to the user, and require deliberate authorization before destructive reset. Keep privileged
    secrets on the server, use appropriate device-backed secure storage for local credentials, and restrict backup
    and sharing to intended non-sensitive data.
  reviewer: Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after
    reinstall, and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store
    as protection.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test device lock state, cloud backup versus device transfer, restored keys, keychain persistence after reinstall,
    and secure-storage failure; do not silently fall back to plaintext or treat an unrelated secure store as protection.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Use explicit tested migrations and controlled recovery for decryption failures. Preserve recoverable data, surface
    failures to the user, and require deliberate authorization before destructive reset. Keep privileged secrets
    on the server, use appropriate device-backed secure storage for local credentials, and restrict backup and sharing
    to intended non-sensitive data.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
