format: daksh-pattern-rule/v1
id: java.framework.hibernate.hibernate_actuator_management_overexposure
title: "Management Endpoint Exposure Review"
order: 1
category: Framework-Specific Security
detection:
  pattern: management\.endpoints\.web\.exposure\.include\s*=\s*\*|/actuator
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR MISSING:management\.endpoint\..*\.enabled\s*=\s*false|spring\.security|@PreAuthorize|hasRole|authentication
reporting:
  type: area_of_interest
  reason: Detects potentially overexposed management endpoints.
  trace:
  - Externalized rule logic for Hibernate Actuator/Management Overexposure.
  description: Management endpoint configuration may expose operational interfaces. Resolve which endpoints are
    enabled, externally reachable, and protected.
  impact: Unauthorized callers may obtain operational details or invoke administrative actions if exposed management
    endpoints lack effective access controls.
  remediation: Expose only required management endpoints on restricted interfaces, apply explicit authentication
    and authorization, and disable unnecessary administrative or diagnostic operations.
  reviewer: Verify actuator/management endpoints are hardened in production. This can be confirmed as an issue when
    the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the effective production configuration and determine who can reach debugging or development functionality.
  - Check environment guards, deployment overrides and the information or capabilities exposed by the feature.
  - Verify the actual production behavior; a development-only setting is not itself a production vulnerability.
  recommendations:
  - Disable development-only functionality in production and enforce the environment boundary in deployment configuration.
  - Restrict operational diagnostics and add a production-configuration check covering the exposed route or feature.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '1'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: yellow
