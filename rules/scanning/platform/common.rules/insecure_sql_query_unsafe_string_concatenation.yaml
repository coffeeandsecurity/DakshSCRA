format: daksh-pattern-rule/v1
id: common.core.insecure_sql_query_unsafe_string_concatenation
title: "SQL Injection Review"
order: 11
category: Dynamic SQL Queries
detection:
  pattern: (?i)SELECT\s+\*?\s+FROM\s+([^\s;]+)\s+WHERE\s+([^\s;]+)\s*=\s*'\s*\+\s*([^;]+)\s*\+\s*'\s*;
  conditions:
  - WHEN PRESENT (?i)\bSELECT\b.*\bFROM\b.*\bWHERE\b.*\+.*\+
  - WHEN EXPR PRESENT:(?i)\b(input|request|param|query|\$_GET|\$_POST|\$_REQUEST)\b
reporting:
  type: area_of_interest
  reason: Detects SQL queries with unsafe string concatenation of user input.
  trace:
  - 'Externalized rule logic for Insecure SQL Query: Unsafe String Concatenation.'
  description: The checked source contains a database query or query-construction operation. Determine whether untrusted
    values can change statement structure and whether record access is authorized.
  impact: If externally controlled values enter query syntax, an attacker may read, change, or delete records or
    bypass data-access restrictions with the database connection’s privileges. Fixed queries and correctly bound
    parameters do not establish this condition.
  remediation: Bind data values as parameters, choose dynamic identifiers from a fixed allowlist, and enforce object-level
    access checks. Trace the complete query construction before replacing a safe query.
  reviewer: Verify that SQL queries use parameterized queries or prepared statements to handle user input securely.
    flag any occurrences of unsafe string concatenation in SQL queries for further review. This can be confirmed
    as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Locate the final query and determine whether caller-controlled data can alter its structure; inspect interpolated
    fragments and raw-query helpers.
  - Verify that values are bound by the database driver. For identifiers or sort directions that cannot be bound,
    inspect a fixed mapping of allowed choices.
  - Record the reachable caller and effective controls; a constant query or correctly bound value does not establish
    injection.
  recommendations:
  - Bind data values with the driver or ORM parameter API; avoid constructing query syntax from external strings.
  - Use fixed mappings for dynamic identifiers and ordering. Test that unusual input remains data and that the database
    account has only required privileges.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
