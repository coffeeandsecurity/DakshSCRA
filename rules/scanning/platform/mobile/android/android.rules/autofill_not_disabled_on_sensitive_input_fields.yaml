format: daksh-pattern-rule/v1
id: mobile.android.core.autofill_not_disabled_on_sensitive_input_fields
title: Sensitive Input Autofill Review
order: 34
category: Data Residue and Lifecycle
detection:
  pattern: '[A-Za-z_][\w.-]*:inputType\s*=\s*["''][^"'']*(?:textPassword|textVisiblePassword|numberPassword)'
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Review password-field classification and intended autofill participation;
    autofill support alone is not a vulnerability.
  trace:
  - Externalized mobile rule logic for Autofill Not Disabled on Sensitive Input Fields.
  description: A password input participates in the platform autofill workflow. Review
    field hints, user-selected providers and intended data sharing. Missing importantForAutofill="no"
    alone is not a security defect.
  impact: Sensitive values may be shared with an authorized autofill provider beyond
    the application process. This can exceed the intended data boundary for certain
    fields; autofill support itself does not establish malicious access.
  remediation: Use appropriate field hints and secure input modes. Exclude only values
    whose threat model requires it, make provider participation deliberate, and avoid
    disrupting legitimate password-manager integration. Minimize collection and retention,
    redact secret values, and apply the platform controls needed for sensitive UI
    and data sharing.
  reviewer: Verify password versus new-password field hints, the selected provider,
    user consent and any field-specific reason to exclude autofill. Do not require
    blanket disabling of password managers or treat a normal password field as a confirmed
    exposure.
  review_steps:
  - Inspect the matched construct in its containing function or configuration and
    identify the security-sensitive behavior under review.
  - Verify reachable callers, external influence and effective protections, including
    deployment overrides and failure paths.
  - Record concrete evidence for a confirmed issue or a justified suppression; retain
    an unresolved outcome when the required evidence is unavailable.
  - Identify the actual sensitive value and the recipients, retention and user-consent
    context of this exposure or capability.
  - Test release logging, crash-report payloads, screenshot/background snapshots and
    clipboard lifetime; permission or API capability alone does not establish collection
    or malicious behavior.
  - Confirm reachability, the selected release build and the effect on a sensitive
    value before confirming an issue.
  recommendations:
  - Apply the rule-specific correction above only after verifying the affected behavior
    and required control.
  - Add a regression case for the unsafe condition and a valid protected case; verify
    the effective behavior in the relevant deployment.
  - Minimize collection and retention, redact secret values, and apply the platform
    controls needed for sensitive UI and data sharing.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '2'
  context_lines_after: '3'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: yellow
