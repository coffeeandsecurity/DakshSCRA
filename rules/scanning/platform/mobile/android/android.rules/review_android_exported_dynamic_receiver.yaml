format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_exported_dynamic_receiver
title: Runtime Broadcast Receiver Exported
order: 48
category: PLATFORM Review
detection:
  pattern: \b(?:Context|ContextCompat)\s*\.\s*RECEIVER_EXPORTED\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: An Android component or receiver exposes an entry point with a weak or unresolved caller permission
    boundary. Manifest merging and runtime authorization may affect the effective policy. Resolve the external entry
    point, its caller or URI grant, and the sensitive operation or resource reached.
  impact: An unauthorized application may invoke exposed operations, read protected data, or change application
    state if no effective caller check protects the entry point.
  remediation: Disable external access when it is unnecessary. Otherwise use suitable signature permissions or explicit
    caller authorization, validate all incoming data, and test access from an untrusted application. Minimize exported
    surfaces and URI grants; validate parsed schemes, hosts and paths, use verified links where appropriate, and
    authorize each sensitive action.
  reviewer: Resolve merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded
    paths, nested intents, read/write grants and permission inheritance. Registration or permission presence alone
    does not prove unauthorized access.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Resolve merged manifests, aliases and SDK defaults; test custom-scheme collision, malformed URLs, encoded paths,
    nested intents, read/write grants and permission inheritance. Registration or permission presence alone does
    not prove unauthorized access.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Disable external access when it is unnecessary. Otherwise use suitable signature permissions or explicit caller
    authorization, validate all incoming data, and test access from an untrusted application. Minimize exported
    surfaces and URI grants; validate parsed schemes, hosts and paths, use verified links where appropriate, and
    authorize each sensitive action.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
