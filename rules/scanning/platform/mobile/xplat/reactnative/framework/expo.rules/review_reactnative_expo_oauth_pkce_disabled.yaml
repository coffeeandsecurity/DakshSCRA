format: daksh-pattern-rule/v1
id: mobile.xplat.reactnative.framework.expo.review_reactnative_expo_oauth_pkce_disabled
title: Native OAuth Proof-Key Protection Disabled
order: 5
category: AUTH Review
detection:
  pattern: \busePKCE\s*:\s*false\b
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: An authorization-request configuration explicitly disables proof-key protection. Resolve the public
    native client and authorization-code flow; check the exact redirect handler and provider requirements.
  impact: A bypassed identity decision may grant access to protected actions or data, depending on server enforcement
    and key binding.
  remediation: Enforce authorization on the trusted server and bind local authentication to protected keys or credentials
    where required; use external-browser authorization and proof-key protection for public native clients.
  reviewer: Test cancellation, device-credential fallback, enrollment changes, stale reuse windows, redirect interception
    and unavailable secure storage; local biometrics do not replace server authorization.
  review_steps:
  - Resolve the exact instance, declaration, value and release configuration.
  - Test cancellation, device-credential fallback, enrollment changes, stale reuse windows, redirect interception
    and unavailable secure storage; local biometrics do not replace server authorization.
  - Confirm reachability and security impact before confirming an issue.
  recommendations:
  - Enforce authorization on the trusted server and bind local authentication to protected keys or credentials where
    required; use external-browser authorization and proof-key protection for public native clients.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
