format: daksh-pattern-rule/v1
id: kubernetes.core.secret_exposed_as_environment_variable
title: Secret Exposed as Environment Variable
order: 11
category: Secrets Management
detection:
  pattern: secretKeyRef\s*:|valueFrom\s*:[^}]*secretKeyRef
  conditions:
  - WHEN PRESENT ${pattern}
  - 'WHEN EXPR MISSING:volumes\s*:|volumeMounts\s*:'
reporting:
  type: area_of_interest
  reason: Detects Kubernetes Secrets mounted as environment variables rather than projected volumes.
  trace:
  - Externalized rule logic for Secret Exposed as Environment Variable.
  description: The code declares an entry point, model, destination, or configuration value that may cross a trust
    boundary. Identify callers, recipients, and the required data-access policy.
  impact: A boundary that trusts unauthorized callers or exposes private output may permit data disclosure or state
    changes. A declaration, address, or architectural marker alone does not establish such a failure.
  remediation: Trace the actual boundary, restrict accepted inputs and recipients, and enforce authentication and
    object-level authorization where required. Verify both authorized and denied use cases.
  reviewer: Verify secrets are mounted as volumes rather than environment variables where possible. This can be
    confirmed as an issue when the matched path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Inspect the matched construct in its containing function or configuration and identify the security-sensitive
    behavior under review.
  - Verify reachable callers, external influence and effective protections, including deployment overrides and failure
    paths.
  - Record concrete evidence for a confirmed issue or a justified suppression; retain an unresolved outcome when
    the required evidence is unavailable.
  recommendations:
  - Apply the rule-specific correction above only after verifying the affected behavior and required control.
  - Add a regression case for the unsafe condition and a valid protected case; verify the effective behavior in
    the relevant deployment.
scan_config:
  match_mode: line
  context_lines_before: '1'
  context_lines_after: '0'
  aggregate: file
  highlight_enabled: 'true'
  highlight_color: red
