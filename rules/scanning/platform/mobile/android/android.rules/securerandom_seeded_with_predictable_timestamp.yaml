format: daksh-pattern-rule/v1
id: mobile.android.core.securerandom_seeded_with_predictable_timestamp
title: SecureRandom Seeded with Predictable Timestamp
order: 28
category: Cryptographic Failures
detection:
  pattern: \.setSeed\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects SecureRandom seeded with a timestamp or other predictable value, destroying cryptographic randomness.
  trace:
  - Externalized mobile rule logic for SecureRandom Seeded with Predictable Timestamp.
  description: 'Review target: SecureRandom Seeded with Predictable Timestamp. The checked source uses a random
    generator, cryptographic primitive, or initialization value whose suitability depends on its security purpose
    and inputs. Determine whether the operation protects secrets, authenticates data or serves a non-security purpose;
    resolve algorithm, mode and key provenance.'
  impact: Predictable secrets or unsuitable cryptographic parameters may enable credential guessing, reveal plaintext,
    or weaken integrity when used to protect security-sensitive data. Non-security hashes and identifiers do not
    establish this condition.
  remediation: Use a cryptographically secure generator for secrets and modern purpose-appropriate cryptography.
    Use unique nonces, protected keys, and a vetted password-hashing scheme where passwords are stored. Use supported
    authenticated cryptography, securely generated keys and nonces, and platform-backed key storage; replace hardcoded
    or constant key material.
  reviewer: Verify that setSeed() is not called with predictable values on any SecureRandom instance used in security-sensitive
    generation. This can be confirmed as an issue when the matched path is reachable and required controls are missing,
    weak, or inconsistent. Distinguish checksums from authentication, asymmetric RSA transformations from symmetric
    ECB, and test IV/nonce reuse, fixed keys and algorithm migration.
  review_steps:
  - Identify the purpose of the cryptographic operation, algorithm, mode, key or nonce handling, and protected data.
  - Distinguish password storage, confidentiality, integrity and non-security checksums; each requires different
    controls.
  - Inspect deployed configuration and all encrypt, decrypt or verification paths before deciding whether the use
    is unsafe.
  - Determine whether the operation protects secrets, authenticates data or serves a non-security purpose; resolve
    algorithm, mode and key provenance.
  - Distinguish checksums from authentication, asymmetric RSA transformations from symmetric ECB, and test IV/nonce
    reuse, fixed keys and algorithm migration.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Use maintained high-level cryptographic APIs appropriate to the purpose; use authenticated encryption for confidential
    application data.
  - For passwords, use the platform password-hashing facility rather than a fast general-purpose digest. Verify
    key, nonce and migration handling for affected data.
  - Use supported authenticated cryptography, securely generated keys and nonces, and platform-backed key storage;
    replace hardcoded or constant key material.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '3'
  context_lines_after: '1'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
