format: daksh-pattern-rule/v1
id: mobile.xplat.flutter.core.isolate_spawnuri_with_remote_uri
title: "Remote Isolate Loading Review"
order: 7
category: Framework-Specific Issues - Flutter
detection:
  pattern: \bIsolate\.spawnUri\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects Isolate.spawnUri calls pointing to remote HTTP/HTTPS URIs.
  trace:
  - Externalized mobile rule logic for Isolate.spawnUri with Remote URI.
  description: 'Review target: Isolate.spawnUri with Remote URI. The code obtains executable material or replaces
    application behavior at runtime. Determine the origin, integrity checks, and intended deployment scope. Identify
    the untrusted input or update supplier and the precise executable, object or destination file it controls.'
  impact: A party able to substitute executable material or a runtime hook may run code with application privileges,
    inspect protected data, or alter security checks.
  remediation: Load only approved code from trusted locations, verify signatures or integrity before execution,
    and restrict runtime replacement to documented, authorized behavior. Verify signed updates and compatibility,
    restrict decoded types, and enforce canonical destination containment before extraction or execution.
  reviewer: Confirm the URI passed to Isolate.spawnUri is a bundled asset path and not derived from any external
    source. This can be confirmed as an issue when the matched path is reachable and required controls are missing,
    weak, or inconsistent. Test tampered updates, downgrade/replay, absolute paths, traversal, sibling-prefix and
    symlink escapes, size limits and partial failure; an unrelated validation call does not protect this operation.
  review_steps:
  - Trace the origin of downloaded or dynamically loaded code and inspect its integrity and publisher verification.
  - Check which privileges the loaded material receives and whether external input can change the source or verification
    policy.
  - Verify failure behavior when integrity or authenticity checks fail; dynamic loading alone does not establish
    compromise.
  - Identify the untrusted input or update supplier and the precise executable, object or destination file it controls.
  - Test tampered updates, downgrade/replay, absolute paths, traversal, sibling-prefix and symlink escapes, size
    limits and partial failure; an unrelated validation call does not protect this operation.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Use trusted distribution channels and verify authenticity and integrity before executing downloaded material.
  - Restrict allowed sources and execution capabilities and test that failed verification prevents loading or execution.
  - Verify signed updates and compatibility, restrict decoded types, and enforce canonical destination containment
    before extraction or execution.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
