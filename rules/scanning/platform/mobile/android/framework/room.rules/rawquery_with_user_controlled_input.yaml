format: daksh-pattern-rule/v1
id: mobile.android.framework.room.rawquery_with_user_controlled_input
title: "SQL Injection Review"
order: 1
category: Framework-Specific Issues - Room (Android)
detection:
  pattern: '@RawQuery|rawQuery\s*\(\s*[^,)]*\+|rawQuery\s*\(\s*[^,)]*\$\{'
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects use of Room @RawQuery or rawQuery() with potential for unsanitized input.
  trace:
  - Externalized mobile rule logic for RawQuery with User-Controlled Input.
  description: 'Review target: RawQuery with User-Controlled Input. The code constructs a query, selection, or ordering
    clause with values that may be externally controlled. Resolve whether those values enter syntax or bound data.
    Identify the actual sensitive value and the recipients, retention and user-consent context of this exposure
    or capability.'
  impact: Attacker-controlled query syntax may change selected records, bypass intended filters, or modify stored
    data with the connection or provider’s privileges.
  remediation: Bind data values using the query API’s parameter mechanism. Choose ordering columns and other identifiers
    from a fixed allowlist, and enforce record-level authorization. Minimize collection and retention, redact secret
    values, and apply the platform controls needed for sensitive UI and data sharing.
  reviewer: Confirm @RawQuery implementations construct queries from controlled sources or use SupportSQLiteQuery
    with bound arguments. This can be confirmed as an issue when the matched path is reachable and required controls
    are missing, weak, or inconsistent. Test release logging, crash-report payloads, screenshot/background snapshots
    and clipboard lifetime; permission or API capability alone does not establish collection or malicious behavior.
  review_steps:
  - Locate the final query and determine whether caller-controlled data can alter its structure; inspect interpolated
    fragments and raw-query helpers.
  - Verify that values are bound by the database driver. For identifiers or sort directions that cannot be bound,
    inspect a fixed mapping of allowed choices.
  - Record the reachable caller and effective controls; a constant query or correctly bound value does not establish
    injection.
  - Identify the actual sensitive value and the recipients, retention and user-consent context of this exposure
    or capability.
  - Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime; permission
    or API capability alone does not establish collection or malicious behavior.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Bind data values with the driver or ORM parameter API; avoid constructing query syntax from external strings.
  - Use fixed mappings for dynamic identifiers and ordering. Test that unusual input remains data and that the database
    account has only required privileges.
  - Minimize collection and retention, redact secret values, and apply the platform controls needed for sensitive
    UI and data sharing.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '3'
  context_lines_after: '0'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
