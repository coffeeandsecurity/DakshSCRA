format: daksh-pattern-rule/v1
id: mobile.ios.core.evaluatejavascript_with_potentially_user_controlled_input
title: "WebView Script Execution Review"
order: 9
category: Platform-Specific Issues - iOS Runtime Security
detection:
  pattern: \.evaluateJavaScript\s*\(
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Detects evaluateJavaScript calls that may execute user-controlled or unsanitized script strings.
  trace:
  - Externalized mobile rule logic for evaluateJavaScript with Potentially User-Controlled Input.
  description: 'Review target: evaluateJavaScript with Potentially User-Controlled Input. The code invokes an interpreter,
    process, dynamic expression, or template-execution mechanism. Trace executable selection and evaluated content
    to their trust boundaries. Resolve the loaded content and frame origin, the exact WebView instance, and the
    native operations available to that content.'
  impact: If an attacker controls interpreted syntax or the operation selected, code or commands may run with the
    application’s privileges, allowing data theft, state changes, or service disruption.
  remediation: Replace externally influenced evaluation with fixed operations and data-only inputs. Use separate
    argument arrays for processes, allowlist permitted operations, and keep untrusted text out of executable templates
    or expressions. Restrict schemes and parsed hosts, isolate external content, and validate messages and permissions
    on the native side.
  reviewer: Inspect the script string construction to determine if user-controlled data flows in without sanitization
    or encoding. This can be confirmed as an issue when the matched path is reachable and required controls are
    missing, weak, or inconsistent. Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes,
    and a safe WebView beside an unsafe instance; JavaScript enablement alone is not a vulnerability.
  review_steps:
  - Determine whether the matched operation interprets code, expressions or templates; identify its execution context
    and permissions.
  - Trace control over the executed text and distinguish fixed application code from externally influenced content.
  - Inspect restrictions and failure paths; record a reachable input-to-execution path before confirming code execution.
  - Resolve the loaded content and frame origin, the exact WebView instance, and the native operations available
    to that content.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Confirm reachability, the selected release build and the effect on a sensitive value before confirming an issue.
  recommendations:
  - Replace externally assembled code with fixed operations and data-only inputs where possible.
  - Keep template or expression sources under application control; restrict exposed capabilities and test rejection
    of unexpected syntax.
  - Restrict schemes and parsed hosts, isolate external content, and validate messages and permissions on the native
    side.
scan_config:
  match_mode: file
  context_type: lines
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  report_format: default
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
