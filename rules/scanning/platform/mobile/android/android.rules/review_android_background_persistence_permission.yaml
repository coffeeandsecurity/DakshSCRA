format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_background_persistence_permission
title: "Background Execution Capability"
order: 78
category: PRIVACY Review
detection:
  pattern: <uses-permission(?:-sdk-23)?\b[^>]{0,500}\b[A-Za-z_][\w.-]*:name\s*=\s*["\x27](?:android\.permission\.RECEIVE_BOOT_COMPLETED|android\.permission\.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)["\x27]
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The manifest declares background-service, boot, wake-lock, or related persistence capabilities. Identify
    the actual sensitive value and the recipients, retention and user-consent context of this exposure or capability.
  impact: Unnecessary or undisclosed background activity may prolong data collection, consume device resources,
    or continue network activity beyond the user’s expected application lifecycle.
  remediation: Limit background execution to justified tasks, provide required user-visible notifications and controls,
    and stop services and release wake locks when their work ends. Minimize collection and retention, redact secret
    values, and apply the platform controls needed for sensitive UI and data sharing.
  reviewer: Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime;
    permission or API capability alone does not establish collection or malicious behavior.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test release logging, crash-report payloads, screenshot/background snapshots and clipboard lifetime; permission
    or API capability alone does not establish collection or malicious behavior.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Limit background execution to justified tasks, provide required user-visible notifications and controls, and
    stop services and release wake locks when their work ends. Minimize collection and retention, redact secret
    values, and apply the platform controls needed for sensitive UI and data sharing.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
