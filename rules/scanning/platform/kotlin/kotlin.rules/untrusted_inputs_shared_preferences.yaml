format: daksh-pattern-rule/v1
id: kotlin.core.untrusted_inputs_shared_preferences
title: "Untrusted Input Entry Point"
order: 2
category: Untrusted Input Handling or Injection Flaws
detection:
  pattern: SharedPreferences\.get.*\(".*"
  conditions:
  - WHEN PRESENT ${pattern}
  - WHEN EXPR PRESENT:(execute|query|rawQuery|execSQL|Runtime|ProcessBuilder|File\s*\(|URL\s*\() && MISSING:(validate|sanitize|escape|encode)
reporting:
  type: area_of_interest
  reason: Identifies the usage of Shared Preferences, which may contain untrusted inputs.
  trace:
  - 'Externalized rule logic for Untrusted Inputs: Shared Preferences.'
  description: The application stores sensitive values or configures protection for persistent data. Determine the
    actual storage location, backup policy, and lock-state access restrictions.
  impact: An actor with access to unprotected application files, backups, or overly broad keychain access may recover
    credentials or private records and use them outside the intended trust boundary.
  remediation: Use the platform credential or key store for secrets and appropriate authenticated encryption and
    file protection for private records. Minimize stored data, backup exposure, and lock-state accessibility.
  reviewer: Check for appropriate input handling for data retrieved from Shared Preferences. Assess whether developers
    have implemented proper input validation and sanitization techniques to prevent security vulnerabilities related
    to untrusted inputs. Also verify the usage of output encoding and protection against data tampering to ensure
    the secure handling of data retrieved from Shared Preferences. This can be confirmed as an issue when the matched
    path is reachable and required controls are missing, weak, or inconsistent.
  review_steps:
  - Identify who can supply the matched input, including stored values and upstream services; record its type, size
    limits and trust boundary.
  - Trace the value through transformations to each sensitive operation. Check the protection at that destination
    and resource-level authorization.
  - Inspect the actual validation or protection implementation and its error path. A nearby keyword or a client-side
    check alone is insufficient evidence.
  recommendations:
  - Use server-side type, length and allowed-value checks appropriate to the input. For free-form text, preserve
    legitimate characters and protect each destination separately.
  - Bind database values as parameters, encode output for its rendering context, and constrain file or network destinations
    where applicable. Test rejected input and unauthorized access.
scan_config:
  match_mode: line
  context_lines_before: '3'
  context_lines_after: '2'
  aggregate: none
  highlight_enabled: 'true'
  highlight_color: red
