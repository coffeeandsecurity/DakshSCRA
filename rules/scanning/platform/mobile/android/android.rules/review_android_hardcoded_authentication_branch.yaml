format: daksh-pattern-rule/v1
id: mobile.android.core.review_android_hardcoded_authentication_branch
title: "Hardcoded Authentication Review"
order: 71
category: AUTH Review
detection:
  pattern: \b(?:password|passwd|pin|authToken)\s*(?:==\s*["\x27][^"\x27\r\n]{1,100}["\x27]|\.\s*equals\s*\(\s*["\x27][^"\x27\r\n]{1,100}["\x27]\s*\))
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: Authentication-related code compares against a literal value. Determine whether it is a real credential
    check, a test fixture, or a non-secret state comparison. Trace the actual authorization decision, credential
    binding and failure path rather than accepting a local success marker.
  impact: If a distributed constant acts as an authentication secret or grants privileged access, someone who recovers
    it may impersonate a user or bypass the intended authentication process.
  remediation: Remove embedded authentication secrets and enforce authentication through a trusted verifier. Rotate
    exposed active values and keep test-only bypasses out of release builds. Enforce authorization on the trusted
    server and bind local authentication to protected keys or credentials where required; use external-browser authorization
    and proof-key protection for public native clients.
  reviewer: Test cancellation, device-credential fallback, enrollment changes, stale reuse windows, redirect interception
    and unavailable secure storage; local biometrics do not replace server authorization.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test cancellation, device-credential fallback, enrollment changes, stale reuse windows, redirect interception
    and unavailable secure storage; local biometrics do not replace server authorization.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Remove embedded authentication secrets and enforce authentication through a trusted verifier. Rotate exposed
    active values and keep test-only bypasses out of release builds. Enforce authorization on the trusted server
    and bind local authentication to protected keys or credentials where required; use external-browser authorization
    and proof-key protection for public native clients.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
