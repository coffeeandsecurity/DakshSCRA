format: daksh-pattern-rule/v1
id: mobile.xplat.reactnative.core.review_reactnative_mixed_content
title: "WebView Mixed Content Allowed"
order: 17
category: NETWORK Review
detection:
  pattern: \bmixedContentMode\s*=\s*(?:["\x27]always["\x27]|\{\s*["\x27]always["\x27]\s*\})
  conditions:
  - WHEN PRESENT ${pattern}
reporting:
  type: area_of_interest
  reason: Pattern candidate for manual investigation.
  description: The effective transport policy may permit insecure HTTP content or relax transport protections for
    a WebView, media request, domain, or application. Resolve the loaded content and frame origin, the exact WebView
    instance, and the native operations available to that content.
  impact: A network attacker may read or modify affected cleartext traffic. Modified executable web content may
    also compromise the containing WebView session or exposed native interfaces.
  remediation: Use HTTPS with normal certificate validation. Remove unnecessary transport exceptions, keep any unavoidable
    exception narrowly scoped, and avoid sending credentials or loading executable content over cleartext connections.
    Restrict schemes and parsed hosts, isolate external content, and validate messages and permissions on the native
    side.
  reviewer: Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView
    beside an unsafe instance; JavaScript enablement alone is not a vulnerability.
  review_steps:
  - Trace the matched candidate to its actual value, caller or resource.
  - Test subframes, redirects, javascript/data/content URLs, deceptive host suffixes, and a safe WebView beside
    an unsafe instance; JavaScript enablement alone is not a vulnerability.
  - Resolve release configuration and runtime assumptions before confirming an issue.
  recommendations:
  - Use HTTPS with normal certificate validation. Remove unnecessary transport exceptions, keep any unavoidable
    exception narrowly scoped, and avoid sending credentials or loading executable content over cleartext connections.
    Restrict schemes and parsed hosts, isolate external content, and validate messages and permissions on the native
    side.
scan_config:
  match_mode: file
  context_lines_before: '3'
  context_lines_after: '3'
  aggregate: none
  highlight_enabled: 'true'
  highlight_target: match
  highlight_color: red
